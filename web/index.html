<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#33434e">
  <title>Carro Controle EM80</title>
  <script>
    // Aplica o tema salvo antes de desenhar a tela (evita piscar).
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('em80:tema'));
        if (t !== 'claro' && t !== 'escuro') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        document.documentElement.setAttribute('data-theme', t === 'escuro' ? 'dark' : 'light');
      } catch (e) { /* ignora */ }
    })();
  </script>
  <!--pwa-->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icone-192.png">
  <link rel="apple-touch-icon" href="img/icone-192.png">
  <!--/pwa-->
  <link rel="stylesheet" href="css/app.css">
</head>
