  <script>
/* js/esquema.js */
/*
 * Desenho esquemático da malha (como o "Lay Out" da planilha da rota):
 * pátios (RH) numerados, ligados pelas linhas L1, L2… de cada EH, com a rota por cima.
 * Gera SVG puro: o mesmo desenho serve para a tela (tocar nos trechos) e para o PDF.
 */
'use strict';

(function (App) {
  const NS = 'http://www.w3.org/2000/svg';
  const M = App.malha;

  function s(tag, attrs = {}, ...filhos) {
    const el = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => { if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v); });
    filhos.flat().forEach((f) => { if (f !== null && f !== undefined) el.appendChild(typeof f === 'string' ? document.createTextNode(f) : f); });
    return el;
  }

  const LARG_EH = 80;
  const LARG_RH = 80;
  const TOPO = 36; // caixa do km + número do pátio
  const BASE = 30; // desvio de baixo + etiquetas dos pontos de atenção
  const ESQ = 24;

  /** Distribui as unidades em filas (como as linhas da planilha), conforme a largura. */
  function distribuir(r, largura, faixa) {
    const utilW = largura - ESQ - 6;
    const i0 = faixa ? Math.max(0, faixa.i0) : 0;
    const i1 = faixa ? Math.min(r.unidades.length - 1, faixa.i1) : r.unidades.length - 1;
    const fator = Math.min(1.25, Math.max(0.62, utilW / 1150));
    const posicoes = [];
    let x = 0; let fila = 0;
    for (let i = i0; i <= i1; i++) {
      const u = r.unidades[i];
      const w = (u.tipo === 'RH' ? LARG_RH : LARG_EH) * fator;
      if (x + w > utilW && x > 0) { fila++; x = 0; }
      posicoes.push({ u, i, x: ESQ + x, w, fila });
      x += w;
    }
    return posicoes;
  }

  /** Faixas (i0, i1) de cada fila do desenho: o PDF desenha uma fila por vez para quebrar página entre elas. */
  function filas(r, largura, faixa) {
    const lista = [];
    distribuir(r, Math.max(300, Math.round(largura || 900)), faixa).forEach((p) => {
      if (!lista[p.fila]) lista[p.fila] = { i0: p.i, i1: p.i };
      lista[p.fila].i1 = p.i;
    });
    return lista;
  }

  /**
   * op: {
   *   ramal,                       // da malha
   *   largura,                     // px disponíveis
   *   camadas: [{ trechos: Set, cor, estilo: 'cheio'|'tracejado'|'fino', desloc }],
   *   pontos: [{ id, trecho, cor, texto, titulo }],
   *   inicioIntervalo,             // trecho marcado como início ("de… até…")
   *   faixa: { i0, i1 },           // só parte do ramal (PDF)
   *   aoTocar(trecho), aoTocarPonto(ponto)
   * }
   *
   * Desenho como o Lay Out da planilha: cada pátio (RH) com a caixa do km e o número,
   * desvios acima e abaixo e o travessão entre as linhas, onde o carro muda de linha.
   */
  function desenhar(op) {
    const r = op.ramal;
    const linhas = r.linhas;
    const largura = Math.max(300, Math.round(op.largura || 900));
    const posicoes = distribuir(r, largura, op.faixa);
    const PASSO = largura < 600 ? 28 : 24; // no celular, linhas mais afastadas para acertar o toque
    const kDe = (l) => linhas.indexOf(l);

    // Altura de cada fila conforme as linhas que existem nela (L3 só onde houver).
    const nFilas = posicoes.length ? posicoes[posicoes.length - 1].fila + 1 : 1;
    const maxK = [];
    posicoes.forEach((p) => { p.u.linhas.forEach((l) => { maxK[p.fila] = Math.max(maxK[p.fila] ?? 0, kDe(l)); }); });
    const topoFila = [];
    let acc = 0;
    for (let f = 0; f < nFilas; f++) { topoFila[f] = acc; acc += TOPO + (maxK[f] || 0) * PASSO + BASE; }
    const H = acc + 4;
    const yLinha = (f, k) => topoFila[f] + TOPO + k * PASSO;

    const svg = s('svg', { viewBox: `0 0 ${largura} ${H}`, width: largura, height: H, class: 'esquema', role: 'img', 'aria-label': `Esquema ${r.nome}` });
    const gBase = s('g', { class: 'esq-base' });
    const gRota = s('g', { class: 'esq-rota' });
    const gTxt = s('g');
    const gAlvo = s('g');
    const gPontos = s('g');

    // Trilho desenhado como na planilha: barra clara com contorno escuro.
    const trilho = (d, extra = '') => [
      s('path', { d, class: `esq-trilho-borda ${extra}` }),
      s('path', { d, class: `esq-trilho-miolo ${extra}` })
    ];
    const seg = (x1, y1, x2, y2) => `M${x1.toFixed(1)},${y1.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)}`;

    // Rótulos das linhas no começo de cada fila.
    for (let f = 0; f < nFilas; f++) {
      const presentes = new Set(posicoes.filter((p) => p.fila === f).flatMap((p) => p.u.linhas));
      linhas.forEach((l, k) => { if (presentes.has(l)) gTxt.appendChild(s('text', { x: 2, y: yLinha(f, k) + 3, class: 'esq-rot-linha' }, `L${l}`)); });
    }

    // Linhas que a rota usa em cada unidade (por camada), para saber onde há troca de linha nos pátios.
    const usa = (c, idx, l) => {
      const u = r.unidades[idx];
      return !!u && c.trechos.has(M.trecho(u.id, l));
    };

    posicoes.forEach(({ u, i: idx, x: ux, w, fila: f }) => {
      const ks = u.linhas.map(kDe).filter((k) => k >= 0).sort((a, b) => a - b);
      if (!ks.length) return;
      const yTop = yLinha(f, ks[0]);
      const yBot = yLinha(f, ks[ks.length - 1]);

      // Trilhos (base).
      ks.forEach((k) => gBase.append(...trilho(seg(ux, yLinha(f, k), ux + w, yLinha(f, k)))));

      // Travessões do pátio (entre cada par de linhas vizinhas): E "/" e D "\".
      const travessoes = [];
      if (u.tipo === 'RH') {
        for (let n = 0; n < ks.length - 1; n++) {
          const la = linhas[ks[n]]; const lb = linhas[ks[n + 1]];
          const yA = yLinha(f, ks[n]); const yB = yLinha(f, ks[n + 1]);
          travessoes.push({ lado: 'E', la, lb, x1: ux + w * 0.12, y1: yB, x2: ux + w * 0.42, y2: yA, xCima: ux + w * 0.42, xBaixo: ux + w * 0.12, t: M.travessao(u.id, 'E', la, lb) });
          travessoes.push({ lado: 'D', la, lb, x1: ux + w * 0.58, y1: yA, x2: ux + w * 0.88, y2: yB, xCima: ux + w * 0.58, xBaixo: ux + w * 0.88, t: M.travessao(u.id, 'D', la, lb) });
        }
        travessoes.forEach((tv) => gBase.append(...trilho(seg(tv.x1, tv.y1, tv.x2, tv.y2), 'fino')));
        // Caixa do km e número do pátio.
        const km = M.fmtKm(u.ini);
        const bw = Math.max(34, km.length * 5 + 8);
        const top = topoFila[f];
        gTxt.append(
          s('rect', { x: ux + w / 2 - bw / 2, y: top + 2, width: bw, height: 11, class: 'esq-km-caixa' }),
          s('text', { x: ux + w / 2, y: top + 10.5, class: 'esq-km', 'text-anchor': 'middle' }, km),
          s('text', { x: ux + w / 2, y: top + 25, class: 'esq-num', 'text-anchor': 'middle' }, u.curto));
      }

      // Rota de cada camada.
      (op.camadas || []).forEach((c) => {
        const dy = c.desloc || 0;
        const classe = `esq-camada esq-${c.estilo || 'cheio'}`;
        const desenharRota = (d) => gRota.appendChild(s('path', { d, class: classe, stroke: c.cor }));
        const Y = (l) => yLinha(f, kDe(l)) + dy;
        if (u.tipo !== 'RH') {
          u.linhas.forEach((l) => { if (usa(c, idx, l)) desenharRota(seg(ux, Y(l), ux + w, Y(l))); });
          return;
        }
        // No pátio: linha por onde chega (EH anterior), por onde sai (EH seguinte) e travessões usados.
        const tvs = travessoes.filter((tv) => c.trechos.has(tv.t));
        tvs.forEach((tv) => desenharRota(seg(tv.x1, tv.y1 + dy, tv.x2, tv.y2 + dy)));
        u.linhas.forEach((l) => {
          const chega = usa(c, idx - 1, l); const sai = usa(c, idx + 1, l); const noPatio = usa(c, idx, l);
          const pontos = tvs.flatMap((tv) => (tv.la === l ? [tv.xCima] : tv.lb === l ? [tv.xBaixo] : []));
          const x0 = ux; const x1 = ux + w;
          if (chega && sai) return desenharRota(seg(x0, Y(l), x1, Y(l)));
          if (!pontos.length) {
            if (noPatio) desenharRota(seg(x0, Y(l), x1, Y(l)));
            else if (chega) desenharRota(seg(x0, Y(l), ux + w * 0.5, Y(l))); // termina no pátio
            else if (sai) desenharRota(seg(ux + w * 0.5, Y(l), x1, Y(l))); // começa no pátio
            return;
          }
          const pMin = Math.min(...pontos); const pMax = Math.max(...pontos);
          if (chega) desenharRota(seg(x0, Y(l), pMax, Y(l))); // chega por esta linha até o travessão
          else if (sai) desenharRota(seg(pMin, Y(l), x1, Y(l))); // sai por esta linha depois do travessão
          else if (pontos.length > 1) desenharRota(seg(pMin, Y(l), pMax, Y(l))); // entre dois travessões
        });
      });

      // Áreas de toque (uma por linha) e travessões.
      u.linhas.forEach((l) => {
        const y = yLinha(f, kDe(l));
        const t = M.trecho(u.id, l);
        if (op.inicioIntervalo === t) gRota.appendChild(s('circle', { cx: ux + w / 2, cy: y, r: 8, class: 'esq-inicio' }));
        if (!op.aoTocar) return;
        const alvo = s('rect', { x: ux, y: y - PASSO / 2 + 2, width: w, height: PASSO / 2 + 4, class: 'esq-alvo', 'data-trecho': t },
          s('title', {}, `${u.rotulo} · L${l} · km ${M.fmtKm(u.ini)} a ${M.fmtKm(u.fim)}`));
        alvo.addEventListener('click', () => op.aoTocar(t, u, l));
        gAlvo.appendChild(alvo);
      });
      if (op.aoTocar) {
        travessoes.forEach((tv) => {
          const alvo = s('path', { d: seg(tv.x1, tv.y1, tv.x2, tv.y2), class: 'esq-alvo-tv', 'data-trecho': tv.t },
            s('title', {}, `Travessão ${u.rotulo}: L${tv.lado === 'E' ? tv.lb : tv.la} → L${tv.lado === 'E' ? tv.la : tv.lb} (troca de linha)`));
          alvo.addEventListener('click', () => op.aoTocar(tv.t, u, ''));
          gAlvo.appendChild(alvo);
        });
      }
    });

    // Pontos de atenção: etiqueta acima da primeira linha ou abaixo da última, como na planilha.
    const grupos = new Map();
    (op.pontos || []).forEach((p) => {
      const { id, linha } = M.separar(p.trecho || '');
      const x = r.unidades.find((u) => u.id === id);
      const k = x ? kDe(linha) : -1;
      const lado = k <= 0 && x && x.tipo !== 'RH' && x.linhas.length > 1 ? 'cima' : 'baixo';
      const chave = `${id}|${lado}`;
      if (!grupos.has(chave)) grupos.set(chave, { id, lado, lista: [] });
      grupos.get(chave).lista.push(p);
    });
    grupos.forEach(({ id, lado, lista }) => {
      const pos = posicoes.find((p) => p.u.id === id);
      if (!pos) return;
      const { u, x: ux, w, fila: f } = pos;
      const ks = u.linhas.map(kDe).sort((a, b) => a - b);
      const y = lado === 'cima' ? yLinha(f, ks[0]) - 21 : yLinha(f, ks[ks.length - 1]) + 10;
      const mostrar = lista.length > 2 ? [lista[0], { ...lista[1], texto: `+${lista.length - 1}`, titulo: lista.slice(1).map((p) => p.titulo || p.texto).join('\n') }] : lista;
      const total = Math.max(56, w * 0.9);
      const larg = total / mostrar.length;
      const x0 = ux + w / 2 - total / 2;
      mostrar.forEach((p, n) => {
        const g = s('g', { class: 'esq-ponto', transform: `translate(${(x0 + n * larg).toFixed(1)},${y})` },
          s('rect', { width: Math.max(8, larg - 1).toFixed(1), height: 11, fill: p.cor, class: 'esq-ponto-caixa' }),
          s('text', { x: (larg - 1) / 2, y: 8.3, class: 'esq-ponto-txt', 'text-anchor': 'middle' }, String(p.texto || '').slice(0, Math.max(3, Math.floor(larg / 4.4)))),
          s('title', {}, p.titulo || p.texto || ''));
        if (op.aoTocarPonto) g.addEventListener('click', (e) => { e.stopPropagation(); op.aoTocarPonto(n === 0 ? lista[0] : lista[1]); });
        gPontos.appendChild(g);
      });
    });

    svg.append(gBase, gRota, gTxt, gAlvo, gPontos);
    return svg;
  }

  /** Faixa de unidades (índices) que contém os trechos e pontos, com uma folga. */
  function faixaDe(ramal, trechos, folga = 1) {
    let a = Infinity; let b = -Infinity;
    ramal.unidades.forEach((u, i) => {
      if (trechos.some((t) => M.separar(t).id === u.id)) { a = Math.min(a, i); b = Math.max(b, i); }
    });
    if (!Number.isFinite(a)) return null;
    return { i0: Math.max(0, a - folga), i1: Math.min(ramal.unidades.length - 1, b + folga) };
  }

  App.esquema = { desenhar, faixaDe, filas };
})(window.App);

</script>

/*
 * Análise do arquivo CSV do carro controle (aba dentro do Checklist):
 * bitola frontal × traseira, OGMS × KLD, tangentes e curvas, perda de bitola,
 * alinhamento e ranking de nivelamento. Sempre com o km no eixo X.
 */
'use strict';

(function (App) {
  const { U, ui, store, charts } = App;
  const B = App.bitola;
  const { h } = ui;
  const CHAVE = 'bitola:ultimo';
  const CHAVE_PLANTA = 'planta:base';
  const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

  let raiz;
  let arquivo = null; // resultado de B.lerCSV
  let nomeArquivo = '';
  let resultado = null; // resultado de B.analisar
  const OPCOES_PADRAO = { ...B.PADRAO, alinhamento: 'alr10', modo: 'hibrido', ajusteKm: 'auto', offset: { bitola: 'bitT', valor: 0, aplicar: false }, bitolas: ['bitF', 'bitT'] };
  let opcoes = { ...OPCOES_PADRAO, ...(U.pref.get('bitola:opcoes', {}) || {}) };
  let planta = null; // { nome, importadoEm, elementos, ramais }
  let infoPlanta = null; // { ramal, linha, ajuste, acerto, qtd, automatico }
  const cacheAjuste = new Map();
  let rankingCampo = 'nl20';
  let zoom = null; // { x0, x1 } ou null (trecho todo)
  let graficos = [];

  const secoes = {};

  function montar(el) {
    raiz = el;
    ['arquivo', 'planta', 'parametros', 'kpis', 'offset', 'graficos', 'elementos', 'ranking'].forEach((k) => { secoes[k] = h('div'); });
    raiz.append(
      h('div', { class: 'tela-cab' },
        h('h1', { text: 'Análise do arquivo do carro controle' }),
        h('p', { class: 'sub', text: 'Bitola frontal × traseira, OGMS × KLD, tangentes e curvas, alinhamento e nivelamento.' })),
      secoes.arquivo, secoes.planta, secoes.parametros, secoes.kpis, secoes.offset, secoes.graficos, secoes.elementos, secoes.ranking);
    renderArquivo();
    carregarPlanta().then(carregarUltimo);
  }

  /* ---------------- Arquivo ---------------- */

  async function carregarUltimo() {
    try {
      const salvo = await store.get(CHAVE);
      if (salvo && salvo.texto) processar(salvo.texto, salvo.nome, { salvar: false });
    } catch (e) { /* sem arquivo salvo */ }
  }

  async function lerArquivo(f) {
    const buf = await f.arrayBuffer();
    let texto;
    try {
      texto = new TextDecoder('utf-8', { fatal: true }).decode(buf);
    } catch (e) {
      texto = new TextDecoder('windows-1252').decode(buf); // arquivos do carro costumam vir em ANSI
    }
    processar(texto, f.name, { salvar: true });
  }

  function processar(texto, nome, { salvar }) {
    try {
      arquivo = B.lerCSV(texto);
    } catch (e) {
      arquivo = null;
      resultado = null;
      renderTudo();
      ui.toast(`Não foi possível ler o arquivo: ${e.message}`, 'erro', 7000);
      return;
    }
    nomeArquivo = nome || 'arquivo.csv';
    zoom = null;
    recalcular();
    if (salvar) store.set(CHAVE, { nome: nomeArquivo, texto }).catch(() => {});
  }

  function salvarOpcoes() {
    U.pref.set('bitola:opcoes', opcoes);
  }

  /** Configuração da planta para o arquivo aberto (ramal, linha, elementos e ajuste de km). */
  let problemaPlanta = '';
  function configurarPlanta() {
    infoPlanta = null;
    problemaPlanta = '';
    if (!arquivo || !planta || opcoes.modo === 'curvatura') return null;
    // O ramal vem do arquivo CSV. A localização (EH/RH e elemento) é feita pelo km; a coluna LINHA
    // só escolhe a linha da planta consultada primeiro e é mostrada como informação (pode ser 0, 1, 2, 3 ou um texto).
    const ramal = B.ramalDaPlanta(arquivo.meta.ramal, planta.ramais);
    if (!ramal) { problemaPlanta = `O ramal do arquivo (${arquivo.meta.ramal || '—'}) não existe na planta. Elementos identificados pela curvatura.`; return null; }
    const linhasPlanta = (planta.ramais[ramal] || []).map(String);
    // Linha de referência: a linha válida mais frequente no arquivo; sem nenhuma válida, a L1 (ou a primeira do ramal).
    const contagem = new Map();
    const valores = arquivo.linhasValores || [String(arquivo.meta.linha || '')];
    (arquivo.linhaIdx || []).forEach((k) => contagem.set(k, (contagem.get(k) || 0) + 1));
    const resumoLinhas = [...contagem.entries()].sort((a, b) => b[1] - a[1])
      .map(([k, q]) => ({ valor: valores[k] || '—', valida: B.linhaDaPlanta(valores[k], linhasPlanta), pct: (q / arquivo.pos.length) * 100 }));
    const valida = resumoLinhas.find((x) => x.valida);
    const linha = valida ? valida.valida : (linhasPlanta.includes('1') ? '1' : linhasPlanta[0]);
    const localizar = B.localizador(planta, ramal, arquivo, linha);
    const els = B.elementosDaPlanta(planta, ramal, linha);
    let ajuste = 0; let acerto = null; const automatico = opcoes.ajusteKm === 'auto';
    if (automatico) {
      const k = `${nomeArquivo}|${arquivo.pos.length}|${ramal}|${linha}|${opcoes.limiarCurva}|${opcoes.suavizacao}`;
      if (!cacheAjuste.has(k)) cacheAjuste.set(k, B.ajusteAutomatico(arquivo.pos, arquivo.dados.curv, els, opcoes));
      ({ ajuste, acerto } = cacheAjuste.get(k));
    } else {
      ajuste = Number(opcoes.ajusteKm) || 0;
    }
    infoPlanta = { ramal, linha, ajuste, acerto, automatico, qtd: els.length, linhasArquivo: resumoLinhas, conferencia: conferirRamal(ramal, linha, els) };
    return { els, ajuste, localizar };
  }

  /**
   * Confere se as curvas do arquivo combinam com o ramal/linha do CSV. TU e LT (e outros ramais) têm os mesmos km:
   * se as curvas combinarem bem melhor com outro ramal, avisa (o ramal do arquivo continua valendo).
   */
  const cacheConferencia = new Map();
  function conferirRamal(ramal, linha, els) {
    const k = `${nomeArquivo}|${arquivo.pos.length}|${ramal}|${linha}`;
    if (cacheConferencia.has(k)) return cacheConferencia.get(k);
    const { pos } = arquivo; const curv = arquivo.dados.curv;
    const propria = B.compatibilidade(pos, curv, els, opcoes);
    let melhorOutro = null;
    Object.entries(planta.ramais).forEach(([r, linhas]) => linhas.forEach((l) => {
      if (r === ramal && String(l) === linha) return;
      const c = B.compatibilidade(pos, curv, B.elementosDaPlanta(planta, r, l), opcoes);
      if (!melhorOutro || c.nota > melhorOutro.nota) melhorOutro = { ...c, ramal: r, linha: String(l) };
    }));
    const suspeito = !!(melhorOutro && melhorOutro.nota >= 60 && melhorOutro.nota >= propria.nota + 20 && melhorOutro.ramal !== ramal);
    const res = { nota: propria.nota, outro: melhorOutro, suspeito };
    cacheConferencia.set(k, res);
    return res;
  }

  function recalcular() {
    if (!arquivo) {
      resultado = null;
    } else {
      const cfg = configurarPlanta();
      resultado = B.analisar(arquivo, { ...opcoes, modo: cfg ? opcoes.modo : 'curvatura', elementosPlanta: cfg ? cfg.els : null, localizar: cfg ? cfg.localizar : null, ajusteKm: cfg ? cfg.ajuste : 0 });
    }
    renderTudo();
  }

  /* ---------------- Planta da linha ---------------- */

  async function carregarPlanta() {
    try {
      planta = await store.get(CHAVE_PLANTA);
    } catch (e) { planta = null; }
    renderPlanta();
  }

  function carregarXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = XLSX_URL;
      sc.onload = () => (window.XLSX ? resolve(window.XLSX) : reject(new Error('Leitor de planilhas indisponível.')));
      sc.onerror = () => reject(new Error('Sem internet para carregar o leitor de planilhas.'));
      document.head.appendChild(sc);
    });
  }

  async function importarPlanta(f) {
    ui.toast('Lendo a planta…', 'info', 2000);
    try {
      const XLSX = await carregarXLSX();
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: false });
      let lida = null; let ultimoErro = null;
      for (const nome of wb.SheetNames) {
        try {
          lida = B.lerPlanta(XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: '' }));
          break;
        } catch (e) { ultimoErro = e; }
      }
      if (!lida) throw ultimoErro || new Error('Planta não encontrada no arquivo.');
      planta = { nome: f.name, importadoEm: U.agora(), elementos: lida.elementos, ramais: lida.ramais };
      await store.set(CHAVE_PLANTA, planta);
      cacheAjuste.clear();
      opcoes = { ...opcoes, modo: opcoes.modo === 'curvatura' ? 'hibrido' : opcoes.modo, ajusteKm: 'auto' };
      salvarOpcoes();
      ui.toast(`Planta importada: ${lida.elementos.length.toLocaleString('pt-BR')} elementos.`, 'ok', 5000);
      if (arquivo) recalcular(); else renderPlanta();
    } catch (e) {
      ui.toast(`Não foi possível ler a planta: ${e.message}`, 'erro', 8000);
    }
  }

  function renderPlanta() {
    const input = h('input', { type: 'file', accept: '.xls,.xlsx', onchange: (e) => { const f = e.target.files[0]; if (f) importarPlanta(f); } });
    const resumo = planta
      ? `${planta.nome} · ${planta.elementos.length.toLocaleString('pt-BR')} elementos · ramais ${Object.keys(planta.ramais).join(', ')} · importada em ${U.fmtData(planta.importadoEm)}`
      : 'Importe a planilha "Planta da linha" para separar os elementos por EH e linha. Sem ela, os elementos são identificados pela curvatura.';
    ui.trocar(secoes.planta, h('details', { class: 'cartao detalhes', open: !planta || null },
      h('summary', null, h('strong', { text: 'Planta da linha' }), h('span', { class: 'sub', text: planta ? ` · ${planta.elementos.length.toLocaleString('pt-BR')} elementos` : ' · não importada' })),
      h('div', { class: 'pilha', style: { marginTop: '10px' } },
        h('p', { class: 'sub', text: resumo }),
        ui.campo(planta ? 'Substituir planta (.xls ou .xlsx)' : 'Planta da linha (.xls ou .xlsx)', input, { ajuda: 'Fica guardada neste aparelho. Precisa de internet só na importação.' }),
        planta ? h('button', {
          class: 'btn btn-fantasma',
          onclick: async () => {
            planta = null;
            await store.del(CHAVE_PLANTA).catch(() => {});
            if (arquivo) recalcular(); else renderPlanta();
          }
        }, ui.icone('lixo'), 'Remover planta') : null)));
  }

  function renderTudo() {
    renderArquivo();
    renderPlanta();
    renderParametros();
    renderOffset();
    renderKpis();
    renderGraficos();
    renderElementos();
    renderRanking();
  }

      h('h2', { text: 'Arquivo' }),

      arquivo ? h('div', { class: 'pilha-p' },
        h('p', null, h('strong', { text: nomeArquivo })),
        h('p', { class: 'sub', text: [
          meta.ramal && `Ramal ${meta.ramal}`,
          meta.linha && `Linha ${meta.linha}`,

          meta.inspetor,

        h('button', {

            arquivo = null; resultado = null; nomeArquivo = '';
            await store.del(CHAVE).catch(() => {});
            renderTudo();
          }
        }, ui.icone('lixo'), 'Remover arquivo')) : h('p', { class: 'sub', text: 'O arquivo fica guardado neste aparelho até você remover ou abrir outro.' })));
  }

  /* ---------------- Parâmetros ---------------- */

  function renderParametros() {
    if (!arquivo) return ui.limpar(secoes.parametros);
    const numero = (campo, rotulo, ajuda) => ui.campo(rotulo, h('input', {
      type: 'text',
      inputmode: 'decimal',

    const explicacao = {
      hibrido: 'Os limites de cada elemento vêm da curvatura medida pelo carro; o nome (Curva 01, Tangente 02, EH x/y ou RH) vem da planta.',
      planta: 'Os limites vêm do km da planta (depende do km do carro estar certo).',

    };

          type: 'button',
