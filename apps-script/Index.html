/* js/modulos/eventos.js */
/* Módulo 2 – Registro de Eventos (falhas durante a inspeção). */
'use strict';

(function (App) {
  const { U, ui, dados, config, sync } = App;
  const { h } = ui;
  const COLECAO = 'eventos';

  let raiz;
  let formCartao;
  let abertosEl;
  let recentesEl;
  let lista = [];
  let pendentes = new Map();
  let editando = null; // evento em edição (ou null)
  let f = {}; // campos do formulário

  const vazio = () => ({ equipamento: '', outro: '', parte: '', inicio: '', fim: '', observacao: '' });

  function montar(el) {
    raiz = el;
    f = vazio();
    formCartao = h('section', { class: 'cartao' });
    abertosEl = h('div', { class: 'lista' });
    recentesEl = h('div', { class: 'lista' });
    raiz.append(
      h('div', { class: 'tela-cab' },
        h('h1', { text: 'Registro de Eventos' }),
        h('p', { class: 'sub', text: 'Falhas durante a inspeção. Deixe o fim em branco enquanto a falha estiver ocorrendo.' })),
      formCartao,
      h('section', { class: 'cartao' }, h('h2', { text: 'Em aberto' }), abertosEl),
      h('section', { class: 'cartao' }, h('h2', { text: 'Recentes' }), recentesEl));
    renderForm();
    setInterval(() => {
      if (raiz.offsetParent !== null) renderListas();
    }, 30000);
  }

  /* ---------------- Formulário ---------------- */

  function renderForm() {
    const ehOutro = f.equipamento === 'Outro';
    const historico = lista.filter((e) => !f.equipamento || nomeEquip(f) === e.equipamento);
    const sugestoesParte = U.maisFrequentes(lista.map((e) => e.parte), 15);
    const sugestoesObs = U.maisFrequentes(historico.map((e) => e.observacao), 5);

    const sel = h('select', {
      name: 'equipamento',
      value: f.equipamento,
      onchange: (e) => { f.equipamento = e.target.value; renderForm(); }
    }, h('option', { value: '', text: 'Selecione…' }), config.equipamentos.map((q) => h('option', { value: q, text: q })));

    const dataHora = (campo, rotulo) => {
      const input = h('input', {
        type: 'datetime-local',
        name: campo,
        value: U.paraInputDataHora(f[campo]),
        onchange: (e) => { f[campo] = U.deInputDataHora(e.target.value); }
      });
      return ui.campo(rotulo, h('div', { class: 'linha-campo' }, input,
        h('button', {
          type: 'button',
          class: 'btn btn-secundario',
          onclick: () => { f[campo] = U.agora(); input.value = U.paraInputDataHora(f[campo]); }
        }, ui.icone('relogio'), 'Agora'),
        f[campo] ? h('button', {
          type: 'button',
          class: 'btn-icone',
          'aria-label': `Limpar ${rotulo.toLowerCase()}`,
          onclick: () => { f[campo] = ''; renderForm(); }
        }, ui.icone('x')) : null));
    };

    const obs = h('textarea', {
      name: 'observacao',
      rows: 3,
      maxlength: 2000,
      value: f.observacao,
      placeholder: 'Impacto da falha na inspeção',
      oninput: (e) => { f.observacao = e.target.value; }
    });

    const listaParte = h('datalist', { id: 'dl-partes' }, sugestoesParte.map((p) => h('option', { value: p })));

    ui.trocar(formCartao,
      h('h2', { text: editando ? 'Editar evento' : 'Novo evento' }),
      h('form', { class: 'pilha', novalidate: true, onsubmit: (e) => { e.preventDefault(); salvar(); } },
        h('div', { class: 'grade-2' },
          ui.campo('Equipamento', sel, { obrigatorio: true }),
          ehOutro ? ui.campo('Qual equipamento?', h('input', {
            type: 'text', name: 'outro', maxlength: 80, value: f.outro,
            oninput: (e) => { f.outro = e.target.value; }
          }), { obrigatorio: true }) : null,
          ui.campo('Parte do equipamento', h('input', {
            type: 'text', name: 'parte', maxlength: 120, list: 'dl-partes', value: f.parte,
            oninput: (e) => { f.parte = e.target.value; }
          }))),
        listaParte,
        h('div', { class: 'grade-2' },
          dataHora('inicio', 'Início'),
          dataHora('fim', 'Fim')),
        ui.campo('Observação / impacto', obs),
        sugestoesObs.length ? h('div', { class: 'chips', 'aria-label': 'Observações frequentes' },
          sugestoesObs.map((t) => h('button', {
            type: 'button',
            class: 'chip',
            title: t,
            onclick: () => {
              f.observacao = f.observacao.trim() ? `${f.observacao.trim()}; ${t}` : t;
              obs.value = f.observacao;
            }
          }, t.length > 40 ? `${t.slice(0, 40)}…` : t))) : null,
        h('div', { class: 'barra-acoes' },
          editando
            ? h('button', { type: 'button', class: 'btn btn-secundario', onclick: cancelarEdicao }, 'Cancelar edição')
            : [
              h('button', { type: 'button', class: 'btn btn-secundario', onclick: duplicarUltimo, disabled: !lista.length }, ui.icone('duplicar'), 'Duplicar último'),
              h('button', { type: 'button', class: 'btn btn-secundario', onclick: iniciarAgora }, ui.icone('play'), 'Iniciar agora')
            ],
          h('button', { type: 'submit', class: 'btn btn-primario' }, ui.icone('check'), editando ? 'Salvar alterações' : 'Salvar evento'))));
  }

  const nomeEquip = (x) => (x.equipamento === 'Outro' ? String(x.outro || '').trim() : x.equipamento);

  function paraForm(ev) {
    const conhecido = config.equipamentos.includes(ev.equipamento) && ev.equipamento !== 'Outro';
    return {
      equipamento: conhecido ? ev.equipamento : 'Outro',
      outro: conhecido ? '' : ev.equipamento,
      parte: ev.parte || '',
      inicio: ev.inicio || '',
      fim: ev.fim || '',
      observacao: ev.observacao || ''
    };
  }

  function validar(exigirInicio) {
    const form = formCartao.querySelector('form');
    ui.limparErros(form);
    const erros = [];
    if (!f.equipamento) erros.push(['equipamento', 'Selecione o equipamento.']);
    else if (f.equipamento === 'Outro' && !f.outro.trim()) erros.push(['outro', 'Informe o equipamento.']);
    if (exigirInicio && !f.inicio) erros.push(['inicio', 'Informe o início (ou toque em "Agora").']);
    if (f.inicio && f.fim && f.fim < f.inicio) erros.push(['fim', 'O fim não pode ser antes do início.']);
    erros.forEach(([nome, msg]) => ui.marcarErro(form.querySelector(`[name="${nome}"]`), msg));
    if (erros.length) ui.rolarAte(form.querySelector(`[name="${erros[0][0]}"]`));
    return !erros.length;
  }

  async function gravar(ev, mensagem) {
    try {
      await dados.salvar('evento', COLECAO, ev);
      ui.toast(mensagem, 'ok');
      return true;
    } catch (e) {
      ui.toast(`Não foi possível salvar: ${e.message}`, 'erro', 6000);
      return false;
    }
  }

  async function salvar() {
    if (!validar(true)) return;
    const ev = {
      ...(editando || {}),
      id: editando ? editando.id : U.uuid(),
      equipamento: nomeEquip(f),
      parte: f.parte.trim(),
      inicio: f.inicio,
      fim: f.fim,
      observacao: f.observacao.trim()
    };
    if (await gravar(ev, editando ? 'Evento atualizado.' : (ev.fim ? 'Evento salvo.' : 'Evento salvo (em aberto).'))) {
      editando = null;
      f = vazio();
      await carregar();
    }
  }

  async function iniciarAgora() {
    if (!validar(false)) return;
    const ev = {
      id: U.uuid(),
      equipamento: nomeEquip(f),
      parte: f.parte.trim(),
      inicio: U.agora(),
      fim: '',
      observacao: f.observacao.trim()
    };
    if (await gravar(ev, `Falha iniciada às ${U.fmtHora(ev.inicio)}.`)) {
      f = vazio();
      await carregar();
    }
  }

  function duplicarUltimo() {
    const ultimo = lista[0];
    if (!ultimo) return;
    f = { ...paraForm(ultimo), inicio: '', fim: '' };
    renderForm();
    ui.toast('Dados do último evento copiados. Ajuste os horários.', 'info');
  }

  function editar(ev) {
    editando = ev;
    f = paraForm(ev);
    renderForm();
    ui.rolarAte(formCartao);
  }

  function cancelarEdicao() {
    editando = null;
    f = vazio();
    renderForm();
  }

  async function finalizarAgora(ev) {
    const fim = U.agora();
    if (await gravar({ ...ev, fim: fim < ev.inicio ? ev.inicio : fim }, 'Evento finalizado.')) await carregar();
  }

  /* ---------------- Listas ---------------- */

  function cartaoEvento(ev, aberto) {
    const dur = U.minutosEntre(ev.inicio, aberto ? U.agora() : ev.fim);
    return h('div', { class: `item${aberto ? ' item-aberto' : ''}` },
      h('div', { class: 'item-principal' },
        h('strong', { text: [ev.equipamento, ev.parte].filter(Boolean).join(' · ') }),
        h('span', { class: 'item-sub', text: aberto
          ? `Desde ${U.fmtDataHora(ev.inicio)} · há ${U.fmtDuracao(dur)}`
          : `${U.fmtDataHora(ev.inicio)} → ${ev.fim ? U.fmtHora(ev.fim) : '—'} · ${U.fmtDuracao(dur)}` }),
        ev.observacao ? h('span', { class: 'item-obs', text: ev.observacao }) : null),
      h('div', { class: 'item-lado' },
        pendentes.has(ev.id) ? h('span', { class: 'etiqueta etiqueta-pendente', text: 'Não enviado' }) : null,
        aberto ? h('button', { class: 'btn btn-primario btn-pequeno', onclick: () => finalizarAgora(ev) }, ui.icone('parar'), 'Finalizar agora') : null,
        h('button', { class: 'btn btn-secundario btn-pequeno', onclick: () => editar(ev) }, ui.icone('editar'), 'Editar')));
  }

  function renderListas() {
    const abertos = lista.filter((e) => !e.fim);
    const fechados = lista.filter((e) => e.fim).slice(0, 25);
    ui.trocar(abertosEl, abertos.length ? abertos.map((e) => cartaoEvento(e, true)) : h('p', { class: 'vazio', text: 'Nenhuma falha em aberto.' }));
    ui.trocar(recentesEl, fechados.length ? fechados.map((e) => cartaoEvento(e, false)) : h('p', { class: 'vazio', text: 'Nenhum evento finalizado ainda.' }));
  }

  /** Recarrega a lista. O formulário só é redesenhado quando pedido, para não atrapalhar a digitação. */
  async function carregar({ form = true } = {}) {
    [lista, pendentes] = await Promise.all([dados.listar(COLECAO), sync.pendentesDoTipo('evento')]);
    lista = lista.slice().sort((a, b) => String(b.inicio).localeCompare(String(a.inicio)));
    if (form) renderForm();
    renderListas();
  }

  async function aoMostrar() {
    await carregar();
    try {
      await dados.atualizarDoServidor('evento', COLECAO);
      await carregar({ form: false });
    } catch (e) { /* sem conexão */ }
  }

  document.addEventListener('em80:sincronizado', () => { if (raiz) carregar({ form: false }); });

  App.modulos = App.modulos || [];
  App.modulos.push({ id: 'eventos', titulo: 'Eventos', icone: 'alerta', montar, aoMostrar });
})(window.App);

</script>
  <script>
/* js/modulos/producao.js */
/* Módulo 3 – Produção de OMs: importação, marcação e acompanhamento das metas. */
'use strict';

(function (App) {
  const { U, ui, OM, charts, api } = App;
  const { h } = ui;
  const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

  let raiz;
  let topoEl;
  let painelEl;
  let listaCab;
  let listaEl;
  let dados = null; // { ciclo, oms, exec }
  let ref = U.hoje();
  let refManual = false; // true quando o usuário escolheu outra data
  let aba = 'dia';
  let ramal = '';
  let busca = '';
  const travas = new Set(); // evita toque duplo acidental

  function montar(el) {
    raiz = el;
    topoEl = h('div', { class: 'cartao' });
    painelEl = h('div', { class: 'pilha' });
    listaCab = h('div', { class: 'lista-cab' });
    listaEl = h('div', { class: 'lista-om' });
    raiz.append(
      h('div', { class: 'tela-cab' },
        h('h1', { text: 'Produção de OMs' }),
        h('p', { class: 'sub', text: 'Toque na OM para marcar como realizada. Toque de novo para desfazer.' })),
      topoEl,
      painelEl,
      h('section', { class: 'cartao' }, listaCab, listaEl));
    renderTudo();
  }

  /* ---------------- Carga de dados ---------------- */

  async function carregarLocal() {
    const ciclo = OM.cicloAtivo();
    dados = ciclo ? await OM.carregarLocal(ciclo) : null;
  }

  async function atualizarServidor({ avisar = false } = {}) {
    if (!api.configurado()) return;
    try {
      let ciclo = OM.cicloAtivo();
      if (!ciclo) {
        const ciclos = await api.chamar('getCiclos');
        if (ciclos && ciclos.length) {
          ciclo = ciclos[0].ciclo;
          OM.definirCicloAtivo(ciclo);
        }
      }
      const novos = await OM.atualizarDoServidor(ciclo);
      if (novos) dados = novos;
      renderTudo();
      if (avisar) ui.toast('Dados atualizados.', 'ok');
    } catch (e) {
      if (avisar) ui.toast(`Não foi possível atualizar: ${e.message}`, 'erro', 5000);
    }
  }

  async function aoMostrar() {
    if (!refManual) ref = U.hoje(); // app aberto de um dia para o outro
    await carregarLocal();
    renderTudo();
    await atualizarServidor();
  }

  /* ---------------- Renderização ---------------- */

  function renderTudo() {
    renderTopo();
    renderPainel();
    renderLista();
  }

  async function renderTopo() {
    const ciclos = await OM.ciclosLocais();
    const ativo = OM.cicloAtivo();
    const opcoes = ciclos.map((c) => c.ciclo);
    if (ativo && !opcoes.includes(ativo)) opcoes.unshift(ativo);

    const sel = h('select', {
      'aria-label': 'Ciclo',
      value: ativo,
      onchange: async (e) => {
        OM.definirCicloAtivo(e.target.value);
        await carregarLocal();
        renderTudo();
        atualizarServidor();
      }
    }, opcoes.length ? opcoes.map((c) => h('option', { value: c, text: `Ciclo ${c}` })) : h('option', { value: '', text: 'Nenhum ciclo' }));

    const data = h('input', {
      type: 'date',
      'aria-label': 'Data de referência',
      value: ref,
      onchange: (e) => {
        if (U.parseData(e.target.value)) mudarData(e.target.value);
      }
    });

    ui.trocar(topoEl,
      h('div', { class: 'barra-topo' },
        h('div', { class: 'linha-campo' }, sel,
          h('button', { class: 'btn-icone', 'aria-label': 'Atualizar do servidor', title: 'Atualizar', onclick: () => atualizarServidor({ avisar: true }) }, ui.icone('sync')),
          h('button', { class: 'btn btn-secundario', onclick: abrirImportacao, title: 'Importar planilha do SAP' }, ui.icone('upload'), 'Importar')),
        h('div', { class: 'linha-campo nav-data' },
          h('button', { class: 'btn-icone', 'aria-label': 'Dia anterior', onclick: () => mudarData(U.somarDias(ref, -1)) }, ui.icone('esquerda')),
          data,
          h('button', { class: 'btn-icone', 'aria-label': 'Próximo dia', onclick: () => mudarData(U.somarDias(ref, 1)) }, ui.icone('direita')),
          ref !== U.hoje() ? h('button', { class: 'btn btn-fantasma', onclick: () => mudarData(U.hoje()) }, 'Hoje') : null)));
  }

  function mudarData(d) {
    ref = d;
    refManual = d !== U.hoje();
    renderTudo();
  }

  function renderPainel() {
    if (!dados || !dados.oms.length) {
      ui.trocar(painelEl, h('section', { class: 'cartao vazio-grande' },
        h('p', { text: OM.cicloAtivo() ? `O ciclo ${OM.cicloAtivo()} ainda não foi carregado neste aparelho.` : 'Nenhum ciclo importado ainda.' }),
        h('p', { class: 'sub', text: 'Importe a planilha de OMs do SAP com a coluna "Data Programada".' }),
        h('button', { class: 'btn btn-primario', onclick: abrirImportacao }, ui.icone('upload'), 'Importar planilha')));
      return;
    }
    const m = OM.metricas(dados, ref);
    const ehHoje = ref === U.hoje();
    ui.trocar(painelEl,
      h('div', { class: 'kpis' },
        charts.indicador({ titulo: ehHoje ? 'Hoje' : U.fmtData(ref), ...m.dia, pct: m.dia.pct }),
        charts.indicador({ titulo: `Semana ${U.fmtData(m.semana.inicio).slice(0, 2)}–${U.fmtData(U.somarDias(m.semana.inicio, 4)).slice(0, 5)}`, ...m.semana }),
        charts.indicador({ titulo: `Mês de ${U.fmtMesAno(ref).split(' de ')[0]}`, ...m.mes, extra: `Meta até ${ehHoje ? 'hoje' : U.fmtData(ref).slice(0, 5)}: ${m.mes.metaAteHoje}` }),
        charts.indicador({ titulo: `Ciclo ${dados.ciclo}`, ...m.ciclo })),
      h('div', { class: 'grade-graficos' },
        h('section', { class: 'cartao' }, h('h2', { text: 'Semana: realizado por dia' }), charts.barrasSemana(m.serieSemana, { hoje: ref })),
        h('section', { class: 'cartao' }, h('h2', { text: 'Mês: acumulado' }), charts.linhaMes(m.serieMes, { hoje: ref }))));
  }

  function renderLista() {
    if (!dados || !dados.oms.length) {
      ui.limpar(listaCab);
      ui.limpar(listaEl);
      return;
    }
    const listas = OM.listas(dados, ref);
    const ramais = [...new Set(dados.oms.map((o) => o.ramal))].sort();
    if (ramal && !ramais.includes(ramal)) ramal = '';

    const abaBtn = (id, rotulo, n) => h('button', {
      class: `seg-opcao${aba === id ? ' ativo' : ''}`,
      'aria-pressed': aba === id ? 'true' : 'false',
      onclick: () => { aba = id; renderLista(); }
    }, `${rotulo} (${n})`);

    const campoBusca = h('input', {
      type: 'search',
      placeholder: 'Buscar OM ou trecho',
      'aria-label': 'Buscar OM',
      value: busca,
      oninput: U.debounce((e) => { busca = e.target.value; desenharItens(listas); }, 200)
    });

    ui.trocar(listaCab,
      h('div', { class: 'seg seg-abas', role: 'group', 'aria-label': 'Filtro da lista' },
        abaBtn('dia', ref === U.hoje() ? 'Hoje' : 'Do dia', listas.doDia.length),
        abaBtn('atrasadas', 'Atrasadas', listas.atrasadas.length),
        abaBtn('todas', 'Todas', listas.todas.length)),
      h('div', { class: 'linha-campo filtros' },
        h('select', {
          'aria-label': 'Ramal',
          value: ramal,
          onchange: (e) => { ramal = e.target.value; desenharItens(listas); }
        }, h('option', { value: '', text: 'Ramal: todos' }), ramais.map((r) => h('option', { value: r, text: r }))),
        campoBusca));
    desenharItens(listas);
  }

  function desenharItens(listas) {
    const base = aba === 'dia' ? listas.doDia : aba === 'atrasadas' ? listas.atrasadas : listas.todas;
    const termo = U.normalizar(busca);
    const filtrada = base.filter((o) => (!ramal || o.ramal === ramal)
      && (!termo || U.normalizar(`${o.textoBreve} ${o.nOrdem} ${o.denominacao}`).includes(termo)));

    if (!filtrada.length) {
      const msg = { dia: 'Nenhuma OM programada para este dia.', atrasadas: 'Nenhuma OM atrasada.', todas: 'Nenhuma OM encontrada.' }[aba];
      ui.trocar(listaEl, h('p', { class: 'vazio', text: base.length ? 'Nenhuma OM com esse filtro.' : msg }));
      return;
    }
    const frag = document.createDocumentFragment();
    filtrada.forEach((o) => frag.appendChild(itemOM(o)));
    ui.trocar(listaEl, frag);
  }

  function itemOM(o) {
    const exec = dados.exec[o.nOrdem];
    const feita = !!(exec && exec.status === OM.REALIZADO);
    const atrasada = !feita && o.dataProgramada && o.dataProgramada < U.hoje();
    const info = [];
    if (o.dataProgramada) info.push(h('span', { class: `chip-info${atrasada ? ' atrasada' : ''}`, text: `Prog. ${U.fmtData(o.dataProgramada).slice(0, 5)}` }));
    else info.push(h('span', { class: 'chip-info', text: 'Sem programação' }));
    if (feita && exec.dataRealizacao) info.push(h('span', { class: 'chip-info feita', text: `Feita ${U.fmtData(exec.dataRealizacao).slice(0, 5)} ${U.fmtHora(exec.dataRealizacao)}` }));

    const linha = h('div', { class: `om${feita ? ' om-feita' : ''}`, dataset: { n: o.nOrdem } },
      h('button', {
        class: 'om-botao',
        'aria-pressed': feita ? 'true' : 'false',
        'aria-label': `${o.textoBreve}: ${feita ? 'realizada' : 'não realizada'}. Tocar para alterar.`,
        onclick: () => alternar(o)
      },
      h('span', { class: 'om-marca', 'aria-hidden': 'true' }, feita ? ui.icone('check') : null),
      h('span', { class: 'om-texto' },
        h('strong', { text: o.textoBreve }),
        h('span', { class: 'om-sub', text: `${o.nOrdem}${o.denominacao ? ` · ${o.denominacao}` : ''}` }),
        h('span', { class: 'om-info' }, info)),
      h('span', { class: `om-status ${feita ? 'ok' : ''}`, text: feita ? 'Realizado' : 'Não realizado' })),
      h('button', {
        class: 'btn-icone om-mais',
        'aria-label': `Reprogramar ${o.textoBreve}`,
        title: 'Reprogramar',
        onclick: () => abrirReprogramacao(o)
      }, ui.icone('calendario')));
    return linha;
  }

  async function alternar(o) {
    if (travas.has(o.nOrdem)) return;
    travas.add(o.nOrdem);
    setTimeout(() => travas.delete(o.nOrdem), 700);
    try {
      const novo = await OM.alternar(dados.ciclo, o.nOrdem);
      dados.exec[o.nOrdem] = novo;
      const antigo = listaEl.querySelector(`.om[data-n="${CSS.escape(o.nOrdem)}"]`);
      if (antigo) antigo.replaceWith(itemOM(o));
      renderPainel();
      atualizarContadores();
      if (navigator.vibrate) navigator.vibrate(15);
    } catch (e) {
      ui.toast(`Não foi possível marcar: ${e.message}`, 'erro', 5000);
    }
  }

  function atualizarContadores() {
    const listas = OM.listas(dados, ref);
    const botoes = listaCab.querySelectorAll('.seg-abas .seg-opcao');
    const n = [listas.doDia.length, listas.atrasadas.length, listas.todas.length];
    botoes.forEach((b, i) => { b.textContent = b.textContent.replace(/\(\d+\)$/, `(${n[i]})`); });
  }

  /* ---------------- Reprogramação ---------------- */

  function abrirReprogramacao(o) {
    const input = h('input', { type: 'date', value: o.dataProgramada || ref });
    ui.modal({
      titulo: 'Reprogramar OM',
      conteudo: h('div', { class: 'pilha' },
        h('p', null, h('strong', { text: o.textoBreve }), h('br'), h('span', { class: 'sub', text: o.nOrdem })),
        ui.campo('Nova data programada', input)),
      acoes: [
        { texto: 'Cancelar', classe: 'btn-secundario', onClick: (f) => f() },
        {
          texto: 'Salvar',
          classe: 'btn-primario',
          onClick: async (fechar) => {
            if (!U.parseData(input.value)) {
              ui.marcarErro(input, 'Informe uma data válida.');
              return;
            }
            try {
              await OM.reprogramar(dados.ciclo, o.nOrdem, input.value);
              o.dataProgramada = input.value;
              fechar();
              renderPainel();
              renderLista();
              ui.toast(`OM reprogramada para ${U.fmtData(input.value)}.`, 'ok');
            } catch (e) {
              ui.toast(`Não foi possível reprogramar: ${e.message}`, 'erro');
            }
          }
        }
      ]
    });
  }

  /* ---------------- Importação ---------------- */

  function carregarXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = XLSX_URL;
      s.onload = () => (window.XLSX ? resolve(window.XLSX) : reject(new Error('Leitor de planilhas indisponível.')));
      s.onerror = () => reject(new Error('Sem internet para carregar o leitor de planilhas.'));
      document.head.appendChild(s);
    });
  }

  async function lerArquivo(arquivo) {
    const XLSX = await carregarXLSX();
    const buffer = await arquivo.arrayBuffer();
    const wb = XLSX.read(buffer, { type: 'array', cellDates: false });
    // Usa a primeira aba que tiver a coluna Nº Ordem.
    for (const nome of wb.SheetNames) {
      const linhas = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: '' });
      const r = OM.processarLinhas(linhas);
      if (!r.erros.length || nome === wb.SheetNames[wb.SheetNames.length - 1]) return r;
    }
    return OM.processarLinhas([]);
  }

  async function abrirImportacao() {
    let resultado = null;
    const ciclosExistentes = await OM.ciclosLocais();
    const resumo = h('div', { class: 'pilha' });
    const cicloInput = h('input', {
      type: 'text', inputmode: 'numeric', maxlength: 4, placeholder: 'Ex.: 5',
      oninput: () => desenharResumo()
    });
    const arquivoInput = h('input', {
      type: 'file',
      accept: '.xlsx,.xls,.csv',
      onchange: async (e) => {
        const arq = e.target.files[0];
        resultado = null;
        if (!arq) return desenharResumo();
        ui.trocar(resumo, h('p', { class: 'sub', text: 'Lendo arquivo…' }));
        try {
          resultado = await lerArquivo(arq);
        } catch (err) {
          resultado = { oms: [], avisos: [], erros: [err.message] };
        }
        desenharResumo();
      }
    });
    let botaoImportar = null;

    function desenharResumo() {
      const ciclo = cicloInput.value.trim();
      const cicloOk = /^\d{1,4}$/.test(ciclo);
      const pronto = resultado && !resultado.erros.length && cicloOk;
      if (botaoImportar) botaoImportar.disabled = !pronto;
      if (!resultado) return ui.limpar(resumo);
      if (resultado.erros.length) {
        return ui.trocar(resumo, resultado.erros.map((e) => h('p', { class: 'aviso aviso-erro', text: e })));
      }
      const porRamal = {};
      resultado.oms.forEach((o) => { const r = OM.ramal(o.textoBreve); porRamal[r] = (porRamal[r] || 0) + 1; });
      const existente = ciclosExistentes.find((c) => c.ciclo === ciclo);
      const avisos = resultado.avisos.slice(0, 6);
      ui.trocar(resumo,
        h('p', null, h('strong', { text: `${resultado.oms.length} OMs encontradas` }),
          ` · ${resultado.oms.length - resultado.semDataProgramada} com data programada`),
        h('p', { class: 'sub', text: Object.entries(porRamal).sort((a, b) => b[1] - a[1]).map(([r, n]) => `${r}: ${n}`).join(' · ') }),
        existente ? h('p', { class: 'aviso', text: `O ciclo ${ciclo} já existe (${existente.total} OMs). As OMs serão substituídas pelas deste arquivo; as realizações já lançadas são mantidas.` }) : null,
        avisos.map((a) => h('p', { class: 'aviso', text: a })),
        resultado.avisos.length > avisos.length ? h('p', { class: 'sub', text: `…e mais ${resultado.avisos.length - avisos.length} aviso(s).` }) : null);
    }

    const m = ui.modal({
      titulo: 'Importar planilha de OMs',
      conteudo: h('div', { class: 'pilha' },
        h('p', { class: 'sub', text: 'Use a exportação do SAP com a coluna "Data Programada" preenchida.' }),
        ui.campo('Número do ciclo', cicloInput, { obrigatorio: true }),
        ui.campo('Arquivo (.xlsx)', arquivoInput, { obrigatorio: true }),
        resumo),
      acoes: [
        { texto: 'Cancelar', classe: 'btn-secundario', onClick: (f) => f() },
        {
          texto: 'Importar',
          classe: 'btn-primario',
          onClick: async (fechar) => {
            if (!resultado || resultado.erros.length) return;
            botaoImportar.disabled = true;
            botaoImportar.textContent = 'Importando…';
            try {
              const r = await OM.importar(cicloInput.value.trim(), resultado.oms);
              fechar();
              await carregarLocal();
              aba = 'dia';
              renderTudo();
              ui.toast(`${r.importadas} OMs importadas no ciclo ${r.ciclo}.`, 'ok', 5000);
            } catch (e) {
              botaoImportar.disabled = false;
              botaoImportar.textContent = 'Importar';
              ui.toast(e.codigo === 'REDE' ? 'Sem conexão. A importação precisa de internet.' : `Erro na importação: ${e.message}`, 'erro', 6000);
            }
          }
        }
      ]
    });
    botaoImportar = m.caixa.querySelector('.modal-acoes .btn-primario');
    botaoImportar.disabled = true;
  }

  App.modulos = App.modulos || [];
  App.modulos.push({ id: 'producao', titulo: 'Produção', icone: 'grafico', montar, aoMostrar });
})(window.App);

</script>

/* js/modulos/ajustes.js */
/* Ajustes: conexão com o servidor, sincronização, tema e dados do aparelho. */
'use strict';

(function (App) {
  const { U, ui, api, sync, store, config } = App;
  const { h } = ui;

  const NOMES_TIPO = {
    checklist: 'Checklist',
    evento: 'Evento',
    anomalia: 'Anomalia',
    execucao: 'Marcação de OM',
    reprogramacao: 'Reprogramação de OM'
  };

  let raiz;
  let conexaoEl;
  let syncEl;
  let temaEl;

  function montar(el) {
    raiz = el;
    conexaoEl = h('section', { class: 'cartao' });
    syncEl = h('section', { class: 'cartao' });
    temaEl = h('section', { class: 'cartao' });
    raiz.append(
      h('div', { class: 'tela-cab' }, h('h1', { text: 'Ajustes' })),
      conexaoEl, syncEl, temaEl,
      h('section', { class: 'cartao' },
        h('h2', { text: 'Sobre' }),
        h('p', { class: 'sub', text: `App Carro Controle EM80 · versão ${config.versao} (${config.build}) · modo ${api.modo() === 'appsscript' ? 'Apps Script' : 'site (PWA)'}` }),
        h('div', { class: 'linha-acoes' },
          h('button', {
            class: 'btn btn-secundario',
            onclick: async () => {
              const publicada = await App.versao.verificar();
              if (publicada === null) ui.toast('Não foi possível conferir agora (sem internet?).', 'erro');
              else if (publicada === config.build) ui.toast('Você já está na versão mais recente.', 'ok');
            }
          }, ui.icone('sync'), 'Procurar atualização'),
          api.modo() === 'web' ? h('button', { class: 'btn btn-secundario', onclick: () => App.versao.atualizar() }, 'Recarregar app') : null),
        h('button', { class: 'btn btn-perigo', onclick: apagarDados }, ui.icone('lixo'), 'Apagar dados deste aparelho')));
    renderConexao();
    renderTema();
    document.addEventListener('em80:sync', () => renderSync());
    document.addEventListener('em80:tema', () => renderTema());
  }

  function renderConexao() {
    const web = api.modo() === 'web';
    const url = h('input', { type: 'url', name: 'url', value: api.config.url(), placeholder: 'https://script.google.com/macros/s/.../exec' });
    const token = h('input', { type: 'text', name: 'token', value: api.config.token(), autocapitalize: 'characters', autocomplete: 'off', spellcheck: 'false', maxlength: 40 });
    const status = h('p', { class: 'sub' });

    const testar = async () => {
      if (web) api.config.setUrl(url.value);
      api.config.setToken(token.value);
      status.textContent = 'Testando…';
      try {
        const r = await api.chamar('ping');
        status.textContent = `Conectado. Servidor versão ${r.versao}.`;
        ui.toast('Conexão funcionando.', 'ok');
        sync.sincronizar({ forcar: true });
      } catch (e) {
        status.textContent = `Falhou: ${e.message}`;
      }
    };

    ui.trocar(conexaoEl,
      h('h2', { text: 'Conexão com a planilha' }),
      h('form', { class: 'pilha', onsubmit: (e) => { e.preventDefault(); testar(); } },
        web ? ui.campo('URL do servidor (Apps Script)', url, { ajuda: 'Link da implantação do Apps Script, terminado em /exec.' }) : null,
        ui.campo('Código de acesso', token, { ajuda: 'Gerado pela função setup() do Apps Script.' }),
        h('div', { class: 'barra-acoes' }, h('button', { type: 'submit', class: 'btn btn-primario' }, 'Salvar e testar')),
        status));
  }

  async function renderSync() {
    if (!syncEl) return;
    const e = sync.estado;
    const itens = await sync.listar();
    ui.trocar(syncEl,
      h('h2', { text: 'Sincronização' }),
      h('p', null,
        e.pendentes ? `${e.pendentes} registro(s) aguardando envio.` : 'Tudo enviado para a planilha.',
        e.ultimoSucesso ? h('span', { class: 'sub', text: ` Último envio: ${U.fmtDataHora(e.ultimoSucesso)}.` }) : null),
      e.erro ? h('p', { class: 'aviso aviso-erro', text: e.erro }) : null,
      itens.length ? h('div', { class: 'lista' }, itens.slice(0, 50).map((i) => h('div', { class: 'item' },
        h('div', { class: 'item-principal' },
          h('strong', { text: NOMES_TIPO[i.tipo] || i.tipo }),
          h('span', { class: 'item-sub', text: `Salvo em ${U.fmtDataHora(i.em)}` }),
          i.erro ? h('span', { class: 'item-obs erro', text: `Erro: ${i.erro}` }) : null)))) : null,
      h('div', { class: 'barra-acoes' },
        h('button', {
          class: 'btn btn-primario',
          disabled: e.sincronizando,
          onclick: () => sync.sincronizar({ forcar: true })
        }, ui.icone('sync'), e.sincronizando ? 'Sincronizando…' : 'Sincronizar agora')));
  }

  function renderTema() {
    if (!temaEl) return;
    const atual = ui.tema.atual();
    const opcao = (valor, rotulo, ic) => h('button', {
      class: `seg-opcao${atual === valor ? ' ativo' : ''}`,
      'aria-pressed': atual === valor ? 'true' : 'false',
      onclick: () => {
        U.pref.set('tema', valor);
        ui.tema.aplicar(valor);
      }
    }, ui.icone(ic), rotulo);
    ui.trocar(temaEl,
      h('h2', { text: 'Aparência' }),
      h('div', { class: 'seg', role: 'group', 'aria-label': 'Tema' }, opcao('claro', 'Claro', 'sol'), opcao('escuro', 'Escuro', 'lua')));
  }

  async function apagarDados() {
    const pend = sync.estado.pendentes;
    const texto = pend
      ? `Atenção: ${pend} registro(s) ainda NÃO foram enviados à planilha e serão perdidos. Apagar mesmo assim?`
      : 'Os dados já estão na planilha. Isso apaga apenas a cópia guardada neste aparelho.';
    const ok = await ui.confirmar('Apagar dados do aparelho', texto, { ok: 'Apagar', perigo: true });
    if (!ok) return;
    await store.limparTudo();
    ['rascunho:checklist', 'rascunho:anomalia', 'cicloAtivo', 'ultimoSync'].forEach((k) => U.pref.del(k));
    ui.toast('Dados do aparelho apagados.', 'ok');
    setTimeout(() => location.reload(), 800);
  }

  function aoMostrar() {
    renderSync();
  }

  App.modulos = App.modulos || [];
  App.modulos.push({ id: 'ajustes', titulo: 'Ajustes', icone: 'ajustes', montar, aoMostrar });
})(window.App);

</script>

/* js/modulos/anomalia.js */
/* Módulo 5 – Relatório de Anomalia (gaveta lateral) com mensagem para o WhatsApp. */
'use strict';

(function (App) {
  const { U, ui, dados, sync } = App;
  const { h } = ui;
  const COLECAO = 'anomalias';
  const RASCUNHO = 'rascunho:anomalia';

  const CAMPOS = [
    { id: 'acaoTomada', rotulo: 'Ação tomada', obrigatorio: true, lista: true },
    { id: 'data', rotulo: 'Data', obrigatorio: true, tipo: 'date' },
    { id: 'local', rotulo: 'Local', obrigatorio: true, lista: true },
    { id: 'kmInicio', rotulo: 'KM início', km: true, placeholder: '000+000' },
    { id: 'kmFim', rotulo: 'KM fim', km: true, placeholder: '000+000' },
    { id: 'defeito', rotulo: 'Defeito', obrigatorio: true, lista: true },
    { id: 'amplitude', rotulo: 'Amplitude', modo: 'decimal' },
    { id: 'observacao', rotulo: 'Observação', area: true },
    { id: 'elemento', rotulo: 'Elemento', lista: true },
    { id: 'latitude', rotulo: 'Latitude', coord: true, placeholder: 'Ex.: -19.9312' },
    { id: 'longitude', rotulo: 'Longitude', coord: true, placeholder: 'Ex.: -43.9401' }
  ];

  let gaveta;
  let corpo;
  let formEl;
  let resultadoEl;
  let historicoEl;
  let f;
  let lista = [];

  const vazio = () => ({ ...Object.fromEntries(CAMPOS.map((c) => [c.id, ''])), data: U.hoje() });
  const salvarRascunho = U.debounce(() => U.pref.set(RASCUNHO, f), 400);

  /* ---------------- Mensagem ---------------- */

  const linkMapa = (lat, lon) => (lat && lon ? `https://www.google.com/maps/search/?api=1&query=${lat},${lon}` : '');

  /** Monta a mensagem no formato usado no WhatsApp. */
  function mensagem(r) {
    const v = (x) => {
      const t = String(x ?? '').replace(/\*/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
      return t || '-';
    };
    const linhas = [
      ['AÇÃO TOMADA', v(r.acaoTomada)],
      ['DATA', U.fmtData(r.data) || '-'],
      ['LOCAL', v(r.local)],
      ['KM INÍCIO', v(r.kmInicio)],
      ['KM FIM', v(r.kmFim)],
      ['DEFEITO', v(r.defeito)],
      ['AMPLITUDE', v(r.amplitude)],
      ['OBSERVAÇÃO', v(r.observacao)],
      ['ELEMENTO', v(r.elemento)],
      ['LINK DO MAPA', r.linkMapa || linkMapa(r.latitude, r.longitude) || '-']
    ];
    return `*RELATÓRIO DE ANOMALIA*\n\n${linhas.map(([k, x]) => `*▪ ${k}:* ${x}`).join('\n\n')}`;
  }

  function acoesMensagem(texto, { grande = false } = {}) {
    return h('div', { class: 'linha-acoes' },
      h('button', {
        type: 'button',
        class: `btn ${grande ? 'btn-primario' : 'btn-secundario btn-pequeno'}`,
        onclick: async () => {
          const ok = await ui.copiar(texto);
          ui.toast(ok ? 'Mensagem copiada. Cole no WhatsApp.' : 'Não foi possível copiar.', ok ? 'ok' : 'erro');
        }
      }, ui.icone('copiar'), grande ? 'Copiar mensagem' : 'Copiar'));
  }

  /* ---------------- Gaveta ---------------- */

  function montar(raizGaveta) {
    gaveta = raizGaveta;
    corpo = gaveta.querySelector('.gaveta-corpo');
    const rascunho = U.pref.get(RASCUNHO, null) || {};
    const temConteudo = CAMPOS.some((c) => c.id !== 'data' && String(rascunho[c.id] || '').trim());
    f = temConteudo ? { ...vazio(), ...rascunho } : vazio(); // rascunho vazio de outro dia volta para a data de hoje
    formEl = h('form', { class: 'pilha', novalidate: true, onsubmit: (e) => { e.preventDefault(); salvar(); } });
    resultadoEl = h('div');
    historicoEl = h('div', { class: 'lista' });
    corpo.append(resultadoEl, formEl, h('h3', { class: 'titulo-secao', text: 'Enviados recentemente' }), historicoEl);
    renderForm();
  }

  function renderForm() {
    const sugestoes = (campo) => U.maisFrequentes(lista.map((r) => r[campo]), 12);
    const controles = CAMPOS.map((c) => {
      const attrs = {
        name: c.id,
        value: f[c.id] || '',
        placeholder: c.placeholder || null,
        oninput: (e) => { f[c.id] = e.target.value; salvarRascunho(); }
      };
      let ctrl;
      if (c.area) {
        ctrl = h('textarea', { ...attrs, rows: 3, maxlength: 1000 });
      } else if (c.tipo === 'date') {
        ctrl = h('input', { ...attrs, type: 'date' });
      } else {
        ctrl = h('input', {
          ...attrs,
          type: 'text',
          maxlength: 120,
          autocapitalize: 'characters',
          inputmode: c.km || c.coord ? 'tel' : (c.modo || null),
          list: c.lista ? `dl-an-${c.id}` : null
        });
        if (c.km) {
          ctrl.addEventListener('blur', () => {
            f[c.id] = U.formatarKm(ctrl.value);
            ctrl.value = f[c.id];
            salvarRascunho();
          });
        }
        if (c.id === 'latitude') ctrl.addEventListener('paste', colarCoordenadas);
      }
      return [
        ui.campo(c.rotulo, ctrl, { obrigatorio: c.obrigatorio, classe: c.area ? 'campo-largo' : '' }),
        c.lista ? h('datalist', { id: `dl-an-${c.id}` }, sugestoes(c.id).map((s) => h('option', { value: s }))) : null
      ];
    });

    ui.trocar(formEl,
      h('div', { class: 'grade-2' }, controles),
      h('div', { class: 'barra-acoes' },
        h('button', { type: 'button', class: 'btn btn-secundario', onclick: limpar }, 'Limpar'),
        h('button', { type: 'submit', class: 'btn btn-primario' }, ui.icone('check'), 'Salvar e gerar mensagem')));
  }

  /** Permite colar "lat, long" de uma vez no campo de latitude. */
  function colarCoordenadas(e) {
    const texto = (e.clipboardData || window.clipboardData).getData('text');
    const m = /^\s*(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)\s*$/.exec(texto || '');
    if (!m || !/[.]/.test(texto)) return; // "-19,93" sozinho é só uma latitude com vírgula
    e.preventDefault();
    f.latitude = m[1].replace(',', '.');
    f.longitude = m[2].replace(',', '.');
    formEl.querySelector('[name="latitude"]').value = f.latitude;
    formEl.querySelector('[name="longitude"]').value = f.longitude;
    salvarRascunho();
  }

  function validar() {
    ui.limparErros(formEl);
    const erros = [];
    const campo = (id) => formEl.querySelector(`[name="${id}"]`);
    CAMPOS.filter((c) => c.obrigatorio).forEach((c) => {
      if (!String(f[c.id] || '').trim()) erros.push([c.id, `Informe ${c.rotulo.toLowerCase()}.`]);
    });
    if (f.data && !U.parseData(f.data)) erros.push(['data', 'Data inválida.']);
    const lat = U.coordenada(f.latitude, 90);
    const lon = U.coordenada(f.longitude, 180);
    if (lat === null) erros.push(['latitude', 'Latitude inválida (entre -90 e 90).']);
    if (lon === null) erros.push(['longitude', 'Longitude inválida (entre -180 e 180).']);
    if (lat !== null && lon !== null && (!lat) !== (!lon)) erros.push([lat ? 'longitude' : 'latitude', 'Informe latitude e longitude juntas.']);
    erros.forEach(([id, msg]) => ui.marcarErro(campo(id), msg));
    if (erros.length) ui.rolarAte(campo(erros[0][0]));
    return erros.length ? null : { lat, lon };
  }

  async function salvar() {
    const coords = validar();
    if (!coords) return;
    const r = {
      id: U.uuid(),
      acaoTomada: f.acaoTomada.trim(),
      data: f.data,
      local: f.local.trim(),
      kmInicio: U.formatarKm(f.kmInicio),
      kmFim: U.formatarKm(f.kmFim),
      defeito: f.defeito.trim(),
      amplitude: String(f.amplitude || '').trim(),
      observacao: String(f.observacao || '').trim(),
      elemento: String(f.elemento || '').trim(),
      latitude: coords.lat,
      longitude: coords.lon,
      linkMapa: linkMapa(coords.lat, coords.lon)
    };
    try {
      await dados.salvar('anomalia', COLECAO, r);
    } catch (e) {
      ui.toast(`Não foi possível salvar: ${e.message}`, 'erro', 6000);
      return;
    }
    U.pref.del(RASCUNHO);
    const texto = mensagem(r);
    // Mostra a mensagem pronta no topo e já deixa o formulário limpo para o próximo defeito.
    ui.trocar(resultadoEl, h('div', { class: 'resultado' },
      h('div', { class: 'resultado-cab' },
        h('strong', { text: 'Relatório salvo. Mensagem pronta:' }),
        h('button', { type: 'button', class: 'btn-icone', 'aria-label': 'Ocultar mensagem', onclick: () => ui.limpar(resultadoEl) }, ui.icone('x'))),
      h('pre', { class: 'mensagem', text: texto }),
      acoesMensagem(texto, { grande: true })));
    f = vazio();
    renderForm();
    await carregar();
    corpo.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function novo() {
    f = vazio();
    ui.limpar(resultadoEl);
    renderForm();
    corpo.scrollTop = 0;
  }

  async function limpar() {
    const ok = await ui.confirmar('Limpar relatório', 'Apagar os campos preenchidos?', { ok: 'Limpar', perigo: true });
    if (!ok) return;
    U.pref.del(RASCUNHO);
    novo();
  }

  async function carregar() {
    let pendentes;
    [lista, pendentes] = await Promise.all([dados.listar(COLECAO), sync.pendentesDoTipo('anomalia')]);
    ui.trocar(historicoEl, lista.length ? lista.slice(0, 10).map((r) => h('div', { class: 'item item-coluna' },
      h('div', { class: 'item-principal' },
        h('strong', { text: `${U.fmtData(r.data)} · ${r.local || '-'}` }),
        h('span', { class: 'item-sub', text: [r.defeito, r.acaoTomada].filter(Boolean).join(' · ') }),
        pendentes.has(r.id) ? h('span', { class: 'etiqueta etiqueta-pendente', text: 'Não enviado à planilha' }) : null),
      acoesMensagem(mensagem(r)))) : h('p', { class: 'vazio', text: 'Nenhum relatório ainda.' }));
    atualizarSugestoes();
  }

  function atualizarSugestoes() {
    CAMPOS.filter((c) => c.lista).forEach((c) => {
      const dl = formEl.querySelector(`#dl-an-${c.id}`);
      if (dl) ui.trocar(dl, U.maisFrequentes(lista.map((r) => r[c.id]), 12).map((s) => h('option', { value: s })));
    });
  }

  async function aoAbrir() {
    if (!f.data) f.data = U.hoje();
    await carregar();
    try {
      await dados.atualizarDoServidor('anomalia', COLECAO);
      await carregar();
    } catch (e) { /* sem conexão */ }
  }

  document.addEventListener('em80:sincronizado', () => { if (historicoEl) carregar(); });

  App.anomalia = { montar, aoAbrir, mensagem };
})(window.App);

</script>

  function atualizarBotaoTema() {
    const escuro = ui.tema.atual() === 'escuro';
    ui.trocar(temaBtn, ui.icone(escuro ? 'sol' : 'lua'));
    temaBtn.setAttribute('aria-label', escuro ? 'Mudar para tema claro' : 'Mudar para tema escuro');
    temaBtn.title = escuro ? 'Tema claro' : 'Tema escuro';
  }

  function atualizarBadge(e) {
    let icone = 'nuvem';
    let num = '';
    let texto = 'Enviado';
    let classe = 'ok';
    if (e.sincronizando) {
      icone = 'sync'; texto = 'Enviando…'; classe = 'girando';
    } else if (e.pendentes) {
      icone = e.erro || e.comErro ? 'semNuvem' : 'nuvem';
      num = String(e.pendentes);
      texto = ` pendente${e.pendentes > 1 ? 's' : ''}`;
      classe = e.erro || e.comErro ? 'erro' : 'pendente';
    }
    badgeEl.className = `sync-badge ${classe}`;
    const descricao = e.pendentes ? `${e.pendentes} registro(s) aguardando envio` : 'Tudo enviado';
    badgeEl.title = e.erro ? `Sincronização: ${e.erro}` : descricao;
    badgeEl.setAttribute('aria-label', `${descricao}. Abrir sincronização.`);
    ui.trocar(badgeEl, ui.icone(icone), num ? h('span', { class: 'b-num', text: num }) : null, h('span', { class: 'b-txt', text: texto }));
  }

  /* ---------------- Navegação ---------------- */

  function ir(id) {
    const t = telas.get(id);
    if (!t) return;
    if (!t.montado) {
      t.modulo.montar(t.el);
      t.montado = true;
    }
    telas.forEach((x, k) => { x.el.hidden = k !== id; });
    navEl.querySelectorAll('button').forEach((b) => {
      if (b.dataset.id === id) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    if (atual !== id) window.scrollTo(0, 0);
    atual = id;
    U.pref.set('aba', id);
    Promise.resolve(t.modulo.aoMostrar && t.modulo.aoMostrar()).catch((e) => console.error(e));
  }

  /* ---------------- Gaveta de anomalia ---------------- */

  function criarGaveta() {
    gavetaFundo = h('div', { class: 'gaveta-fundo', hidden: true, onclick: fecharGaveta });
    gaveta = h('aside', { class: 'gaveta', 'aria-label': 'Relatório de anomalia', 'aria-hidden': 'true', inert: true },
      h('div', { class: 'gaveta-cab' },
        h('h2', { text: 'Relatório de Anomalia' }),
        h('button', { class: 'btn-icone', 'aria-label': 'Fechar', onclick: fecharGaveta }, ui.icone('x'))),
      h('div', { class: 'gaveta-corpo' }));
    puxador = h('button', { class: 'puxador', onclick: abrirGaveta, 'aria-label': 'Abrir relatório de anomalia' },
      ui.icone('alerta'), h('span', { text: 'Anomalia' }));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && gaveta.classList.contains('aberta') && !document.querySelector('.modal-fundo')) fecharGaveta();
    });
    return [gavetaFundo, gaveta, puxador];
  }

  let abertaEm = 0;

  function abrirGaveta() {
    if (gaveta.classList.contains('aberta')) return;
    try {
      if (!gavetaMontada) {
        App.anomalia.montar(gaveta);
        gavetaMontada = true;
      }
    } catch (e) {
      console.error(e);
      ui.toast(`Não foi possível abrir o relatório: ${e.message}`, 'erro', 8000);
      return;
    }
    abertaEm = Date.now();
    gaveta.classList.add('aberta');
    gaveta.removeAttribute('aria-hidden');
    gaveta.removeAttribute('inert');
    gavetaFundo.hidden = false;
    puxador.hidden = true;
    document.body.classList.add('sem-rolagem');
    Promise.resolve().then(() => App.anomalia.aoAbrir()).catch((e) => console.error(e));
    setTimeout(() => {
      const primeiro = gaveta.querySelector('input:not([type=hidden]), textarea');
      if (primeiro && window.matchMedia('(min-width: 900px)').matches) primeiro.focus();
    }, 250);
  }

  function fecharGaveta(ev) {
    // Ignora o "clique fantasma" que alguns celulares disparam logo após o toque que abriu a gaveta.
    if (ev && ev.currentTarget === gavetaFundo && Date.now() - abertaEm < 600) return;
    gaveta.classList.remove('aberta');
    gaveta.setAttribute('aria-hidden', 'true');
    gaveta.setAttribute('inert', '');
    gavetaFundo.hidden = true;
    puxador.hidden = false;
    document.body.classList.remove('sem-rolagem');
    puxador.focus();
  }

  /* ---------------- Código de acesso ---------------- */

  let pedindoCodigo = false;
  let adiado = false; // "Depois": não pergunta de novo nesta sessão (dá para informar em Ajustes)
  function pedirCodigo() {
    if (pedindoCodigo || adiado) return;
    pedindoCodigo = true;
    const input = h('input', { type: 'text', autocapitalize: 'characters', autocomplete: 'off', value: api.config.token() });
    ui.modal({
      titulo: 'Código de acesso',
      conteudo: h('div', { class: 'pilha' },
        h('p', { text: 'Informe o código de acesso gerado na instalação (função setup do Apps Script).' }),
        ui.campo('Código', input)),
      acoes: [
        { texto: 'Depois', classe: 'btn-secundario', onClick: (f) => { adiado = true; f(); } },
        {
          texto: 'Salvar',
          classe: 'btn-primario',
          onClick: (f) => {
            api.config.setToken(input.value);
            f();
            sync.sincronizar({ forcar: true });
          }
        }
      ],
      aoFechar: () => { setTimeout(() => { pedindoCodigo = false; }, 3000); }
    });
  }

  /* ---------------- Inicialização ---------------- */

  /* ---------------- Versão nova ---------------- */

  /** Apaga a cópia guardada do app (não mexe nos dados) e recarrega. */
  async function atualizarApp() {
    try {
      if ('caches' in window) await Promise.all((await caches.keys()).map((k) => caches.delete(k)));
      if (navigator.serviceWorker) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      }
    } catch (e) { /* segue para recarregar */ }
    location.reload();
  }

  let avisoMostrado = false;
  function avisarVersaoNova() {
    if (avisoMostrado) return;
    avisoMostrado = true;
    const web = api.modo() === 'web';
    const aviso = h('div', { class: 'aviso-versao', role: 'status' },
      h('span', { text: web ? 'Há uma versão nova do app.' : 'Há uma versão nova do app no site.' }),
      web
        ? h('button', { class: 'btn btn-primario btn-pequeno', onclick: atualizarApp }, ui.icone('sync'), 'Atualizar agora')
        : h('a', { class: 'btn btn-primario btn-pequeno', href: App.config.siteUrl, target: '_blank', rel: 'noopener' }, 'Abrir versão nova'),
      h('button', { class: 'btn-icone', 'aria-label': 'Fechar aviso', onclick: () => aviso.remove() }, ui.icone('x')));
    document.body.appendChild(aviso);
  }

  /** Compara a versão aberta com a publicada. Retorna a versão publicada (ou null). */
  async function verificarVersao() {
    if (navigator.onLine === false || !App.config.build || App.config.build === 'em80-dev') return null;
    try {
      const base = api.modo() === 'web' ? new URL('js/config.js', location.href).href : `${App.config.siteUrl}js/config.js`;
      const resp = await fetch(`${base}?v=${Date.now()}`, { cache: 'no-store' });
      if (!resp.ok) return null;
      const m = /build: '([^']+)'/.exec(await resp.text());
      if (m && m[1] !== App.config.build) avisarVersaoNova();
      return m ? m[1] : null;
    } catch (e) {
      return null;
    }
  }

  function registrarServiceWorker() {
    if (api.modo() !== 'web' || !('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service worker não registrado:', e));
  }

  function iniciar() {
    ui.tema.aplicar(ui.tema.atual());
    const raiz = document.getElementById('app');
    const principal = h('main', { class: 'principal', id: 'conteudo' });
    navEl = h('nav', { class: 'nav', 'aria-label': 'Telas' });

    App.modulos.forEach((m) => {
      const el = h('section', { class: 'tela', hidden: true, 'aria-label': m.titulo });
      principal.appendChild(el);
      telas.set(m.id, { modulo: m, el, montado: false });
      navEl.appendChild(h('button', { dataset: { id: m.id }, onclick: () => ir(m.id) },
        ui.icone(m.icone), h('span', { text: m.titulo })));
    });

    ui.trocar(raiz, cabecalho(), navEl, principal, criarGaveta());

    document.addEventListener('em80:sync', (e) => atualizarBadge(e.detail));
    document.addEventListener('em80:tema', atualizarBotaoTema);
    document.addEventListener('em80:auth', pedirCodigo);
    atualizarBadge(sync.estado);

    const inicial = !api.configurado() ? 'ajustes' : U.pref.get('aba', 'checklist');
    ir(telas.has(inicial) ? inicial : 'checklist');
    if (!api.configurado()) ui.toast('Configure a conexão com a planilha para enviar os dados.', 'info', 6000);

    sync.iniciar();
    registrarServiceWorker();
    setTimeout(verificarVersao, 3000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') verificarVersao();
    });
  }

  // Erros inesperados aparecem na tela, para facilitar o diagnóstico em campo.
  const avisados = new Set();
  function avisarErro(erro) {
    console.error(erro);
    if (erro && erro.codigo) return; // erros de comunicação já são tratados na tela
    const msg = String((erro && erro.message) || erro || 'erro desconhecido');
    if (/ResizeObserver loop/.test(msg)) return; // aviso inofensivo do navegador
    if (avisados.has(msg)) return;
    avisados.add(msg);
    try { ui.toast(`Erro inesperado: ${msg}`, 'erro', 8000); } catch (e) { /* ignora */ }
  }
  window.addEventListener('error', (e) => avisarErro(e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => avisarErro(e.reason));

  App.iniciar = iniciar;
  App.versao = { verificar: verificarVersao, atualizar: atualizarApp };
  App.ir = ir;
  iniciar();
})(window.App);

</script>
