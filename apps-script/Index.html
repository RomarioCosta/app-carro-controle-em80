        }, r))), { ajuda: explicacao[opcoes.modo] || '' }),
      usandoPlanta && infoPlanta ? h('p', { class: 'sub', text: `Ramal ${arquivo.meta.ramal} → planta ${infoPlanta.ramal}. EH/RH e elementos localizados pelo km. Coluna LINHA do arquivo (só informativa): ${infoPlanta.linhasArquivo.map((x) => `${x.valor}${x.valida ? '' : ' (não é linha da planta)'} ${fmt(x.pct, 0)}%`).join(' · ')}.${conf ? ` Curvas do arquivo × curvas da planta: ${conf.nota}% de correspondência.` : ''}` }) : null,
      usandoPlanta && conf && conf.suspeito ? h('p', { class: 'aviso aviso-erro', text: `Atenção: as curvas deste arquivo combinam muito mais com o ramal ${conf.outro.ramal}, linha ${conf.outro.linha} (${conf.outro.nota}%) do que com o ramal do arquivo, ${infoPlanta.ramal} (${conf.nota}%). Vários ramais têm os mesmos km: confira a coluna RAMAL do arquivo.` }) : null,
      usandoPlanta && infoPlanta ? h('div', { class: 'grade-3' },
        ui.campo('Correção do km do carro (m)', h('input', {
          type: 'text',
          inputmode: 'tel',
          value: opcoes.ajusteKm === 'auto' ? '' : String(opcoes.ajusteKm).replace('.', ','),
          placeholder: infoPlanta ? `auto: ${fmt(infoPlanta.ajuste, 1)}` : 'auto',
          onchange: (e) => {
            const v = U.numero(e.target.value);
            mudar('ajusteKm', e.target.value.trim() === '' || v === null ? 'auto' : v);
          }
        }), { ajuda: 'O km registrado pelo carro costuma diferir alguns metros do km da planta. Vazio = automático: o app compara as curvas medidas com as curvas da planta e acha a diferença. Digite um valor só se o automático errar.' })) : null,
      usandoPlanta && infoPlanta ? h('p', { class: 'sub', text: `Correção de ${fmt(infoPlanta.ajuste, 1)} m${infoPlanta.automatico ? ' (automática)' : ' (digitada)'}${infoPlanta.acerto !== null ? ` · curvas do arquivo coincidem com as da planta em ${fmt(infoPlanta.acerto, 0)}% do trecho` : ''}.` }) : null,
      opcoes.modo !== 'curvatura' && !infoPlanta && problemaPlanta ? h('p', { class: 'aviso', text: problemaPlanta }) : null) : null;

    ui.trocar(secoes.parametros, h('details', { class: 'cartao detalhes' },
      h('summary', null, h('strong', { text: 'Critérios da análise' }),
        h('span', { class: 'sub', text: ` · ${usandoPlanta ? `elementos da planta (${infoPlanta.ramal}, pelo km, correção ${fmt(infoPlanta.ajuste, 0)} m)` : `curva a partir de |10000/R| ${opcoes.limiarCurva}`} · perda acima de ${opcoes.limitePerda} mm` })),
      h('div', { class: 'pilha', style: { marginTop: '12px' } },
        blocoPlanta,
        h('div', { class: 'grade-2' },
          numero('limitePerda', 'Limite de perda de bitola (mm)', '|Bitola F − Bitola T| acima disso = perda.'),
          numero('limiteElemento', 'Elemento perdeu a bitola acima de (%)', 'Curva ou tangente com % de perda acima disso conta como elemento que perdeu a bitola.'),
          numero('limiteVariacao', 'Limite de variação rápida (mm)', 'Desvio padrão da bitola em 1 m acima disso = provável erro de leitura.'),
          numero('limiarCurva', 'Limite de curva (|10000/R|)', 'Abaixo disso é tangente. 3 ≈ raio de 3.333 m.'),
          numero('suavizacao', 'Suavização da curvatura (m)', 'Média móvel para evitar oscilações.'),
          numero('comprimentoMin', 'Comprimento mínimo do elemento (m)', 'Só no modo pela curvatura: trechos menores são unidos ao vizinho.'))),
      h('button', {
        class: 'btn btn-fantasma',
        onclick: () => {
          opcoes = { ...OPCOES_PADRAO, alinhamento: opcoes.alinhamento, offset: opcoes.offset };
          salvarOpcoes();
          recalcular();
        }
      }, 'Restaurar padrão')));
  }

  /* ---------------- Indicadores ---------------- */

  const NOMES_BITOLA = { bitF: 'Bitola F', bitT: 'Bitola T', kld: 'KLD' };
  const fmt = (v, casas = 1) => (v === null || v === undefined || Number.isNaN(v) ? '—' : v.toFixed(casas).replace('.', ','));

  const int = (v) => Math.round(v || 0).toLocaleString('pt-BR');
  /** Extensão (m) da área acima da regra: pontos acima × espaçamento entre pontos. */
  const extAcima = (perdas) => (perdas || 0) * ((resultado && resultado.esp) || 0.25);

  function renderKpis() {
    if (!resultado) return ui.limpar(secoes.kpis);
    const r = resultado;
    const kpi = (titulo, valor, sub) => h('div', { class: 'kpi' },
      h('div', { class: 'kpi-titulo', text: titulo }),
      h('div', { class: 'kpi-valor', text: valor }),
      h('div', { class: 'kpi-sub', text: sub }));
    ui.trocar(secoes.kpis, h('div', { class: 'kpis kpis-auto' },
      kpi('Perda de bitola', `${fmt(r.geral.pctPerda)}%`, `${int(r.geral.perdas)} pontos acima da regra de ${int(r.geral.pontos)} pontos${r.geral.extensaoRh ? ` · sem os circuitos (RH, ${fmt(r.geral.extensaoRh / 1000, 2)} km)` : ''}${r.geral.cobertura !== null && r.geral.cobertura < 0.95 ? ` · atenção: ${fmt((1 - r.geral.cobertura) * 100, 0)}% sem leitura de F ou T` : ''}`),
      kpi('Elementos que perderam a bitola', `${r.tangentes.comPerda + r.curvas.comPerda} de ${r.tangentes.quantidade + r.curvas.quantidade}`, `${r.tangentes.comPerda} de ${r.tangentes.quantidade} tangente(s) · ${r.curvas.comPerda} de ${r.curvas.quantidade} curva(s) · perda acima de ${fmt(opcoes.limiteElemento ?? 10, 0)}%`),
      kpi('Em tangentes', `${fmt(r.tangentes.pctPerda)}%`, `${int(r.tangentes.perdas)} de ${int(r.tangentes.pontos)} pontos · ${r.tangentes.quantidade} tangente(s) · ${fmt(r.tangentes.extensao / 1000, 2)} km`),
      kpi('Em curvas', `${fmt(r.curvas.pctPerda)}%`, `${int(r.curvas.perdas)} de ${int(r.curvas.pontos)} pontos · ${r.curvas.quantidade} curva(s) · ${fmt(r.curvas.extensao / 1000, 2)} km`),
      kpi('Variação rápida', `${fmt(r.geral.pctVariacao)}%`, `desvio padrão em 1 m acima de ${fmt(opcoes.limiteVariacao, 1)} mm`),
      kpi('OGMS − KLD', `${fmt(r.geral.difKldMedia, 2)} mm`, 'diferença média entre os sensores (não entra na perda)')));
  }

  /* ---------------- Gráficos ---------------- */

  const mais1000 = (arr) => Float64Array.from(arr, (v) => v + B.NOMINAL);
  const nomeAlinhamento = () => B.parametroGrafico(opcoes.alinhamento).nome;

  /** Definição dos gráficos (usada na tela e no laudo). Retorna [{ titulo, op, seletor }]. */
  function definirGraficos({ x0, x1, aoPassar }) {
    const { pos, eventos } = arquivo;
    const r = resultado;
    const d = r.dados; // já com o offset, se aplicado
    const lim = opcoes.limitePerda;
    const faixas = r.elementos.map((e) => ({ ini: e.ini, fim: e.fim, classe: e.tipo === 'C' ? 'faixa-curva' : (e.tipo === 'X' ? 'faixa-fora' : null), rotulo: e.tipo === 'X' ? e.trecho || '' : e.sigla }));
    const nomeAlin = nomeAlinhamento();
    const alertas = Float64Array.from(r.difFT, (v) => (Math.abs(v) > lim ? v : NaN));
    const base = { pos, x0, x1, fmtX: B.fmtKm, aoPassar, faixas };
    const pctPorPonto = new Float64Array(pos.length).fill(NaN);
    r.elementos.forEach((e) => { for (let i = e.i0; i <= e.i1; i++) pctPorPonto[i] = e.pctPerda === null ? NaN : e.pctPerda; });
    const serieBitola = {
      bitF: { nome: 'Bitola F', valores: mais1000(d.bitF), classe: 's1' },
      bitT: { nome: 'Bitola T', valores: mais1000(d.bitT), classe: 's2' },
      kld: { nome: 'KLD', valores: mais1000(r.kldValido), classe: 's3' }
    };
    const escolhidas = (opcoes.bitolas && opcoes.bitolas.length ? opcoes.bitolas : ['bitF', 'bitT']).filter((k) => serieBitola[k]);
    const nomesEscolhidas = escolhidas.map((k) => NOMES_BITOLA[k]).join(', ').replace(/, ([^,]*)$/, ' e $1');
    // Bitolas: linhas finas; em trechos longos, faixa mín–máx + média (sem borrão).
    const fino = { classe: 'graf-fino' };
    const offsetTxt = opcoes.offset.aplicar && opcoes.offset.valor ? ` · offset ${fmt(opcoes.offset.valor, 1)} mm em ${NOMES_BITOLA[opcoes.offset.bitola]}` : '';
    return [
      { titulo: 'Curvatura (10000/R) — tangentes e curvas', op: { ...base, series: [{ nome: '10000/R', valores: d.curv, classe: 's1' }], referencias: [opcoes.limiarCurva, -opcoes.limiarCurva], eventos } },
      { titulo: `Bitolas (mm): ${nomesEscolhidas}${offsetTxt}`, seletor: 'bitolas', op: { ...base, ...fino, altura: 230, estilo: 'faixa', corteY: 0.01, series: escolhidas.map((k) => serieBitola[k]) } },
      { titulo: `${B.parametroGrafico(opcoes.alinhamento).grupo}: ${nomeAlin}`, seletor: 'alinhamento', op: { ...base, ...fino, series: [{ nome: nomeAlin, valores: d[opcoes.alinhamento], classe: 's1' }] } },
      { titulo: `Diferença Bitola F − Bitola T (mm) — perda acima de ±${fmt(lim, 0)} mm`, op: { ...base, ...fino, series: [{ nome: 'F − T', valores: r.difFT, classe: 's1' }, { nome: 'Perda', valores: alertas, classe: 's-alerta', tipo: 'pontos' }], referencias: [lim, -lim], legenda: false } },
      { titulo: `Variação rápida da bitola: desvio padrão em 1 m (mm) — limite ${fmt(opcoes.limiteVariacao, 1)} mm`, op: { ...base, ...fino, series: [{ nome: 'σ Bitola F', valores: r.varF, classe: 's1' }, { nome: 'σ Bitola T', valores: r.varT, classe: 's2' }], referencias: [opcoes.limiteVariacao] } },
      { titulo: 'Perda de bitola por elemento (%)', op: { ...base, series: [{ nome: '% perda', valores: pctPorPonto, classe: 's1' }], yFaixa: [0, 100] } }
    ];
  }

  function renderGraficos() {
    graficos.forEach((g) => g.destruir());
    graficos = [];
    if (!resultado) return ui.limpar(secoes.graficos);
    const { pos, dados: brutos } = arquivo;
    const r = resultado;
    const d = r.dados;
    const x0 = zoom ? zoom.x0 : pos[0];
    const x1 = zoom ? zoom.x1 : pos[pos.length - 1];
    const info = h('div', { class: 'info-km', 'aria-live': 'polite' }, 'Passe o dedo ou o mouse sobre um gráfico para ver os valores.');
    const nomeAlin = nomeAlinhamento();

    const aoPassar = (p) => {
      graficos.forEach((g) => g.guia(p));
      if (p === null) return;
      const i = B.indicePerto(pos, p);
      const el = B.elementoDo(r.elementos, i);
      const v = (a) => fmt(a[i], 2);
      const b = (a) => (Number.isNaN(a[i]) ? '—' : fmt(a[i] + B.NOMINAL, 2));
      ui.trocar(info,
        h('strong', { text: `${B.fmtKm(pos[i])}` }), el ? ` · ${el.nome}` : '',
        h('span', { text: ` · F ${b(d.bitF)} · T ${b(d.bitT)} · F−T ${v(r.difFT)}` }),
        h('span', { text: ` · KLD ${b(r.kldValido)} · OGMS−KLD ${v(r.difKld)}` }),
        h('span', { text: ` · σ1m ${v(r.variacao)}` }),
        h('span', { text: ` · 10000/R ${v(brutos.curv)} · ${nomeAlin} ${v(d[opcoes.alinhamento])}` }));
    };

    const seletorAlin = h('select', {
      'aria-label': 'Parâmetro do gráfico (alinhamento, nivelamento, empeno, superelevação)',
      value: opcoes.alinhamento,
      onchange: (e) => { opcoes = { ...opcoes, alinhamento: e.target.value }; salvarOpcoes(); recalcular(); }
    }, B.GRUPOS_GRAFICO.map((g) => {
      const itens = g.ids.filter((id) => arquivo.dados[id] && arquivo.dados[id].some((v) => !Number.isNaN(v)));
      return itens.length ? h('optgroup', { label: g.grupo }, itens.map((id) => h('option', { value: id, text: B.parametroGrafico(id).nome }))) : null;
    }));

    const atuais = opcoes.bitolas && opcoes.bitolas.length ? opcoes.bitolas : ['bitF', 'bitT'];
    const seletorBitolas = h('div', { class: 'bitolas-sel', role: 'group', 'aria-label': 'Bitolas no gráfico' },
      Object.entries(NOMES_BITOLA).map(([k, nome]) => h('label', { class: 'chip-sel' },
        h('input', {
          type: 'checkbox',
          checked: atuais.includes(k),
          onchange: (e) => {
            const nova = Object.keys(NOMES_BITOLA).filter((x) => (x === k ? e.target.checked : atuais.includes(x)));
            if (!nova.length) { e.target.checked = true; return; } // pelo menos uma
            opcoes = { ...opcoes, bitolas: nova }; salvarOpcoes(); renderGraficos();
          }
        }), nome)));
    const seletores = { alinhamento: seletorAlin, bitolas: seletorBitolas };

    const conteudo = definirGraficos({ x0, x1, aoPassar }).map(({ titulo, op, seletor }) => {
      const g = charts.graficoKm({ ...op, titulo });
      graficos.push(g);
      return h('div', { class: 'graf-km-item' },
        h('div', { class: 'graf-km-cab' }, h('h3', { text: titulo }), seletor ? seletores[seletor] : null),
        g.el);
    });

    ui.trocar(secoes.graficos, h('section', { class: 'cartao' },
      h('div', { class: 'graf-km-topo' },
        h('h2', { text: 'Gráficos ao longo do km' }),
        h('div', { class: 'linha-campo' },
          h('span', { class: 'sub', text: zoom ? `Trecho: ${B.fmtKm(x0)} → ${B.fmtKm(x1)}` : 'Trecho completo' }),
          zoom ? h('button', { class: 'btn btn-secundario btn-pequeno', onclick: () => { zoom = null; renderGraficos(); } }, 'Ver tudo') : null)),
      h('p', { class: 'sub', text: `Bitola = ${B.NOMINAL} mm + valor do arquivo. Faixas azuis = curvas${r.modo !== 'curvatura' ? '; cinza = RH (circuito)' : ''}. Em trechos longos, as bitolas aparecem como faixa (mín–máx) com a média. Toque numa linha da tabela de elementos ou do ranking para aproximar.` }),
      info,
      conteudo));
  }

  function aproximar(ini, fim, margem = 0.1) {
    const ext = Math.abs(fim - ini) || 50;
    const sentido = arquivo.pos[arquivo.pos.length - 1] >= arquivo.pos[0] ? 1 : -1;
    const a = Math.min(ini, fim) - ext * margem;
    const b = Math.max(ini, fim) + ext * margem;
    zoom = sentido > 0 ? { x0: a, x1: b } : { x0: b, x1: a };
    renderGraficos();
    secoes.graficos.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------------- Elementos ---------------- */

  const barraPct = (pct) => h('div', { class: 'barra-pct' },
    h('span', { class: 'barra-pct-fundo' }, h('span', { style: { width: `${Math.min(pct || 0, 100)}%` } })),
    h('span', { text: `${fmt(pct)}%` }));

  /** Colunas da tabela de elementos (usadas na tela e no laudo). */
  function colunasElementos(paraLaudo) {
    const planta = resultado.modo !== 'curvatura';
    const evs = arquivo.eventos;
    const eventosDo = (e) => {
      const lo = Math.min(e.ini, e.fim); const hi = Math.max(e.ini, e.fim);
      return [...new Set(evs.filter((v) => v.pos >= lo && v.pos <= hi).map((v) => v.texto))].join(', ');
    };
    const pct = (v) => (paraLaudo ? `${fmt(v)}%` : barraPct(v));
    const cols = [];
    // Sempre: trecho (EH/RH) primeiro, depois a linha.
    if (planta) cols.push({ t: 'EH / RH', v: (e) => e.trecho || '—' });
    cols.push({ t: 'Linha', v: (e) => e.linha || linhaAtual() });
    cols.push({ t: 'Elemento', v: (e) => (paraLaudo ? (e.tipo === 'X' ? 'Circuito' : `${e.tipo === 'C' ? 'Curva' : 'Tangente'} ${e.sigla.slice(1)}`) : h('span', { class: `el-tag ${e.tipo === 'C' ? 'el-curva' : e.tipo === 'X' ? 'el-fora' : 'el-tangente'}`, text: e.sigla, title: e.nome })) });
    if (planta) cols.push({ t: 'Lado', v: (e) => (e.tipo === 'C' ? (e.lado === 'D' ? 'Dir.' : e.lado === 'E' ? 'Esq.' : '—') : '') });
    cols.push(
      { t: 'Início', v: (e) => B.fmtKm(e.ini) },
      { t: 'Fim', v: (e) => B.fmtKm(e.fim) },
      { t: 'Ext. (m)', n: true, v: (e) => Math.round(e.extensao).toLocaleString('pt-BR') },
      { t: 'Pontos', n: true, v: (e) => int(e.pontos) },
      { t: 'Pontos acima', n: true, v: (e) => int(e.perdas) },
      { t: 'Ext. acima (m)', n: true, v: (e) => fmt(extAcima(e.perdas), 1) },
      { t: '% perda', n: true, v: (e) => {
        // pouca leitura de F e T no elemento: resultado pouco confiável
        const baixa = e.cobertura !== null && e.cobertura !== undefined && e.cobertura < 0.9;
        if (paraLaudo) return `${fmt(e.pctPerda)}%${baixa ? ' *' : ''}`;
        const v = pct(e.pctPerda);
        return baixa ? h('span', { class: 'baixa-cobertura', title: `Só ${fmt(e.cobertura * 100, 0)}% dos pontos do elemento com Bitola F e T lidas` }, v, ' ⚠') : v;
      } },
      { t: 'Perdeu a bitola', v: (e) => (e.tipo === 'X' ? '—' : e.perdeu ? (paraLaudo ? 'Sim' : h('span', { class: 'perdeu', text: 'Sim' })) : 'Não') },
      { t: `Máx ${nomeAlinhamento()}`, n: true, v: (e) => fmt(e.alinhMax, 2) });
    if (!paraLaudo) cols.push({ t: 'Eventos', ev: true, v: eventosDo });
    return cols;
  }

  /** Linha da inspeção: sempre a do arquivo CSV. */
  function linhaAtual() {
    return String((arquivo && arquivo.meta.linha) || '—'); // a linha é sempre a do arquivo CSV
  }

  /** Do local com maior perda para o com menor (sem medição por último). */
  function porPerda(itens) {
    return itens.map((x, k) => [x, k]).sort((a, b) => {
      const ra = a[0].tipo === 'X' || a[0].rh ? 1 : 0; const rb = b[0].tipo === 'X' || b[0].rh ? 1 : 0; // pátios (RH) por último
      const pa = a[0].pctPerda ?? -1; const pb = b[0].pctPerda ?? -1;
      return ra - rb || pb - pa || a[1] - b[1];
    }).map(([x]) => x);
  }

  /** Resumo por trecho: EH/RH, linha e o elemento com a maior perda de bitola. */
  function colunasEh(paraLaudo) {
    const nomeEl = (p) => {
      if (!p) return '—';
      if (p.tipo === 'X') return 'Circuito';
      const texto = `${p.tipo === 'C' ? 'Curva' : 'Tangente'} ${p.sigla.slice(1)}`;
      return paraLaudo ? texto : h('span', { class: `el-tag ${p.tipo === 'C' ? 'el-curva' : 'el-tangente'}`, text: p.sigla, title: texto });
    };
    return [
      { t: 'EH / RH', v: (g) => g.eh },
      { t: 'Linha', v: (g) => g.linha || linhaAtual() },
      { t: 'Início', v: (g) => B.fmtKm(g.ini) },
      { t: 'Fim', v: (g) => B.fmtKm(g.fim) },
      { t: 'Ext. (m)', n: true, v: (g) => Math.round(g.extensao).toLocaleString('pt-BR') },
      { t: 'Pontos', n: true, v: (g) => int(g.pontos) },
      { t: 'Pontos acima', n: true, v: (g) => int(g.perdas) },
      { t: 'Ext. acima (m)', n: true, v: (g) => fmt(extAcima(g.perdas), 1) },
      { t: '% perda', n: true, v: (g) => `${fmt(g.pctPerda)}%` },
      { t: `Perderam (>${fmt(opcoes.limiteElemento ?? 10, 0)}%)`, n: true, v: (g) => (g.rh ? '—' : `${g.comPerda || 0} de ${(g.tangentes || 0) + (g.curvas || 0)}`) },
      { t: 'Maior perda', v: (g) => nomeEl(g.pior) },
      { t: '% do elemento', n: true, v: (g) => (g.pior ? `${fmt(g.pior.pctPerda)}%` : '—') }
    ];
  }

  function tabelaTela(cols, itens, aoClicar) {
    return h('div', { class: 'tabela-rolagem' }, h('table', { class: 'tabela tabela-centro' },
      h('thead', null, h('tr', null, cols.map((c) => h('th', { text: c.t })))),
      h('tbody', null, itens.map((x) => h('tr', {
        tabindex: '0',
        onclick: () => aoClicar(x),
        onkeydown: (ev) => { if (ev.key === 'Enter') aoClicar(x); }
      }, cols.map((c) => {
        const v = c.v(x);
        return v instanceof Node ? h('td', { class: c.n ? 'num' : '' }, v) : h('td', { class: c.ev ? 'ev' : (c.n ? 'num' : ''), text: v });
      }))))));
  }

  function renderElementos() {
    if (!resultado) return ui.limpar(secoes.elementos);
    const r = resultado;
    const planta = r.modo !== 'curvatura';
    ui.trocar(secoes.elementos,
      planta && r.porEh.length ? h('section', { class: 'cartao' },
        h('h2', { text: 'Resumo por trecho (EH e RH)' }),
        h('p', { class: 'sub', text: `Ramal ${infoPlanta.ramal}. Do trecho com maior perda para o com menor, com o elemento de maior perda em cada um. Toque para aproximar esse elemento.` }),
        tabelaTela(colunasEh(false), porPerda(r.porEh), (g) => (g.pior ? aproximar(g.pior.ini, g.pior.fim) : aproximar(g.ini, g.fim)))) : null,
      h('section', { class: 'cartao' },
        h('h2', { text: planta ? 'Elementos da planta: tangentes e curvas' : 'Elementos: tangentes e curvas' }),
        h('p', { class: 'sub', text: `Do elemento com maior perda para o com menor. ${planta ? 'Elementos e numeração da planta, por trecho (EH x/y; RH = circuito).' : 'Identificados pela curvatura e numerados na ordem da inspeção.'} Ponto acima da regra: |Bitola F − Bitola T| > ${fmt(opcoes.limitePerda, 0)} mm (diferença arredondada a 0,01 mm). % perda = pontos acima da regra ÷ total de pontos do elemento. O elemento perdeu a bitola quando a % de perda passa de ${fmt(opcoes.limiteElemento ?? 10, 0)}%. Ext. acima = pontos acima × ${fmt((resultado && resultado.esp) || 0.25, 2)} m. ⚠ = menos de 90% dos pontos com leitura.` }),
        tabelaTela(colunasElementos(false), porPerda(r.elementos), (e) => aproximar(e.ini, e.fim))));
  }

  /* ---------------- Simulação de offset ---------------- */

  let offsetAberto = false; // mantém o cartão aberto ao trocar a bitola
  function renderOffset() {
    if (!resultado) return ui.limpar(secoes.offset);
    const off = opcoes.offset;
    const original = arquivo.dados;
    const lim = opcoes.limitePerda;
    const simulado = B.dadosComOffset(original, { ...off, valor: off.valor || 0 });
    const mascara = resultado.mascara; // pátios (RH) fora da estatística
    const antes = B.avaliarPerda(original, lim, 0, original.bitF.length - 1, mascara);
    const depois = B.avaliarPerda(simulado, lim, 0, simulado.bitF.length - 1, mascara);
    const porTipo = (dados, tipo) => {
      let pontos = 0; let perdas = 0;
      resultado.elementos.filter((e) => e.tipo === tipo).forEach((e) => {
        const x = B.avaliarPerda(dados, lim, e.i0, e.i1);
        pontos += x.pontos; perdas += x.perdas;
      });
      return pontos ? (perdas / pontos) * 100 : null;
    };
    const mediaKld = (dados) => {
      let n = 0; let soma = 0;
      for (let i = 0; i < dados.bitF.length; i++) {
        const f = dados.bitF[i]; const k = dados.kld[i];
        if (!Number.isNaN(f) && !Number.isNaN(k) && Math.abs(k) < 60) { n++; soma += f - k; }
      }
      return n ? soma / n : null;
    };
    const mudar = (campos) => { offsetAberto = true; opcoes = { ...opcoes, offset: { ...opcoes.offset, ...campos } }; salvarOpcoes(); recalcular(); };

    const valor = h('input', {
      type: 'text', inputmode: 'tel', value: off.valor ? String(off.valor).replace('.', ',') : '', placeholder: '0,0',
      onchange: (e) => { const v = U.numero(e.target.value); mudar({ valor: v === null ? 0 : v }); }
    });
    // porModulo: melhora = mais perto de zero (ex.: OGMS − KLD pode ser negativo).
    const linha = (rotulo, a, b, casas = 1, suf = '%', porModulo = false) => {
      const ok = a !== null && b !== null;
      const va = ok && porModulo ? Math.abs(a) : a; const vb = ok && porModulo ? Math.abs(b) : b;
      const classe = !ok || Math.abs(vb - va) < 1e-9 ? '' : (vb < va ? 'melhor' : 'pior');
      return h('tr', null,
        h('td', { text: rotulo }),
        h('td', { class: 'num', text: `${fmt(a, casas)}${suf}` }),
        h('td', { class: 'num', text: `${fmt(b, casas)}${suf}` }),
        h('td', { class: `num ${classe}`, text: ok ? `${b - a > 0 ? '+' : ''}${fmt(b - a, casas)}` : '—' }));
    };

    const sugestao = off.bitola !== 'kld' ? B.melhorOffset(original, off.bitola, lim, mascara) : null;
    ui.trocar(secoes.offset, h('details', { class: 'cartao detalhes', open: off.valor || offsetAberto ? true : null, ontoggle: (e) => { offsetAberto = e.target.open; } },
      h('summary', null, h('strong', { text: 'Simulação de offset' }),
        h('span', { class: 'sub', text: off.valor ? ` · ${fmt(off.valor, 1)} mm em ${NOMES_BITOLA[off.bitola]}${off.aplicar ? ' (aplicado)' : ''} · perda ${fmt(antes.pct)}% → ${fmt(depois.pct)}%` : ' · escolha uma bitola e um valor' })),
      h('div', { class: 'pilha', style: { marginTop: '12px' } },
        h('p', { class: 'sub', text: 'Soma um valor fixo (mm) a uma das bitolas e mostra quanto a perda de bitola diminui. Use para avaliar se a diferença é um desvio de calibração.' }),
        h('div', { class: 'grade-3' },
          ui.campo('Bitola', h('select', { value: off.bitola, onchange: (e) => mudar({ bitola: e.target.value }) },
            Object.entries(NOMES_BITOLA).map(([k, n]) => h('option', { value: k, text: n })))),
          ui.campo('Offset (mm)', valor, { ajuda: 'Pode ser negativo. Ex.: −0,5' }),
          ui.campo('Aplicar', h('label', { class: 'check' },
            h('input', { type: 'checkbox', checked: off.aplicar, onchange: (e) => mudar({ aplicar: e.target.checked }) }),
            ' Usar nos gráficos, tabelas e laudo'))),
        sugestao ? h('div', { class: 'linha-acoes' },
          h('button', { class: 'btn btn-secundario btn-pequeno', onclick: () => mudar({ valor: sugestao.valor }) }, ui.icone('sync'), `Usar melhor offset: ${fmt(sugestao.valor, 1)} mm`),
          h('span', { class: 'sub', text: `perda mínima possível com offset em ${NOMES_BITOLA[off.bitola]}: ${fmt(sugestao.pct)}%` })) : null,
        h('div', { class: 'tabela-rolagem' }, h('table', { class: 'tabela tabela-offset tabela-centro' },
          h('thead', null, h('tr', null, ['', 'Sem offset', 'Com offset', 'Diferença'].map((t) => h('th', { text: t })))),
          h('tbody', null,
            linha('Perda de bitola (geral)', antes.pct, depois.pct),
            linha('Perda em tangentes', porTipo(original, 'T'), porTipo(simulado, 'T')),
            linha('Perda em curvas', porTipo(original, 'C'), porTipo(simulado, 'C')),
            linha('OGMS − KLD médio', mediaKld(original), mediaKld(simulado), 2, ' mm', true)))))));
  }

  /* ---------------- Ranking de nivelamento ---------------- */

  function renderRanking() {
    if (!resultado) return ui.limpar(secoes.ranking);
    const disponiveis = B.NIVELAMENTO.filter((p) => arquivo.dados[p.id] && arquivo.dados[p.id].some((v) => !Number.isNaN(v)));
    if (!disponiveis.some((p) => p.id === rankingCampo) && disponiveis.length) rankingCampo = disponiveis[0].id;
    const lista = B.ranking(arquivo, resultado.elementos, rankingCampo, { limite: 10, separacao: 10 });
    const nome = (B.NIVELAMENTO.find((p) => p.id === rankingCampo) || {}).nome || rankingCampo;
    ui.trocar(secoes.ranking, h('section', { class: 'cartao' },
      h('h2', { text: 'Ranking de nivelamento' }),
      h('p', { class: 'sub', text: 'Os 10 maiores valores (em módulo) do teste. Picos a menos de 10 m entre si contam como um só ponto.' }),
      h('div', { style: { marginBottom: '10px' } },
        h('select', {
          class: 'select-auto',
          'aria-label': 'Parâmetro de nivelamento',
          value: rankingCampo,
          onchange: (e) => { rankingCampo = e.target.value; renderRanking(); }
        }, disponiveis.map((p) => h('option', { value: p.id, text: p.nome })))),
      lista.length ? h('div', { class: 'tabela-rolagem' }, h('table', { class: 'tabela tabela-centro' },
        h('thead', null, h('tr', null, ['#', 'km', nome, 'Elemento'].map((t) => h('th', { text: t })))),
        h('tbody', null, lista.map((x) => h('tr', { tabindex: '0', onclick: () => aproximar(x.pos - 50, x.pos + 50, 0) },
          h('td', { text: String(x.posicao) }),
          h('td', { text: x.km }),
          h('td', { class: 'num', text: fmt(x.valor, 2) }),
          h('td', { text: x.elemento })))))) : h('p', { class: 'vazio', text: 'Sem dados para este parâmetro.' })));
  }

  /* ---------------- Laudo em PDF ---------------- */

  const RESULTADOS = ['Aprovado', 'Aprovado com ressalvas', 'Reprovado'];

  async function abrirLaudo() {
    if (!resultado) return;
    const checklists = await App.dados.listar('checklists');
    const dataInspecao = arquivo.meta.data || '';
    const responsavel = h('input', { type: 'text', maxlength: 80, value: U.pref.get('ultimoResponsavel', '') });
    const res = h('select', null, RESULTADOS.map((r) => h('option', { value: r, text: r })));
    const parecer = h('textarea', { rows: 4, maxlength: 2000, placeholder: 'Parecer técnico, ressalvas e recomendações' });
    const doMesmoDia = checklists.find((c) => U.fmtData(c.data) === dataInspecao);
    const ck = h('select', null,
      h('option', { value: '', text: 'Não incluir' }),
      checklists.slice(0, 20).map((c) => h('option', { value: c.id, text: `${U.fmtData(c.data)} · Ciclo ${c.ciclo} · ${c.responsavel}` })));
    ck.value = doMesmoDia ? doMesmoDia.id : (checklists[0] ? checklists[0].id : '');

    ui.modal({
      titulo: 'Gerar laudo',
      conteudo: h('div', { class: 'pilha' },
        h('p', { class: 'sub', text: 'O laudo reúne a análise do arquivo, o checklist escolhido e o campo de aceite. Na janela de impressão, escolha "Salvar como PDF".' }),
        ui.campo('Responsável pela análise', responsavel),
        ui.campo('Resultado', res),
        ui.campo('Parecer', parecer),
        ui.campo('Checklist incluído', ck, { ajuda: checklists.length ? null : 'Nenhum checklist salvo ainda.' })),
      acoes: [
        { texto: 'Cancelar', classe: 'btn-secundario', onClick: (f) => f() },
        {
          texto: 'Gerar PDF',
          classe: 'btn-primario',
          onClick: async (fechar) => {
            if (responsavel.value.trim()) U.pref.set('ultimoResponsavel', responsavel.value.trim());
            let checklist = checklists.find((c) => c.id === ck.value) || null;
            // Checklist feito em outro aparelho: busca as respostas na planilha.
            if (checklist && !(Array.isArray(checklist.respostas) && checklist.respostas.length)) {
              try {
                checklist = await App.api.chamar('getChecklist', { id: checklist.id });
              } catch (e) {
                ui.toast(`Não foi possível buscar as respostas do checklist na planilha (${e.message}). O laudo sai só com o cabeçalho do checklist.`, 'erro', 8000);
                checklist = { ...checklist, respostas: [], amostras: [] };
              }
            }
            fechar();
            imprimirLaudo({ responsavel: responsavel.value.trim(), resultado: res.value, parecer: parecer.value.trim(), checklist });
          }
        }
      ]
    });
  }

  function montarLaudo(info) {
    const r = resultado;
    const m = arquivo.meta;
    const pos = arquivo.pos;
    const agora = U.agora();
    const tabela = (cab, linhas, classe = '') => h('table', { class: `laudo-tabela ${classe}` },
      h('thead', null, h('tr', null, cab.map((t) => h('th', { text: t })))),
      h('tbody', null, linhas.map((l) => h('tr', null, l.map((c) => (c instanceof Node ? h('td', null, c) : h('td', { text: c === null || c === undefined ? '' : String(c) })))))));
    const secao = (titulo, ...filhos) => h('section', { class: 'laudo-secao' }, h('h2', { text: titulo }), filhos);
    const foto = document.querySelector('.cab-foto');

    // Gráficos com largura fixa (o PDF reduz para caber na página).
    const graficosLaudo = definirGraficos({ x0: pos[0], x1: pos[pos.length - 1], aoPassar: null })
      .map(({ titulo, op }) => ({ titulo, g: charts.graficoKm({ ...op, titulo, altura: 140 }) }));

    const nivel = B.NIVELAMENTO.filter((p) => arquivo.dados[p.id] && arquivo.dados[p.id].some((v) => !Number.isNaN(v)));
    const tabelaCols = (cols, itens) => tabela(cols.map((c) => c.t), itens.map((x) => cols.map((c) => c.v(x))), 'centro');
    const off = opcoes.offset;
    const criterios = [
      `Bitola = ${B.NOMINAL} mm + valor do arquivo.`,
      `Ponto acima da regra: |Bitola F − Bitola T| > ${fmt(opcoes.limitePerda, 0)} mm, com a diferença arredondada a 0,01 mm (exatamente ${fmt(opcoes.limitePerda, 0)},00 mm não está acima); só pontos com Bitola F e T lidas. % perda = pontos acima da regra ÷ total de pontos. Curva ou tangente perdeu a bitola quando a % de perda passa de ${fmt(opcoes.limiteElemento ?? 10, 0)}%. * = elemento com menos de 90% dos pontos com leitura.`,
      `Variação rápida quando o desvio padrão da bitola em 1 m passa de ${fmt(opcoes.limiteVariacao, 1)} mm.`,
      r.modo !== 'curvatura'
        ? `${r.modo === 'hibrido' ? 'Elementos com limites pela curvatura medida e nomes da planta da linha' : 'Elementos pelo km da planta da linha'} (${planta.nome}), por trecho EH x/y e RH (circuito); circuitos (RH) fora das estatísticas gerais: ramal ${infoPlanta.ramal} do arquivo CSV, localização pelo km (a coluna LINHA é só informativa), correção do km de ${fmt(infoPlanta.ajuste, 1)} m${infoPlanta.automatico ? ' (automático' + (infoPlanta.acerto !== null ? `, curvas coincidentes em ${fmt(infoPlanta.acerto, 0)}% do trecho` : '') + ')' : ''}.`
        : `Elementos pela curvatura: curva quando |10000/R| ≥ ${fmt(opcoes.limiarCurva, 1)} (média móvel de ${fmt(opcoes.suavizacao, 0)} m; elementos com menos de ${fmt(opcoes.comprimentoMin, 0)} m unidos ao vizinho).`,
      off.aplicar && off.valor ? `Offset de ${fmt(off.valor, 1)} mm aplicado em ${NOMES_BITOLA[off.bitola]}.` : ''
    ].filter(Boolean).join(' ');

    const el = h('div', { id: 'laudo', class: 'laudo' },
      h('header', { class: 'laudo-cab' },
        foto ? h('img', { src: foto.src, alt: '', class: 'laudo-foto' }) : null,
        h('div', null,
          h('h1', { text: 'Laudo de Inspeção – Carro Controle EM80' }),
          h('p', { text: 'Centro de Monitoramento de Ativos' })),
        h('div', { class: 'laudo-emissao' }, h('span', { text: 'Emitido em' }), h('strong', { text: U.fmtDataHora(agora) }))),

      secao('Identificação', tabela(['Campo', 'Valor'], [
        ['Arquivo', nomeArquivo],
        ['Ramal / Linha', [m.ramal, m.linha && `Linha ${m.linha}`].filter(Boolean).join(' · ')],
        ['Data da inspeção', m.data],
        ['Inspetor', m.inspetor],
        ['Responsável pela análise', info.responsavel || '—'],
        ['Trecho', `${B.fmtKm(pos[0])} → ${B.fmtKm(pos[pos.length - 1])} (${fmt(r.geral.extensao / 1000, 2)} km · ${pos.length.toLocaleString('pt-BR')} pontos)`]
      ], 'laudo-id')),

      h('section', { class: `laudo-resultado laudo-res-${RESULTADOS.indexOf(info.resultado)}` },
        h('div', null, h('span', { text: 'Resultado' }), h('strong', { text: info.resultado })),
        info.parecer ? h('p', { text: info.parecer }) : null),

      secao('Indicadores',
        h('div', { class: 'laudo-kpis' },
          [['Perda de bitola', `${fmt(r.geral.pctPerda)}%`, `${int(r.geral.perdas)} pontos acima de ${int(r.geral.pontos)} · ${fmt(extAcima(r.geral.perdas), 0)} m`],
            ['Elementos que perderam', `${r.tangentes.comPerda + r.curvas.comPerda} de ${r.tangentes.quantidade + r.curvas.quantidade}`, `${r.tangentes.comPerda} tangente(s) · ${r.curvas.comPerda} curva(s) · > ${fmt(opcoes.limiteElemento ?? 10, 0)}%`],
            ['Em tangentes', `${fmt(r.tangentes.pctPerda)}%`, `${int(r.tangentes.perdas)} de ${int(r.tangentes.pontos)} pontos · ${r.tangentes.quantidade} tangente(s)`],
            ['Em curvas', `${fmt(r.curvas.pctPerda)}%`, `${int(r.curvas.perdas)} de ${int(r.curvas.pontos)} pontos · ${r.curvas.quantidade} curva(s)`],
            ['Variação rápida', `${fmt(r.geral.pctVariacao)}%`, `σ em 1 m > ${fmt(opcoes.limiteVariacao, 1)} mm`]
          ].map(([t, v, sub]) => h('div', { class: 'laudo-kpi' }, h('span', { text: t }), h('strong', { text: v }), h('small', { text: sub })))),
        h('p', { class: 'laudo-nota', text: `Critérios: ${criterios}` })),

      secao('Gráficos ao longo do km', graficosLaudo.map(({ titulo, g }) => h('div', { class: 'laudo-grafico' }, h('h3', { text: titulo }), g.el))),

      r.modo !== 'curvatura' && r.porEh.length ? secao('Resumo por trecho (EH e RH) — maior perda primeiro', tabelaCols(colunasEh(true), porPerda(r.porEh))) : null,

      secao(`${r.modo !== 'curvatura' ? 'Elementos da planta: tangentes e curvas' : 'Elementos: tangentes e curvas'} — maior perda primeiro`, tabelaCols(colunasElementos(true), porPerda(r.elementos))),

      secao('Ranking de nivelamento (5 maiores valores por parâmetro)',
        h('div', { class: 'laudo-ranking' }, nivel.map((p) => h('div', { class: 'laudo-rank' },
          h('h3', { text: p.nome }),
          tabela(['#', 'km', 'Valor', 'Elemento'], B.ranking(arquivo, r.elementos, p.id, { limite: 5, separacao: 10 })
            .map((x) => [x.posicao, x.km, fmt(x.valor, 2), x.elemento]), 'laudo-mini centro'))))),

      info.checklist ? secao(`Checklist de inspeção – ${U.fmtData(info.checklist.data)} · Ciclo ${info.checklist.ciclo} · ${info.checklist.responsavel}`,
        info.checklist.respostas.length ? null : h('p', { class: 'laudo-nota', text: `Respostas não disponíveis neste aparelho. Problemas registrados: ${info.checklist.qtdProblemas ?? '—'}.` }),
        tabela(['Sistema', 'Pergunta', 'Resposta', 'Descrição'], info.checklist.respostas.map((x) => [
          x.grupo, x.pergunta, h('span', { class: x.problema === 'Sim' ? 'laudo-problema' : '', text: x.resposta }), x.descricao || ''])),
        (info.checklist.amostras || []).length ? tabela(['Sistema', 'Medição', 'Amostra', 'Valor', 'Referência'], info.checklist.amostras.map((a) => [
          a.grupo, a.medicao, a.amostra, fmt(Number(a.valor), 2), a.rotulo2 ? `${a.rotulo2}: ${fmt(Number(a.valor2), 2)}` : ''])) : null) : null,

      h('section', { class: 'laudo-secao laudo-assinaturas' },
        h('h2', { text: 'Aceite' }),
        h('div', { class: 'laudo-ass' },
          h('div', null, h('div', { class: 'laudo-linha' }), h('strong', { text: info.responsavel || '\u00a0' }), h('span', { text: 'Responsável pela análise' })),
          h('div', null, h('div', { class: 'laudo-linha' }), h('strong', { text: '\u00a0' }), h('span', { text: 'Aceite (nome e assinatura)' })),
          h('div', null, h('div', { class: 'laudo-linha' }), h('strong', { text: '\u00a0' }), h('span', { text: 'Data' })))),

      h('footer', { class: 'laudo-rodape', text: `Gerado pelo App Carro Controle EM80 · ${App.config.build || App.config.versao} · ${U.fmtDataHora(agora)}` }));

    return { el, graficosLaudo };
  }

  function imprimirLaudo(info) {
    const anterior = document.getElementById('laudo');
    if (anterior) anterior.remove();
    const temaAnterior = document.documentElement.getAttribute('data-theme');
    const tituloAnterior = document.title;
    const { el, graficosLaudo } = montarLaudo(info);
    document.body.appendChild(el);
    document.documentElement.setAttribute('data-theme', 'light'); // laudo sempre em fundo branco
    const m = arquivo.meta;
    document.title = `Laudo EM80 ${m.ramal || ''} ${(m.data || '').replace(/\//g, '-')}`.trim();

    const restaurar = () => {
      graficosLaudo.forEach(({ g }) => g.destruir());
      el.remove();
      document.title = tituloAnterior;
      if (temaAnterior) document.documentElement.setAttribute('data-theme', temaAnterior);
      window.removeEventListener('afterprint', restaurar);
    };
    window.addEventListener('afterprint', restaurar);
    // Espera os gráficos serem desenhados antes de abrir a impressão.
    setTimeout(() => {
      graficosLaudo.forEach(({ g }) => g.destruir()); // congela o desenho (não redesenha durante a impressão)
      try {
        window.print();
      } catch (e) {
        restaurar();
        ui.toast(`Não foi possível abrir a impressão: ${e.message}`, 'erro', 6000);
      }
    }, 400);
  }

  App.analise = { montar };
})(window.App);

</script>
  <script>
/* js/modulos/checklist.js */
/* Módulo 1 – Check List de Inspeção. */
'use strict';

(function (App) {
  const { U, ui, dados, config, OM, sync } = App;
  const { h } = ui;
  const RASCUNHO = 'rascunho:checklist';
  const LINHAS_INICIAIS = 3;

  let raiz;
  let formEl;
  let listaEl;
  let progressoEl;
  let estado;

  const itens = () => config.checklist.flatMap((g) => g.itens.map((it) => ({ ...it, grupo: g.titulo })));
  const perguntasSN = () => itens().filter((i) => i.tipo === 'sn');

  function novoEstado() {
    return {
      cab: { responsavel: U.pref.get('ultimoResponsavel', ''), data: U.hoje(), ciclo: OM.cicloAtivo() || '' },
      resp: {},
      am: {}
    };
  }

  /** Garante a estrutura mínima (útil quando o checklist ganha perguntas novas). */
  function normalizar(e) {
    const st = e && typeof e === 'object' ? e : novoEstado();
    st.cab = st.cab || {};
    st.resp = st.resp || {};
    st.am = st.am || {};
    itens().forEach((it) => {
      if (it.tipo !== 'sn' && !Array.isArray(st.am[it.id])) {
        st.am[it.id] = Array.from({ length: LINHAS_INICIAIS }, () => ({ v: '', v2: '' }));
      }
    });
    return st;
  }

  const salvarRascunho = U.debounce(() => U.pref.set(RASCUNHO, estado), 400);
  function alterou() {
    salvarRascunho();
    atualizarProgresso();
  }

  /* ---------------- Renderização ---------------- */

  function montar(el) {
    raiz = el;
    estado = normalizar(U.pref.get(RASCUNHO, null));
    const temRespostas = Object.keys(estado.resp).length
      || Object.values(estado.am).some((l) => l.some((x) => String(x.v || x.v2 || '').trim()));
    if (!temRespostas) estado.cab.data = U.hoje(); // rascunho vazio de outro dia
    formEl = h('form', { class: 'pilha', novalidate: true, onsubmit: (e) => { e.preventDefault(); salvar(); } });
    listaEl = h('div', { class: 'lista' });
    const parteChecklist = h('div', { class: 'tela' },
      h('div', { class: 'tela-cab' },
        h('h1', { text: 'Check List de Inspeção' }),
        h('p', { class: 'sub', text: 'Responda Sim ou Não. Quando houver problema, descreva o que houve.' })),
      formEl,
      h('section', { class: 'cartao' }, h('h2', { text: 'Checklists recentes' }), listaEl));
    const parteAnalise = h('div', { class: 'tela tela-larga', hidden: true });
    let analiseMontada = false;

    // Duas abas: o checklist e a análise do arquivo gerado pelo carro.
    const abas = h('div', { class: 'seg seg-abas', role: 'tablist', 'aria-label': 'Checklist ou análise' });
    const mostrar = (qual) => {
      U.pref.set('checklist:aba', qual);
      parteChecklist.hidden = qual !== 'checklist';
      parteAnalise.hidden = qual !== 'analise';
      if (qual === 'analise' && !analiseMontada) {
        App.analise.montar(parteAnalise);
        analiseMontada = true;
      }
      abas.querySelectorAll('button').forEach((b) => {
        const ativo = b.dataset.aba === qual;
        b.classList.toggle('ativo', ativo);
        b.setAttribute('aria-selected', ativo ? 'true' : 'false');
      });
    };
    [['checklist', 'Checklist'], ['analise', 'Análise do arquivo']].forEach(([id, rotulo]) => {
      abas.appendChild(h('button', { type: 'button', role: 'tab', class: 'seg-opcao', dataset: { aba: id }, onclick: () => mostrar(id) }, rotulo));
    });

    raiz.append(abas, parteChecklist, parteAnalise);
    renderForm();
    mostrar(U.pref.get('checklist:aba', 'checklist') === 'analise' ? 'analise' : 'checklist');
  }

  function renderForm() {
    ui.limpar(formEl);
    const c = estado.cab;
    const entrada = (campo, attrs) => h('input', {
      ...attrs,
      value: c[campo] || '',
      oninput: (e) => { c[campo] = e.target.value; alterou(); }
    });

    formEl.append(
      h('section', { class: 'cartao' },
        h('h2', { text: 'Identificação' }),
        h('div', { class: 'grade-3' },
          ui.campo('Responsável', entrada('responsavel', { type: 'text', name: 'responsavel', autocomplete: 'name', maxlength: 80 }), { obrigatorio: true }),
          ui.campo('Data', entrada('data', { type: 'date', name: 'data' }), { obrigatorio: true }),
          ui.campo('Ciclo', entrada('ciclo', { type: 'text', name: 'ciclo', inputmode: 'numeric', maxlength: 4, placeholder: 'Ex.: 5' }), { obrigatorio: true })))
    );

    config.checklist.forEach((g) => {
      formEl.append(h('section', { class: 'cartao' },
        h('h2', { text: g.titulo }),
        g.itens.map((it) => renderItem({ ...it, grupo: g.titulo }))));
    });

    progressoEl = h('span', { class: 'progresso' });
    formEl.append(h('div', { class: 'barra-acoes barra-fixa' },
      progressoEl,
      h('button', { type: 'button', class: 'btn btn-secundario', onclick: limparForm }, 'Limpar'),
      h('button', { type: 'submit', class: 'btn btn-primario' }, ui.icone('check'), 'Salvar checklist')));
    atualizarProgresso();
  }

  function renderItem(it) {
    return it.tipo === 'sn' ? renderSN(it) : renderAmostras(it);
  }

  function renderSN(it) {
    const r = estado.resp[it.id] || { r: '', d: '' };
    const temProblema = r.r && r.r === it.problemaEm;
    const opcao = (valor) => h('button', {
      type: 'button',
      class: `seg-opcao${r.r === valor ? ' ativo' : ''}${r.r === valor && valor === it.problemaEm ? ' problema' : ''}`,
      'aria-pressed': r.r === valor ? 'true' : 'false',
      onclick: () => {
        estado.resp[it.id] = { r: valor, d: (estado.resp[it.id] || {}).d || '' };
        alterou();
        const novo = renderSN(it);
        no.replaceWith(novo);
        if (valor === it.problemaEm) {
          const ta = novo.querySelector('textarea');
          if (ta && !ta.value) ta.focus();
        }
      }
    }, valor);

    const no = h('div', { class: 'pergunta', dataset: { id: it.id } },
      h('p', { class: 'pergunta-texto', text: it.texto }),
      h('div', { class: 'seg', role: 'group', 'aria-label': it.texto }, opcao('Sim'), opcao('Não')),
      temProblema ? ui.campo('Descreva o que houve', h('textarea', {
        rows: 3,
        maxlength: 2000,
        value: r.d || '',
        oninput: (e) => { estado.resp[it.id].d = e.target.value; alterou(); }
      }), { obrigatorio: true, classe: 'descricao' }) : null);
    return no;
  }

  function renderAmostras(it) {
    const pares = it.tipo === 'pares';
    const linhas = estado.am[it.id];
    const lista = h('div', { class: 'amostras' });

    const redesenhar = () => {
      ui.limpar(lista);
      linhas.forEach((ln, i) => {
        const num = (campo, rotulo) => h('input', {
          type: 'text',
          inputmode: 'decimal',
          class: 'num',
          placeholder: rotulo,
          'aria-label': `${rotulo} – amostra ${i + 1}`,
          value: ln[campo] || '',
          oninput: (e) => { ln[campo] = e.target.value; alterou(); }
        });
        lista.append(h('div', { class: 'amostra' },
          h('span', { class: 'amostra-num', text: `Amostra ${U.pad(i + 1)}` }),
          pares ? num('v', it.rotulos[0]) : num('v', 'Valor'),
          pares ? num('v2', it.rotulos[1]) : null,
          h('button', {
            type: 'button',
            class: 'btn-icone',
            'aria-label': `Remover amostra ${i + 1}`,
            disabled: linhas.length <= 1,
            onclick: () => { linhas.splice(i, 1); alterou(); redesenhar(); }
          }, ui.icone('lixo'))));
      });
    };
    redesenhar();

    return h('div', { class: 'pergunta', dataset: { id: it.id } },
      h('p', { class: 'pergunta-texto', text: it.texto }),
      lista,
      h('button', {
        type: 'button',
        class: 'btn btn-fantasma',
        onclick: () => {
          linhas.push({ v: '', v2: '' });
          alterou();
          redesenhar();
          const inputs = lista.querySelectorAll('input');
          inputs[inputs.length - (pares ? 2 : 1)].focus();
        }
      }, ui.icone('plus'), 'Adicionar amostra'));
  }

  function atualizarProgresso() {
    if (!progressoEl) return;
    const total = perguntasSN().length;
    const feitas = perguntasSN().filter((p) => estado.resp[p.id] && estado.resp[p.id].r).length;
    progressoEl.textContent = `${feitas} de ${total} respondidas`;
  }

  /* ---------------- Salvar ---------------- */

  function validar() {
    ui.limparErros(formEl);
    const erros = [];
    const c = estado.cab;
    const campoCab = (nome) => formEl.querySelector(`[name="${nome}"]`);
    if (!String(c.responsavel || '').trim()) erros.push([campoCab('responsavel'), 'Informe o responsável.']);
    if (!U.parseData(c.data)) erros.push([campoCab('data'), 'Informe a data.']);
    if (!/^\d{1,4}$/.test(String(c.ciclo || '').trim())) erros.push([campoCab('ciclo'), 'Informe o número do ciclo.']);

    itens().forEach((it) => {
      const no = formEl.querySelector(`.pergunta[data-id="${it.id}"]`);
      if (it.tipo === 'sn') {
        const r = estado.resp[it.id];
        if (!r || !r.r) erros.push([no, 'Responda Sim ou Não.']);
        else if (r.r === it.problemaEm && !String(r.d || '').trim()) erros.push([no.querySelector('textarea') || no, 'Descreva o que houve.']);
      } else {
        const invalida = estado.am[it.id].some((ln) => [ln.v, ln.v2].some((v) => String(v || '').trim() && U.numero(v) === null));
        if (invalida) erros.push([no, 'Use apenas números nas amostras (ex.: 1,5 ou -0,8).']);
      }
    });
    erros.forEach(([el, msg]) => el && ui.marcarErro(el, msg));
    return erros;
  }

  async function salvar() {
    const erros = validar();
    if (erros.length) {
      ui.toast(`${erros.length} item(ns) precisam de atenção.`, 'erro');
      ui.rolarAte(erros[0][0]);
      return;
    }
    const c = estado.cab;
    const respostas = perguntasSN().map((p) => {
      const r = estado.resp[p.id];
      const problema = r.r === p.problemaEm;
      return {
        grupo: p.grupo,
        perguntaId: p.id,
        pergunta: p.texto,
        resposta: r.r,
        problema: problema ? 'Sim' : 'Não',
        descricao: problema ? r.d.trim() : ''
      };
    });
    const amostras = [];
    itens().filter((it) => it.tipo !== 'sn').forEach((it) => {
      let n = 0;
      estado.am[it.id].forEach((ln) => {
        const v = U.numero(ln.v);
        const v2 = it.tipo === 'pares' ? U.numero(ln.v2) : null;
        if (v === null && v2 === null) return;
        n++;
        amostras.push({
          grupo: it.grupo,
          medicaoId: it.id,
          medicao: it.tipo === 'pares' ? `${it.texto} – ${it.rotulos[0]}` : it.texto,
          amostra: n,
          valor: v === null ? '' : v,
          rotulo2: it.tipo === 'pares' ? it.rotulos[1] : '',
          valor2: v2 === null ? '' : v2
        });
      });
    });

    const registro = {
      id: U.uuid(),
      data: c.data,
      ciclo: String(c.ciclo).trim(),
      responsavel: c.responsavel.trim(),
      qtdProblemas: respostas.filter((r) => r.problema === 'Sim').length,
      respostas,
      amostras
    };
    try {
      await dados.salvar('checklist', 'checklists', registro);
    } catch (e) {
      ui.toast(`Não foi possível salvar: ${e.message}`, 'erro', 6000);
      return;
    }
    U.pref.set('ultimoResponsavel', registro.responsavel);
    U.pref.del(RASCUNHO);
    estado = normalizar(null);
    estado.cab.ciclo = registro.ciclo;
    renderForm();
    ui.toast('Checklist salvo.', 'ok');
    raiz.scrollIntoView({ behavior: 'smooth', block: 'start' });
    renderLista();
  }

  async function limparForm() {
    const ok = await ui.confirmar('Limpar checklist', 'Apagar as respostas preenchidas até agora?', { ok: 'Limpar', perigo: true });
    if (!ok) return;
    U.pref.del(RASCUNHO);
    estado = normalizar(null);
    renderForm();
  }

  /* ---------------- Lista ---------------- */

  async function renderLista() {
    const [lista, pendentes] = await Promise.all([dados.listar('checklists'), sync.pendentesDoTipo('checklist')]);
    if (!lista.length) {
      ui.trocar(listaEl, h('p', { class: 'vazio', text: 'Nenhum checklist salvo ainda.' }));
      return;
    }
    ui.trocar(listaEl, lista.slice(0, 15).map((c) => h('div', { class: 'item' },
      h('div', { class: 'item-principal' },
        h('strong', { text: `${U.fmtData(c.data)} · Ciclo ${c.ciclo}` }),
        h('span', { class: 'item-sub', text: c.responsavel })),
      h('div', { class: 'item-lado' },
        Number(c.qtdProblemas) > 0
          ? h('span', { class: 'etiqueta etiqueta-alerta', text: `${c.qtdProblemas} problema(s)` })
          : h('span', { class: 'etiqueta etiqueta-ok', text: 'Sem problemas' }),
        pendentes.has(c.id) ? h('span', { class: 'etiqueta etiqueta-pendente', text: 'Não enviado' }) : null))));
  }

  async function aoMostrar() {
    if (!estado.cab.ciclo && OM.cicloAtivo()) {
      estado.cab.ciclo = OM.cicloAtivo();
      const campoCiclo = formEl.querySelector('[name="ciclo"]');
      if (campoCiclo && !campoCiclo.value) campoCiclo.value = estado.cab.ciclo;
    }
    await renderLista();
    try {
      await dados.atualizarDoServidor('checklist', 'checklists');
      await renderLista();
    } catch (e) { /* sem conexão: mantém a lista local */ }
  }

  document.addEventListener('em80:sincronizado', () => { if (listaEl) renderLista(); });

  App.modulos = App.modulos || [];
  App.modulos.push({ id: 'checklist', titulo: 'Checklist', icone: 'checklist', montar, aoMostrar });
})(window.App);

</script>
  <script>
/* js/modulos/eventos.js */
/* Módulo 2 – Registro de Eventos (falhas durante a inspeção). */
'use strict';

(function (App) {
  const { U, ui, dados, config, sync } = App;
  const { h } = ui;
  const COLECAO = 'eventos';

  let raiz;
  let formCartao;
  let abertosEl;
  let recentesEl;
  let lista = [];
  let pendentes = new Map();
  let editando = null; // evento em edição (ou null)
  let f = {}; // campos do formulário

  const vazio = () => ({ equipamento: '', outro: '', parte: '', inicio: '', fim: '', observacao: '' });

  function montar(el) {
    raiz = el;
    f = vazio();
    formCartao = h('section', { class: 'cartao' });
    abertosEl = h('div', { class: 'lista' });
    recentesEl = h('div', { class: 'lista' });
    raiz.append(
      h('div', { class: 'tela-cab' },
        h('h1', { text: 'Registro de Eventos' }),
        h('p', { class: 'sub', text: 'Falhas durante a inspeção. Deixe o fim em branco enquanto a falha estiver ocorrendo.' })),
      formCartao,
      h('section', { class: 'cartao' }, h('h2', { text: 'Em aberto' }), abertosEl),
      h('section', { class: 'cartao' }, h('h2', { text: 'Recentes' }), recentesEl));
    renderForm();
    setInterval(() => {
      if (raiz.offsetParent !== null) renderListas();
    }, 30000);
  }

  /* ---------------- Formulário ---------------- */

  function renderForm() {
    const ehOutro = f.equipamento === 'Outro';
    const historico = lista.filter((e) => !f.equipamento || nomeEquip(f) === e.equipamento);
    const sugestoesParte = U.maisFrequentes(lista.map((e) => e.parte), 15);
    const sugestoesObs = U.maisFrequentes(historico.map((e) => e.observacao), 5);

    const sel = h('select', {
      name: 'equipamento',
      value: f.equipamento,
      onchange: (e) => { f.equipamento = e.target.value; renderForm(); }
    }, h('option', { value: '', text: 'Selecione…' }), config.equipamentos.map((q) => h('option', { value: q, text: q })));

    const dataHora = (campo, rotulo) => {
      const input = h('input', {
        type: 'datetime-local',
        name: campo,
        value: U.paraInputDataHora(f[campo]),
        onchange: (e) => { f[campo] = U.deInputDataHora(e.target.value); }
      });
      return ui.campo(rotulo, h('div', { class: 'linha-campo' }, input,
        h('button', {
          type: 'button',
          class: 'btn btn-secundario',
          onclick: () => { f[campo] = U.agora(); input.value = U.paraInputDataHora(f[campo]); }
        }, ui.icone('relogio'), 'Agora'),
        f[campo] ? h('button', {
          type: 'button',
          class: 'btn-icone',
          'aria-label': `Limpar ${rotulo.toLowerCase()}`,
          onclick: () => { f[campo] = ''; renderForm(); }
        }, ui.icone('x')) : null));
    };

    const obs = h('textarea', {
      name: 'observacao',
      rows: 3,
      maxlength: 2000,
      value: f.observacao,
      placeholder: 'Impacto da falha na inspeção',
      oninput: (e) => { f.observacao = e.target.value; }
    });

    const listaParte = h('datalist', { id: 'dl-partes' }, sugestoesParte.map((p) => h('option', { value: p })));

    ui.trocar(formCartao,
      h('h2', { text: editando ? 'Editar evento' : 'Novo evento' }),
      h('form', { class: 'pilha', novalidate: true, onsubmit: (e) => { e.preventDefault(); salvar(); } },
        h('div', { class: 'grade-2' },
          ui.campo('Equipamento', sel, { obrigatorio: true }),
          ehOutro ? ui.campo('Qual equipamento?', h('input', {
            type: 'text', name: 'outro', maxlength: 80, value: f.outro,
            oninput: (e) => { f.outro = e.target.value; }
          }), { obrigatorio: true }) : null,
          ui.campo('Parte do equipamento', h('input', {
            type: 'text', name: 'parte', maxlength: 120, list: 'dl-partes', value: f.parte,
            oninput: (e) => { f.parte = e.target.value; }
          }))),
        listaParte,
        h('div', { class: 'grade-2' },
          dataHora('inicio', 'Início'),
          dataHora('fim', 'Fim')),
        ui.campo('Observação / impacto', obs),
        sugestoesObs.length ? h('div', { class: 'chips', 'aria-label': 'Observações frequentes' },
          sugestoesObs.map((t) => h('button', {
            type: 'button',
            class: 'chip',
            title: t,
            onclick: () => {
              f.observacao = f.observacao.trim() ? `${f.observacao.trim()}; ${t}` : t;
              obs.value = f.observacao;
            }
          }, t.length > 40 ? `${t.slice(0, 40)}…` : t))) : null,
        h('div', { class: 'barra-acoes' },
          editando
            ? h('button', { type: 'button', class: 'btn btn-secundario', onclick: cancelarEdicao }, 'Cancelar edição')
            : [
              h('button', { type: 'button', class: 'btn btn-secundario', onclick: duplicarUltimo, disabled: !lista.length }, ui.icone('duplicar'), 'Duplicar último'),
              h('button', { type: 'button', class: 'btn btn-secundario', onclick: iniciarAgora }, ui.icone('play'), 'Iniciar agora')
            ],
          h('button', { type: 'submit', class: 'btn btn-primario' }, ui.icone('check'), editando ? 'Salvar alterações' : 'Salvar evento'))));
  }

  const nomeEquip = (x) => (x.equipamento === 'Outro' ? String(x.outro || '').trim() : x.equipamento);

  function paraForm(ev) {
    const conhecido = config.equipamentos.includes(ev.equipamento) && ev.equipamento !== 'Outro';
    return {
      equipamento: conhecido ? ev.equipamento : 'Outro',
      outro: conhecido ? '' : ev.equipamento,
      parte: ev.parte || '',
      inicio: ev.inicio || '',
      fim: ev.fim || '',
      observacao: ev.observacao || ''
    };
  }

  function validar(exigirInicio) {
    const form = formCartao.querySelector('form');
    ui.limparErros(form);
    const erros = [];
    if (!f.equipamento) erros.push(['equipamento', 'Selecione o equipamento.']);
    else if (f.equipamento === 'Outro' && !f.outro.trim()) erros.push(['outro', 'Informe o equipamento.']);
    if (exigirInicio && !f.inicio) erros.push(['inicio', 'Informe o início (ou toque em "Agora").']);
    if (f.inicio && f.fim && f.fim < f.inicio) erros.push(['fim', 'O fim não pode ser antes do início.']);
    erros.forEach(([nome, msg]) => ui.marcarErro(form.querySelector(`[name="${nome}"]`), msg));
    if (erros.length) ui.rolarAte(form.querySelector(`[name="${erros[0][0]}"]`));
    return !erros.length;
  }

  async function gravar(ev, mensagem) {
    try {
      await dados.salvar('evento', COLECAO, ev);
      ui.toast(mensagem, 'ok');
      return true;
    } catch (e) {
      ui.toast(`Não foi possível salvar: ${e.message}`, 'erro', 6000);
      return false;
    }
  }

  async function salvar() {
    if (!validar(true)) return;
    const ev = {
      ...(editando || {}),
      id: editando ? editando.id : U.uuid(),
      equipamento: nomeEquip(f),
      parte: f.parte.trim(),
      inicio: f.inicio,
      fim: f.fim,
      observacao: f.observacao.trim()
    };
    if (await gravar(ev, editando ? 'Evento atualizado.' : (ev.fim ? 'Evento salvo.' : 'Evento salvo (em aberto).'))) {
      editando = null;
      f = vazio();
      await carregar();
    }
  }

  async function iniciarAgora() {
    if (!validar(false)) return;
    const ev = {
      id: U.uuid(),
      equipamento: nomeEquip(f),
      parte: f.parte.trim(),
      inicio: U.agora(),
      fim: '',
      observacao: f.observacao.trim()
    };
    if (await gravar(ev, `Falha iniciada às ${U.fmtHora(ev.inicio)}.`)) {
      f = vazio();
      await carregar();
    }
  }

  function duplicarUltimo() {
    const ultimo = lista[0];
    if (!ultimo) return;
    f = { ...paraForm(ultimo), inicio: '', fim: '' };
    renderForm();
    ui.toast('Dados do último evento copiados. Ajuste os horários.', 'info');
  }

  function editar(ev) {
    editando = ev;
    f = paraForm(ev);
    renderForm();
    ui.rolarAte(formCartao);
  }

  function cancelarEdicao() {
    editando = null;
    f = vazio();
    renderForm();
  }

  async function finalizarAgora(ev) {
    const fim = U.agora();
    if (await gravar({ ...ev, fim: fim < ev.inicio ? ev.inicio : fim }, 'Evento finalizado.')) await carregar();
  }

  /* ---------------- Listas ---------------- */

  function cartaoEvento(ev, aberto) {
    const dur = U.minutosEntre(ev.inicio, aberto ? U.agora() : ev.fim);
    return h('div', { class: `item${aberto ? ' item-aberto' : ''}` },
      h('div', { class: 'item-principal' },
        h('strong', { text: [ev.equipamento, ev.parte].filter(Boolean).join(' · ') }),
        h('span', { class: 'item-sub', text: aberto
          ? `Desde ${U.fmtDataHora(ev.inicio)} · há ${U.fmtDuracao(dur)}`
          : `${U.fmtDataHora(ev.inicio)} → ${ev.fim ? U.fmtHora(ev.fim) : '—'} · ${U.fmtDuracao(dur)}` }),
        ev.observacao ? h('span', { class: 'item-obs', text: ev.observacao }) : null),
      h('div', { class: 'item-lado' },
        pendentes.has(ev.id) ? h('span', { class: 'etiqueta etiqueta-pendente', text: 'Não enviado' }) : null,
        aberto ? h('button', { class: 'btn btn-primario btn-pequeno', onclick: () => finalizarAgora(ev) }, ui.icone('parar'), 'Finalizar agora') : null,
        h('button', { class: 'btn btn-secundario btn-pequeno', onclick: () => editar(ev) }, ui.icone('editar'), 'Editar')));
  }

  function renderListas() {
    const abertos = lista.filter((e) => !e.fim);
    const fechados = lista.filter((e) => e.fim).slice(0, 25);
    ui.trocar(abertosEl, abertos.length ? abertos.map((e) => cartaoEvento(e, true)) : h('p', { class: 'vazio', text: 'Nenhuma falha em aberto.' }));
    ui.trocar(recentesEl, fechados.length ? fechados.map((e) => cartaoEvento(e, false)) : h('p', { class: 'vazio', text: 'Nenhum evento finalizado ainda.' }));
  }

  /** Recarrega a lista. O formulário só é redesenhado quando pedido, para não atrapalhar a digitação. */
  async function carregar({ form = true } = {}) {
    [lista, pendentes] = await Promise.all([dados.listar(COLECAO), sync.pendentesDoTipo('evento')]);
    lista = lista.slice().sort((a, b) => String(b.inicio).localeCompare(String(a.inicio)));
    if (form) renderForm();
    renderListas();
  }

  async function aoMostrar() {
    await carregar();
    try {
      await dados.atualizarDoServidor('evento', COLECAO);
      await carregar({ form: false });
    } catch (e) { /* sem conexão */ }
  }

  document.addEventListener('em80:sincronizado', () => { if (raiz) carregar({ form: false }); });

  App.modulos = App.modulos || [];
  App.modulos.push({ id: 'eventos', titulo: 'Eventos', icone: 'alerta', montar, aoMostrar });
})(window.App);

</script>

/* js/modulos/producao.js */
/* Módulo 3 – Produção de OMs: importação, marcação e acompanhamento das metas. */
'use strict';

(function (App) {
  const { U, ui, OM, charts, api } = App;
  const { h } = ui;
  const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

  let raiz;
  let topoEl;
  let painelEl;
  let listaCab;
  let listaEl;
  let modoEl; // abas Execução | Programação
  let execEl; // cartão da lista (execução)
  let progEl; // programação (calendário + listas)
  let modo = U.pref.get('producao:modo', 'execucao');
  let versaoServidor = null; // conferida ao abrir a programação
  let dados = null; // { ciclo, oms, exec }
  let ref = U.hoje();
  let refManual = false; // true quando o usuário escolheu outra data
  let aba = 'dia';
  let ramal = '';
  let busca = '';
  const travas = new Set(); // evita toque duplo acidental

  function montar(el) {
    raiz = el;
    topoEl = h('div', { class: 'cartao' });
    painelEl = h('div', { class: 'pilha' });
    listaCab = h('div', { class: 'lista-cab' });
    listaEl = h('div', { class: 'lista-om' });
    raiz.append(
      h('div', { class: 'tela-cab' },
        h('h1', { text: 'Produção de OMs' }),
        h('p', { class: 'sub', text: 'Programe as OMs por dia na aba Programação e marque as realizadas na aba Execução.' })),
      topoEl,
      painelEl,
      modoEl = h('div'),
      execEl = h('section', { class: 'cartao' }, listaCab, listaEl),
      progEl = h('div', { class: 'pilha' }));
    renderTudo();
  }

  /* ---------------- Carga de dados ---------------- */

  async function carregarLocal() {
    const ciclo = OM.cicloAtivo();
    dados = ciclo ? await OM.carregarLocal(ciclo) : null;
  }

  async function atualizarServidor({ avisar = false } = {}) {
    if (!api.configurado()) return;
    try {
      let ciclo = OM.cicloAtivo();
      if (!ciclo) {
        const ciclos = await api.chamar('getCiclos');
        if (ciclos && ciclos.length) {
          ciclo = ciclos[0].ciclo;
          OM.definirCicloAtivo(ciclo);
        }
      }
      const novos = await OM.atualizarDoServidor(ciclo);
      if (novos) dados = novos;
      renderTudo();
      if (avisar) ui.toast('Dados atualizados.', 'ok');
    } catch (e) {
      if (avisar) ui.toast(`Não foi possível atualizar: ${e.message}`, 'erro', 5000);
    }
  }

  async function aoMostrar() {
    if (!refManual) ref = U.hoje(); // app aberto de um dia para o outro
    await carregarLocal();
    renderTudo();
    await atualizarServidor();
  }

  /* ---------------- Renderização ---------------- */

  function renderTudo() {
    renderTopo();
    renderPainel();
    renderModo();
    if (modo === 'programacao') renderProgramacao(); else renderLista();
  }

  function renderModo() {
    const tem = !!(dados && dados.oms.length);
    modoEl.hidden = !tem;
    execEl.hidden = !tem || modo !== 'execucao';
    progEl.hidden = !tem || modo !== 'programacao';
    if (!tem) return;
    const botao = (id, rotulo, icone) => h('button', {
      class: `seg-opcao${modo === id ? ' ativo' : ''}`,
      'aria-pressed': modo === id ? 'true' : 'false',
      onclick: () => {
        if (modo === id) return;
        modo = id;
        U.pref.set('producao:modo', id);
        renderTudo();
      }
    }, ui.icone(icone), rotulo);
    ui.trocar(modoEl, h('div', { class: 'seg seg-abas seg-modo', role: 'group', 'aria-label': 'Modo' },
      botao('execucao', 'Execução', 'check'),
      botao('programacao', 'Programação', 'calendario')));
  }

  async function renderTopo() {
    const ciclos = await OM.ciclosLocais();
    const ativo = OM.cicloAtivo();
    const opcoes = ciclos.map((c) => c.ciclo);
    if (ativo && !opcoes.includes(ativo)) opcoes.unshift(ativo);

    const sel = h('select', {
      'aria-label': 'Ciclo',
      value: ativo,
      onchange: async (e) => {
        OM.definirCicloAtivo(e.target.value);
        await carregarLocal();
        renderTudo();
        atualizarServidor();
      }
    }, opcoes.length ? opcoes.map((c) => h('option', { value: c, text: `Ciclo ${c}` })) : h('option', { value: '', text: 'Nenhum ciclo' }));

    const data = h('input', {
      type: 'date',
      'aria-label': 'Data de referência',
      value: ref,
      onchange: (e) => {
        if (U.parseData(e.target.value)) mudarData(e.target.value);
      }
    });

    ui.trocar(topoEl,
      h('div', { class: 'barra-topo' },
        h('div', { class: 'linha-campo' }, sel,
          h('button', { class: 'btn-icone', 'aria-label': 'Atualizar do servidor', title: 'Atualizar', onclick: () => atualizarServidor({ avisar: true }) }, ui.icone('sync')),
          h('button', { class: 'btn btn-secundario', onclick: abrirImportacao, title: 'Importar planilha do SAP' }, ui.icone('upload'), 'Importar')),
        h('div', { class: 'linha-campo nav-data' },
          h('button', { class: 'btn-icone', 'aria-label': 'Dia anterior', onclick: () => mudarData(U.somarDias(ref, -1)) }, ui.icone('esquerda')),
          data,
          h('button', { class: 'btn-icone', 'aria-label': 'Próximo dia', onclick: () => mudarData(U.somarDias(ref, 1)) }, ui.icone('direita')),
          ref !== U.hoje() ? h('button', { class: 'btn btn-fantasma', onclick: () => mudarData(U.hoje()) }, 'Hoje') : null)));
  }

  function mudarData(d) {
    ref = d;
    refManual = d !== U.hoje();
    renderTudo();
  }

  function renderPainel() {
    if (!dados || !dados.oms.length) {
      ui.trocar(painelEl, h('section', { class: 'cartao vazio-grande' },
        h('p', { text: OM.cicloAtivo() ? `O ciclo ${OM.cicloAtivo()} ainda não foi carregado neste aparelho.` : 'Nenhum ciclo importado ainda.' }),
        h('p', { class: 'sub', text: 'Importe a planilha de OMs do SAP. Depois, monte a programação do dia, da semana e do mês na aba Programação.' }),
        h('button', { class: 'btn btn-primario', onclick: abrirImportacao }, ui.icone('upload'), 'Importar planilha')));
      return;
    }
    const m = OM.metricas(dados, ref);
    const ehHoje = ref === U.hoje();
    ui.trocar(painelEl,
      h('div', { class: 'kpis' },
        charts.indicador({ titulo: ehHoje ? 'Hoje' : U.fmtData(ref), ...m.dia, pct: m.dia.pct }),
        charts.indicador({ titulo: `Semana ${U.fmtData(m.semana.inicio).slice(0, 2)}–${U.fmtData(U.somarDias(m.semana.inicio, 4)).slice(0, 5)}`, ...m.semana }),
        charts.indicador({ titulo: `Mês de ${U.fmtMesAno(ref).split(' de ')[0]}`, ...m.mes, extra: `Meta até ${ehHoje ? 'hoje' : U.fmtData(ref).slice(0, 5)}: ${m.mes.metaAteHoje}` }),
        charts.indicador({ titulo: `Ciclo ${dados.ciclo}`, ...m.ciclo })),
      h('div', { class: 'grade-graficos' },
        h('section', { class: 'cartao' }, h('h2', { text: 'Semana: realizado por dia' }), charts.barrasSemana(m.serieSemana, { hoje: ref })),
        h('section', { class: 'cartao' }, h('h2', { text: 'Mês: acumulado' }), charts.linhaMes(m.serieMes, { hoje: ref }))));
  }

  function renderLista() {
    if (!dados || !dados.oms.length) {
      ui.limpar(listaCab);
      ui.limpar(listaEl);
      return;
    }
    const listas = OM.listas(dados, ref);
    const ramais = [...new Set(dados.oms.map((o) => o.ramal))].sort();
    if (ramal && !ramais.includes(ramal)) ramal = '';

    const abaBtn = (id, rotulo, n) => h('button', {
      class: `seg-opcao${aba === id ? ' ativo' : ''}`,
      'aria-pressed': aba === id ? 'true' : 'false',
      onclick: () => { aba = id; renderLista(); }
    }, `${rotulo} (${n})`);

    const campoBusca = h('input', {
      type: 'search',
      placeholder: 'Buscar OM ou trecho',
      'aria-label': 'Buscar OM',
      value: busca,
      oninput: U.debounce((e) => { busca = e.target.value; desenharItens(listas); }, 200)
    });

    ui.trocar(listaCab,
      h('div', { class: 'seg seg-abas', role: 'group', 'aria-label': 'Filtro da lista' },
        abaBtn('dia', ref === U.hoje() ? 'Hoje' : 'Do dia', listas.doDia.length),
        abaBtn('atrasadas', 'Atrasadas', listas.atrasadas.length),
        abaBtn('apropriar', 'A apropriar', listas.aApropriar.length),
        abaBtn('todas', 'Todas', listas.todas.length)),
      h('div', { class: 'linha-campo filtros' },
        h('select', {
          'aria-label': 'Ramal',
          value: ramal,
          onchange: (e) => { ramal = e.target.value; desenharItens(listas); }
        }, h('option', { value: '', text: 'Ramal: todos' }), ramais.map((r) => h('option', { value: r, text: r }))),
        campoBusca));
    desenharItens(listas);
  }

  function desenharItens(listas) {
    const base = { dia: listas.doDia, atrasadas: listas.atrasadas, apropriar: listas.aApropriar, todas: listas.todas }[aba] || listas.doDia;
    const termo = U.normalizar(busca);
    const filtrada = base.filter((o) => (!ramal || o.ramal === ramal)
      && (!termo || U.normalizar(`${o.textoBreve} ${o.nOrdem} ${o.denominacao}`).includes(termo)));

    if (!filtrada.length) {
      const msg = { dia: 'Nenhuma OM programada para este dia.', atrasadas: 'Nenhuma OM atrasada.', apropriar: 'Todas as OMs realizadas já foram apropriadas no SAP.', todas: 'Nenhuma OM encontrada.' }[aba];
      ui.trocar(listaEl, h('p', { class: 'vazio', text: base.length ? 'Nenhuma OM com esse filtro.' : msg }));
      return;
    }
    const frag = document.createDocumentFragment();
    filtrada.forEach((o) => frag.appendChild(itemOM(o)));
    ui.trocar(listaEl, frag);
  }

  function itemOM(o) {
    const exec = dados.exec[o.nOrdem];
    const feita = !!(exec && exec.status === OM.REALIZADO);
    const atrasada = !feita && o.dataProgramada && o.dataProgramada < U.hoje();
    const info = [];
    if (o.dataProgramada) info.push(h('span', { class: `chip-info${atrasada ? ' atrasada' : ''}`, text: `Prog. ${U.fmtData(o.dataProgramada).slice(0, 5)}` }));
    else info.push(h('span', { class: 'chip-info', text: 'Sem programação' }));
    if (feita && exec.dataRealizacao) info.push(h('span', { class: 'chip-info feita', text: `Feita ${U.fmtData(exec.dataRealizacao).slice(0, 5)} ${U.fmtHora(exec.dataRealizacao)}` }));
    info.push(...chipsExtras(o));
    const apropriada = feita && !!exec.apropriadaEm;

    const linha = h('div', { class: `om${feita ? ' om-feita' : ''}`, dataset: { n: o.nOrdem } },
      h('button', {
        class: 'om-botao',
        'aria-pressed': feita ? 'true' : 'false',
        'aria-label': `${o.textoBreve}: ${feita ? 'realizada' : 'não realizada'}. Tocar para alterar.`,
        onclick: () => alternar(o)
      },
      h('span', { class: 'om-marca', 'aria-hidden': 'true' }, feita ? ui.icone('check') : null),
      h('span', { class: 'om-texto' },
        h('strong', { text: o.textoBreve }),
        h('span', { class: 'om-sub', text: `${o.nOrdem}${o.denominacao ? ` · ${o.denominacao}` : ''}` }),
        h('span', { class: 'om-info' }, info)),
      h('span', { class: `om-status ${feita ? 'ok' : ''}`, text: feita ? 'Realizado' : 'Não realizado' })),
      feita ? h('button', {
        class: `om-sap${apropriada ? ' ok' : ''}`,
        'aria-pressed': apropriada ? 'true' : 'false',
        'aria-label': `${o.textoBreve}: ${apropriada ? 'apropriada no SAP' : 'não apropriada no SAP'}. Tocar para alterar.`,
        title: apropriada ? `Apropriada no SAP em ${U.fmtDataHora(exec.apropriadaEm)}` : 'Marcar como apropriada no SAP',
        onclick: () => apropriar(o)
      }, apropriada ? ui.icone('check') : null, h('span', { text: 'SAP' })) : null,
      h('button', {
        class: 'btn-icone om-mais',
        'aria-label': `Reprogramar ${o.textoBreve}`,
        title: 'Reprogramar',
        onclick: () => abrirReprogramacao(o)
      }, ui.icone('calendario')));
    return linha;
  }

  /** Chips com a situação no SAP e a programação original (quando a OM foi reprogramada). */
  function chipsExtras(o) {
    const chips = [];
    if (o.dataOriginal && o.dataProgramada !== o.dataOriginal) {
      chips.push(h('span', { class: 'chip-info reprog', text: `Orig. ${U.fmtData(o.dataOriginal).slice(0, 5)}`, title: 'Programação original (a OM foi reprogramada)' }));
    }
    // Coluna STATUS da planilha do SAP (ex.: "LIB: Autorizada p/ execução").
    if (o.status || o.statusUsuario) {
      chips.push(h('span', { class: 'chip-info sap', text: o.status || o.statusUsuario, title: [o.status && `STATUS: ${o.status}`, o.statusUsuario && `Status do usuário: ${o.statusUsuario}`, o.statusOrdem && `Status da ordem: ${o.statusOrdem}`].filter(Boolean).join('\n') }));
    }
    const x = dados.exec[o.nOrdem];
    if (x && x.status === OM.REALIZADO && x.apropriadaEm) chips.push(h('span', { class: 'chip-info feita', text: `Apropriada ${U.fmtData(x.apropriadaEm).slice(0, 5)}` }));
    return chips;
  }

  async function apropriar(o) {
    if (travas.has(`sap:${o.nOrdem}`)) return;
    travas.add(`sap:${o.nOrdem}`);
    setTimeout(() => travas.delete(`sap:${o.nOrdem}`), 700);
    try {
      dados.exec[o.nOrdem] = await OM.apropriar(dados.ciclo, o.nOrdem);
      const antigo = listaEl.querySelector(`.om[data-n="${CSS.escape(o.nOrdem)}"]`);
      if (antigo) antigo.replaceWith(itemOM(o));
      atualizarContadores();
      if (navigator.vibrate) navigator.vibrate(15);
    } catch (e) {
      ui.toast(e.message, 'erro', 4000);
    }
  }

  async function alternar(o) {
    if (travas.has(o.nOrdem)) return;
    travas.add(o.nOrdem);
    setTimeout(() => travas.delete(o.nOrdem), 700);
    try {
      const novo = await OM.alternar(dados.ciclo, o.nOrdem);
      dados.exec[o.nOrdem] = novo;
      const antigo = listaEl.querySelector(`.om[data-n="${CSS.escape(o.nOrdem)}"]`);
      if (antigo) antigo.replaceWith(itemOM(o));
      renderPainel();
      atualizarContadores();
      if (navigator.vibrate) navigator.vibrate(15);
    } catch (e) {
      ui.toast(`Não foi possível marcar: ${e.message}`, 'erro', 5000);
    }
  }

  function atualizarContadores() {
    const listas = OM.listas(dados, ref);
    const botoes = listaCab.querySelectorAll('.seg-abas .seg-opcao');
    const n = [listas.doDia.length, listas.atrasadas.length, listas.aApropriar.length, listas.todas.length];
    botoes.forEach((b, i) => { b.textContent = b.textContent.replace(/\(\d+\)$/, `(${n[i]})`); });
  }

  /* ---------------- Programação (calendário) ---------------- */

  const selProg = new Set(); // OMs marcadas na lista do dia
  const selDisp = new Set(); // OMs marcadas na lista para adicionar
  let dispTodas = false; // false = só sem programação; true = também as de outras datas
  let dispRamal = '';
  let dispBusca = '';
  let selDia = null; // dia a que as seleções pertencem

  const fmtDiaLongo = (d) => `${U.diaSemanaCurto(d)} ${U.fmtData(d).slice(0, 5)}`;
  const linhaVia = (o) => { const l = OM.linha(o.textoBreve); return l ? `L${l}` : ''; };
  const kmTxt = (o) => {
    const m = Number(o.km);
    if (!Number.isFinite(m) || m <= 0) return '';
    const fim = Number(o.km2);
    const fmt = (x) => `${Math.floor(x / 1000)}+${String(Math.round(x % 1000)).padStart(3, '0')}`;
    return Number.isFinite(fim) && fim > m ? `km ${fmt(m)} a ${fmt(fim)}` : `km ${fmt(m)}`;
  };

  async function conferirServidor() {
    if (versaoServidor !== null || !api.configurado() || navigator.onLine === false) return;
    try {
      const r = await api.chamar('ping');
      versaoServidor = (r && r.versao) || '0';
      if (modo === 'programacao') renderProgramacao();
    } catch (e) { /* sem conexão: confere depois */ }
  }
  const servidorAntigo = () => {
    if (!versaoServidor) return false;
    const [a, b] = versaoServidor.split('.').map((x) => parseInt(x, 10) || 0);
    return a < 1 || (a === 1 && b < 3);
  };

  async function programar(nOrdens, data, msg) {
    if (!nOrdens.length) return;
    try {
      await OM.programarVarios(dados.ciclo, nOrdens, data);
      dados = (await OM.carregarLocal(dados.ciclo)) || dados; // inclui histórico e programação original
      nOrdens.forEach((n) => { selProg.delete(n); selDisp.delete(n); });
      renderPainel();
      renderProgramacao();
      ui.toast(msg, 'ok', 2500);
      if (navigator.vibrate) navigator.vibrate(15);
    } catch (e) {
      ui.toast(`Não foi possível programar: ${e.message}`, 'erro', 5000);
    }
  }

  function renderProgramacao() {
    if (!dados || !dados.oms.length) return ui.limpar(progEl);
    if (selDia !== ref) { selProg.clear(); selDisp.clear(); selDia = ref; }
    conferirServidor();
    ui.trocar(progEl,
      servidorAntigo() ? h('p', { class: 'aviso', text: `O servidor (Apps Script) está na versão ${versaoServidor}: atualize o Codigo.js no Apps Script e publique uma nova versão (veja INSTALACAO.md). Até lá, retiradas, histórico de reprogramação e apropriação no SAP ficam pendentes no aparelho.` }) : null,
      cartaoCalendario(),
      cartaoDoDia(),
      cartaoAdicionar());
  }

  function cartaoCalendario() {
    const cal = OM.calendario(dados, ref);
    const ini = U.inicioMes(ref);
    const hoje = U.hoje();
    const seg = U.inicioSemana(ref);
    const sex = U.somarDias(seg, 4);
    const dom = U.somarDias(seg, 6);
    const contar = (a, b) => dados.oms.filter((o) => o.dataProgramada && o.dataProgramada >= a && o.dataProgramada <= b).length;
    const semProg = dados.oms.filter((o) => !o.dataProgramada && !OM.realizada(dados, o.nOrdem)).length;
    const naoFeitas = dados.oms.filter((o) => !OM.realizada(dados, o.nOrdem)).length;

    const saidas = {};
