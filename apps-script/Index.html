        ? `${r.modo === 'hibrido' ? 'Elementos com limites pelo raio medido e nomes da planta da linha' : 'Elementos pelo km da planta da linha'} (${planta.nome}), por trecho EH x/y e RH (circuito); circuitos (RH) fora das estatísticas gerais: ramal ${infoPlanta.ramal} do arquivo CSV, localização pelo km (a coluna LINHA é só informativa), correção do km de ${infoPlanta.ajusteTxt}${infoPlanta.automatico ? ' (automática, ponto a ponto pelas curvas' + (infoPlanta.acerto !== null ? `; ${fmt(infoPlanta.acerto, 0)}% das curvas medidas casadas com a ${nomeFonte()}` : '') + ')' : ''}.`
        : `Elementos pelo raio medido (10000/R, média móvel de ${fmt(opcoes.suavizacao, 0)} m): curva com raio até ${int(opcoes.raioCurva)} m, volta a tangente acima de ${int(opcoes.raioCurva * 2)} m; curva mínima ${fmt(opcoes.curvaMin, 0)} m; tangente menor que ${fmt(opcoes.tangenteMin, 0)} m entre curvas é absorvida por elas.`,
      off.aplicar && off.valor ? `Offset de ${fmt(off.valor, 1)} mm aplicado em ${NOMES_BITOLA[off.bitola]}.` : ''
    ].filter(Boolean).join(' ');

    const el = h('div', { id: 'laudo', class: 'laudo' },
      ui.cabecalhoPdf({ titulo: 'Laudo de Inspeção – Carro Controle EM80', emissao: U.fmtDataHora(agora) }),

      secao('Identificação', tabela(['Campo', 'Valor'], [
        ['Arquivo', nomeArquivo],
        ['Ramal / Linha', [m.ramal, m.linha && `Linha ${m.linha}`].filter(Boolean).join(' · ')],
        ['Data da inspeção', m.data],
        ['Inspetor', m.inspetor],
        ['Responsável pela análise', info.responsavel || '—'],
        ['Trecho', `${B.fmtKm(pos[0])} → ${B.fmtKm(pos[pos.length - 1])} (${fmt(r.geral.extensao / 1000, 2)} km · ${pos.length.toLocaleString('pt-BR')} pontos)${arquivo.recorte && arquivo.recorte.descartados ? ` · trecho analisado ${recorte.de !== null ? `a partir de ${B.fmtKm(recorte.de)}` : ''}${recorte.de !== null && recorte.ate !== null ? ' ' : ''}${recorte.ate !== null ? `até ${B.fmtKm(recorte.ate)}` : ''}; ${arquivo.recorte.descartados.toLocaleString('pt-BR')} pontos do arquivo fora do trecho` : ''}${arquivo.recorte && arquivo.recorte.deslocamento ? ` · ${arquivo.recorte.deslocamento.toLocaleString('pt-BR')} pontos em deslocamento (LOCOM) desconsiderados` : ''}`]
      ], 'laudo-id')),

      h('section', { class: `laudo-resultado laudo-res-${RESULTADOS.indexOf(info.resultado)}` },
        h('div', null, h('span', { text: 'Resultado' }), h('strong', { text: info.resultado })),
        info.parecer ? h('p', { text: info.parecer }) : null),

      secao('Indicadores',
        h('div', { class: 'laudo-kpis' },
          [['Perda de bitola', `${fmt(r.geral.pctPerda)}%`, `${int(r.geral.perdas)} pontos acima de ${int(r.geral.pontos)} · ${fmt(extAcima(r.geral.perdas), 0)} m`],
            ['Elementos que perderam', `${r.tangentes.comPerda + r.curvas.comPerda} de ${r.tangentes.quantidade + r.curvas.quantidade}`, `${r.tangentes.comPerda} tangente(s) · ${r.curvas.comPerda} curva(s) · > ${fmt(opcoes.limiteElemento ?? 10, 0)}%`],
            ['Em tangentes', `${fmt(r.tangentes.pctPerda)}%`, `${int(r.tangentes.perdas)} de ${int(r.tangentes.pontos)} pontos · ${r.tangentes.quantidade} tangente(s)`],
            ['Em curvas', `${fmt(r.curvas.pctPerda)}%`, `${int(r.curvas.perdas)} de ${int(r.curvas.pontos)} pontos · ${r.curvas.quantidade} curva(s)`],
            ['Variação rápida', `${fmt(r.geral.pctVariacao)}%`, `σ em 1 m > ${fmt(opcoes.limiteVariacao, 1)} mm`]
          ].map(([t, v, sub]) => h('div', { class: 'laudo-kpi' }, h('span', { text: t }), h('strong', { text: v }), h('small', { text: sub })))),
        h('p', { class: 'laudo-nota', text: `Critérios: ${criterios}` })),

      tabelaOffsetLaudo(tabela, calcOffset),

      secao('Gráficos ao longo do km', graficosLaudo.map(({ titulo, g }) => h('div', { class: 'laudo-grafico' }, h('h3', { text: titulo }), g.el))),

      r.comLocais && r.porEh.length ? secao('Resumo por trecho (EH e RH) — maior perda primeiro', tabelaCols(colunasEh(true), porPerda(r.porEh))) : null,

      secao(`${r.comLocais ? 'Elementos com EH/RH da planta: tangentes e curvas' : 'Elementos: tangentes e curvas'} — maior perda primeiro`, tabelaCols(colunasElementos(true), porPerda(r.elementos))),

      secao('Ranking de nivelamento (5 maiores valores por parâmetro)',
        h('div', { class: 'laudo-ranking' }, nivel.map((p) => h('div', { class: 'laudo-rank' },
          h('h3', { text: p.nome }),
          tabela(['#', 'km', 'Valor', 'Elemento'], B.ranking(arquivo, r.elementos, p.id, { limite: 5, separacao: 10 })
            .map((x) => [x.posicao, x.km, fmt(x.valor, 2), x.elemento]), 'laudo-mini centro'))))),

      info.checklist ? secao(`Checklist de inspeção – ${U.fmtData(info.checklist.data)} · Ciclo ${info.checklist.ciclo} · ${info.checklist.responsavel}`,
        info.checklist.respostas.length ? null : h('p', { class: 'laudo-nota', text: `Respostas não disponíveis neste aparelho. Problemas registrados: ${info.checklist.qtdProblemas ?? '—'}.` }),
        tabela(['Sistema', 'Pergunta', 'Resposta', 'Descrição'], info.checklist.respostas.map((x) => [
          x.grupo, x.pergunta, h('span', { class: x.problema === 'Sim' ? 'laudo-problema' : '', text: x.resposta }), x.descricao || ''])),
        (info.checklist.amostras || []).length ? tabela(['Sistema', 'Medição', 'Amostra', 'Valor', 'Referência'], info.checklist.amostras.map((a) => [
          a.grupo, a.medicao, a.amostra, fmt(Number(a.valor), 2), a.rotulo2 ? `${a.rotulo2}: ${fmt(Number(a.valor2), 2)}` : ''])) : null) : null,

      h('section', { class: 'laudo-secao laudo-assinaturas' },
        h('h2', { text: 'Aceite' }),
        h('div', { class: 'laudo-ass' },
          h('div', null, h('div', { class: 'laudo-linha' }), h('strong', { text: info.responsavel || '\u00a0' }), h('span', { text: 'Responsável pela análise' })),
          h('div', null, h('div', { class: 'laudo-linha' }), h('strong', { text: '\u00a0' }), h('span', { text: 'Aceite (nome e assinatura)' })),
          h('div', null, h('div', { class: 'laudo-linha' }), h('strong', { text: '\u00a0' }), h('span', { text: 'Data' })))),

      null);

    return { el, graficosLaudo };
  }

  function imprimirLaudo(info) {
    const anterior = document.getElementById('laudo');
    if (anterior) anterior.remove();
    const temaAnterior = document.documentElement.getAttribute('data-theme');
    const tituloAnterior = document.title;
    const { el, graficosLaudo } = montarLaudo(info);
    document.body.appendChild(el);
    document.documentElement.setAttribute('data-theme', 'light'); // laudo sempre em fundo branco
    const m = arquivo.meta;
    document.title = `Laudo EM80 ${m.ramal || ''} ${(m.data || '').replace(/\//g, '-')}`.trim();

    const restaurar = () => {
      graficosLaudo.forEach(({ g }) => g.destruir());
      el.remove();
      document.title = tituloAnterior;
      if (temaAnterior) document.documentElement.setAttribute('data-theme', temaAnterior);
      window.removeEventListener('afterprint', restaurar);
    };
    window.addEventListener('afterprint', restaurar);
    // Espera os gráficos serem desenhados antes de abrir a impressão.
    setTimeout(() => {
      graficosLaudo.forEach(({ g }) => g.destruir()); // congela o desenho (não redesenha durante a impressão)
      try {
        window.print();
      } catch (e) {
        restaurar();
        ui.toast(`Não foi possível abrir a impressão: ${e.message}`, 'erro', 6000);
      }
    }, 400);
  }

  App.analise = {
    montar,
    /** Estado atual (arquivo carregado e análise), usado pela Tela do carro. */
    estado: () => ({ arquivo, resultado, nomeArquivo, opcoes }),
    textoDoArquivo,
    /** Abre um arquivo vindo de outra tela (Montagem / Tela do carro), com o trecho e as compensações dela. */
    abrirTexto: (texto, nome, { recorte: trecho = null, compensar: comp = [], regras = null, linhas = null } = {}) => processar(texto, nome, { salvar: true, trecho, compensar: comp, regras, linhas }),
    planta: async () => { try { return await store.get(CHAVE_PLANTA); } catch (e) { return null; } }
  };
})(window.App);

</script>
  <script>
/* js/modulos/tela-carro.js */
/*
 * Tela do carro: gráfico vertical por km, no estilo da tela do carro controle (Offboard).
 * Uma coluna por parâmetro, com os limites da tabela de parâmetros EFVM 2026 (editáveis),
 * marca de excesso, faixa de eventos/elementos e reprodução "em tempo real".
 * Usa o mesmo arquivo carregado na Análise do arquivo.
 */
'use strict';

(function (App) {
  const { U, ui } = App;
  const { h } = ui;
  const NS = 'http://www.w3.org/2000/svg';

  /* ---------------- Limites (Parâmetros EFVM 2026 – bitola métrica) ---------------- */

  /** Velocidades da tabela (km/h). */
  const VELOCIDADES = [15, 20, 30, 35, 40, 45, 50, 60, 68];
  /**
   * Limites em mm por velocidade (mesma ordem de VELOCIDADES), por elemento (curva/tangente).
   * Faixas da tabela ("22 a 28") usam o menor valor. null = sem limite.
   * Bitola: superior = aberta (1000 + valor), inferior = fechada (987 → −13).
   */
  const TABELA = {
    bitola: { curva: [35, 33, 32, 32, 32, 32, 32, 32, 31], tangente: [35, 33, 32, 32, 32, 32, 32, 32, 31], inferior: -13 },
    alinhamento: { curva: [31, 28, 26, 25, 24, 22, 20, 18, 17], tangente: [31, 28, 26, 25, 24, 22, 20, 18, 17] },
    variacao: { curva: [34, 33, 32, 32, 30, 29, 25, 23, 22], tangente: [34, 33, 32, 32, 30, 29, 25, 23, 22] },
    empeno2: { curva: [18, 17, 16, 15, 14, 13, 12, 11, 10], tangente: [47, 40, 28, 35, 32, 30, 24, 20, 19] },
    nivelamento5: { curva: [28, 22, 22, 22, 21, 21, 21, 21, 21], tangente: [28, 22, 22, 22, 21, 21, 21, 21, 21] },
    empeno10: { curva: [39, 38, 38, 38, 33, 32, 32, 32, 31], tangente: [39, 38, 38, 38, 33, 32, 32, 32, 31] },
    // superelevação = nivelamento transversal; o limite vale só na tangente
    superelevacao: { curva: null, tangente: [48, 39, 36, 33, 32, 31, 30, 28, 27] }
  };

  /** Colunas na ordem pedida. escala = meio da largura da coluna (mm). */
  const PARAMETROS = [
    { id: 'bitF', nome: 'Bitola F', campo: 'bitF', grupo: 'bitola', cor: '#16a34a', escala: 40 },
    { id: 'bitT', nome: 'Bitola T', campo: 'bitT', grupo: 'bitola', cor: '#1d4ed8', escala: 40 },
    { id: 'kld', nome: 'Bit_KLD', campo: 'kld', grupo: 'bitola', cor: '#c026d3', escala: 40 },
    { id: 'val25', nome: 'ALv_B2,5', campo: 'val25', grupo: 'alinhamento', cor: '#1d4ed8', escala: 40 },
    { id: 'vrbt5', nome: 'VrBTmax5', campo: 'vrbt5', grupo: 'variacao', cor: '#1d4ed8', escala: 40 },
    { id: 'emp2', nome: 'EMP_2', campo: 'emp2', grupo: 'empeno2', cor: '#1d4ed8', escala: 50 },
    { id: 'nl5', nome: 'NLmax_5', campo: 'nl5', grupo: 'nivelamento5', cor: '#1d4ed8', escala: 40 },
    { id: 'emp10', nome: 'EMP_10', campo: 'emp10', grupo: 'empeno10', cor: '#1d4ed8', escala: 50 },
    { id: 'curv', nome: '10000/R', campo: 'curv', grupo: null, cor: '#334155', escala: 45 },
    { id: 'sup', nome: 'SUPerABS', campo: 'sup', grupo: 'superelevacao', cor: '#16a34a', escala: 110 }
  ];

  /** Limites padrão de um parâmetro numa velocidade: { C: { sup, inf } | null, T: … }. */
  function limitesPadrao(p, vel) {
    const t = p.grupo && TABELA[p.grupo];
    if (!t) return { C: null, T: null };
    const k = Math.max(0, VELOCIDADES.indexOf(Number(vel)));
    const lim = (lista) => {
      if (!lista || lista[k] === null || lista[k] === undefined) return null;
      return { sup: lista[k], inf: t.inferior !== undefined ? t.inferior : -lista[k] };
    };
    return { C: lim(t.curva), T: lim(t.tangente) };
  }

  /** Níveis de limite. A tabela EFVM 2026 preenche a Restrição; Alerta e Interdição são preenchidos à mão. */
  const NIVEIS = [
    { id: 'alerta', nome: 'Alerta', grau: 1 },
    { id: 'restricao', nome: 'Restrição', grau: 2 },
    { id: 'interdicao', nome: 'Interdição', grau: 3 }
  ];
  let edicoes = U.pref.get('telaCarro:limites', {}) || {}; // { [vel]: { [param]: { alerta, restricao, interdicao } } }
  /** Limites de um parâmetro: { alerta: { C, T }, restricao: { C, T }, interdicao: { C, T } }. */
  function limitesDe(p, vel) {
    const e = edicoes[vel] && edicoes[vel][p.id];
    const padrao = { alerta: { C: null, T: null }, restricao: limitesPadrao(p, vel), interdicao: { C: null, T: null } };
    if (!e) return padrao;
    if (e.C !== undefined || e.T !== undefined) return { ...padrao, restricao: { C: e.C, T: e.T } }; // formato antigo
    return { alerta: e.alerta || padrao.alerta, restricao: e.restricao || padrao.restricao, interdicao: e.interdicao || padrao.interdicao };
  }
  /** Grau do excesso do valor v (0 = dentro; 1 alerta; 2 restrição; 3 interdição). */
  function grauExcesso(lims, el, v) {
    let g = 0;
    NIVEIS.forEach((n) => { const l = lims[n.id][el]; if (l && (v > l.sup || v < l.inf)) g = Math.max(g, n.grau); });
    return g;
  }

  /** Escala de cada coluna (meia largura, em mm): automática pelo arquivo, com zoom − / +. */
  let zoom = U.pref.get('telaCarro:zoom', {}) || {};
  let mostrarEscala = !!U.pref.get('telaCarro:mostrarEscala', false); // botões + / − escondidos por padrão
  const escalaNice = (v) => { const p = [1, 2, 3, 5, 8, 10, 15, 20, 25, 30, 40, 50, 60, 80, 100, 150, 200]; return p.find((x) => x >= v) || Math.ceil(v); };

  /* ---------------- Estado ---------------- */

  let raiz;
  let corpoEl;
  let cabecalhoEl;
  let leituraEl;
  let rodapeEl;
  let controlesEl;
  let arquivo = null;
  let resultado = null;
  let nomeArquivo = '';
  let prep = null; // dados preparados do arquivo
  let velocidade = Number(U.pref.get('telaCarro:velocidade', 68));
  let janela = Number(U.pref.get('telaCarro:janela', 500)); // metros visíveis
  let fator = Number(U.pref.get('telaCarro:fator', 1)); // velocidade da reprodução: 1×, 2×, 3×…
  const BASE_MS = 10; // 1× = 10 m/s de arquivo por segundo
  let revelado = 0; // distância (m) até onde o traçado já foi desenhado (avança com o play)
  let topo = 0; // distância percorrida (m) no topo da tela
  let cursorI = null; // índice do ponto sob o cursor
  let tocando = false;
  let ultimoQuadro = 0;
  let colunaAtiva = null;

  // Tamanho ajustável arrastando a borda de baixo (altura) e a da direita (largura das colunas).
  let ALTURA = Number(U.pref.get('telaCarro:altura', 520));
  let larguraColuna = Number(U.pref.get('telaCarro:largura', 0)) || null; // null = encaixa na tela
  let juntas = !!U.pref.get('telaCarro:juntas', false); // Bitola F e T na mesma coluna
  const COL_EX = 26; const COL_EL = 64; const COL_KM = 58;

  /* ---------------- Montagem ---------------- */

  function montar(el) {
    raiz = el;
    controlesEl = h('div', { class: 'tc-controles' });
    leituraEl = h('div', { class: 'tc-leitura' });
    cabecalhoEl = h('div', { class: 'tc-cab' });
    corpoEl = h('div', { class: 'tc-corpo' });
    rodapeEl = h('div', { class: 'tc-rodape' });
    raiz.append(
      h('div', { class: 'tela-cab' }, h('h1', { text: 'Tela do carro' })),
      controlesEl,
      h('div', { class: 'tc-janela' },
        leituraEl,
        h('div', { class: 'tc-rolagem' }, h('div', { class: 'tc-grade' }, cabecalhoEl,
          h('div', { class: 'tc-corpo-caixa' }, corpoEl, alca('largura')), alca('altura'))),
        rodapeEl));
    corpoEl.addEventListener('wheel', (e) => {
      if (!prep) return;
      e.preventDefault();
      mover((e.deltaY > 0 ? 1 : -1) * janela * 0.1);
    }, { passive: false });
    let arrasto = null;
    corpoEl.addEventListener('pointerdown', (e) => { arrasto = { y: e.clientY, topo }; corpoEl.setPointerCapture(e.pointerId); });
    corpoEl.addEventListener('pointerup', () => { arrasto = null; });
    corpoEl.addEventListener('pointermove', (e) => {
      if (!prep) return;
      if (arrasto && Math.abs(e.clientY - arrasto.y) > 3) {
        topo = limitarTopo(arrasto.topo - ((e.clientY - arrasto.y) / ALTURA) * janela);
        desenhar();
        return;
      }
      const svg = corpoEl.querySelector('svg');
      if (!svg) return;
      const r = svg.getBoundingClientRect();
      const y = ((e.clientY - r.top) / r.height) * ALTURA;
      const x = ((e.clientX - r.left) / r.width) * Number(svg.getAttribute('width'));
      const d = topo + (y / ALTURA) * janela;
      cursorI = d <= revelado && d >= 0 ? indicePorDist(d) : null;
      colunaAtiva = colunaEm(x);
      desenharCursor();
    });
    corpoEl.addEventListener('pointerleave', () => { cursorI = null; colunaAtiva = null; desenharCursor(); });
    window.addEventListener('resize', U.debounce(() => { if (raiz && raiz.offsetParent) desenhar(); }, 150));
    document.addEventListener('em80:analise', () => { if (raiz && raiz.offsetParent) carregar(); });
  }

  function aoMostrar() { carregar(); atualizarMontagem(); }

  /* ---------------- Arquivos da Montagem ---------------- */

  let montagemLista = []; // arquivos carregados na Montagem dos dados (ciclo atual), em ordem de linha e km
  let seguir = !!U.pref.get('telaCarro:seguir', false); // ao terminar um arquivo, roda o próximo
  async function atualizarMontagem() {
    try { montagemLista = App.montagem && App.montagem.lista ? await App.montagem.lista() : []; } catch (e) { montagemLista = []; }
    renderControles();
  }
  const idAtual = () => {
    const id = App.montagem && App.montagem.atual ? App.montagem.atual() : null;
    const a = montagemLista.find((x) => x.id === id);
    return a && a.nome === nomeArquivo ? id : '';
  };
  async function abrirDaMontagem(id, tocarDepois = false) {
    if (!id) return;
    tocando = false;
    const ok = await App.montagem.abrir(id);
    if (ok && tocarDepois) tocar();
  }
  function vizinho(passo) {
    const k = montagemLista.findIndex((x) => x.id === idAtual());
    const j = k + passo;
    return k >= 0 && j >= 0 && j < montagemLista.length ? montagemLista[j] : (k < 0 && passo > 0 ? montagemLista[0] : null);
  }

  /** Alça para arrastar: 'altura' (borda de baixo) ou 'largura' (borda da direita). */
  function alca(tipo) {
    const el = h('div', { class: `tc-alca tc-alca-${tipo}`, title: tipo === 'altura' ? 'Arraste para mudar a altura da tela' : 'Arraste para mudar a largura das colunas', role: 'separator' });
    let ini = null;
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      el.setPointerCapture(e.pointerId);
      ini = { x: e.clientX, y: e.clientY, altura: ALTURA, largura: geometria().lp };
    });
    el.addEventListener('pointermove', (e) => {
      if (!ini) return;
      if (tipo === 'altura') ALTURA = Math.round(Math.max(260, Math.min(1600, ini.altura + (e.clientY - ini.y))));
      else larguraColuna = Math.round(Math.max(50, Math.min(320, ini.largura + (e.clientX - ini.x) / colunas().length)));
      if (prep) desenhar();
    });
    const soltar = () => {
      if (!ini) return;
      ini = null;
      U.pref.set('telaCarro:altura', ALTURA);
      if (larguraColuna) U.pref.set('telaCarro:largura', larguraColuna);
    };
    el.addEventListener('pointerup', soltar);
    el.addEventListener('pointercancel', soltar);
    el.addEventListener('dblclick', () => { ALTURA = 520; larguraColuna = null; U.pref.set('telaCarro:altura', 520); U.pref.set('telaCarro:largura', 0); if (prep) desenhar(); });
    return el;
  }

  /** Colunas da tela; com "F e T juntas", as duas bitolas ficam na mesma coluna. */
  /** Ordem das colunas e colunas escondidas (escolhidas em "Ordem"). */
  let ordem = U.pref.get('telaCarro:ordem', null) || PARAMETROS.map((p) => p.id);
  let ocultos = U.pref.get('telaCarro:ocultos', []) || [];
  const parametrosEmOrdem = () => {
    const ids = [...ordem.filter((id) => PARAMETROS.some((p) => p.id === id)), ...PARAMETROS.map((p) => p.id).filter((id) => !ordem.includes(id))];
    return ids.map((id) => PARAMETROS.find((p) => p.id === id));
  };

  function colunas() {
    const esc = (ids, chave) => { const auto = Math.max(...ids.map((id) => (prep && prep.escala ? prep.escala[id] : PARAMETROS.find((p) => p.id === id).escala))); return Math.max(0.5, auto / (zoom[chave || ids[0]] || 1)); };
    const visiveis = parametrosEmOrdem().filter((p) => !ocultos.includes(p.id));
    const lista = [];
    visiveis.forEach((p) => {
      if (juntas && (p.id === 'bitF' || p.id === 'bitT')) {
        if (lista.some((c) => c.id === 'bitFT')) return; // F e T juntas: uma coluna, na posição da primeira
        const f = PARAMETROS.find((x) => x.id === 'bitF'); const t = PARAMETROS.find((x) => x.id === 'bitT');
        // mesma escala e mesmo zoom da Bitola F: os limites ficam no mesmo lugar da coluna separada
        lista.push({ ...f, id: 'bitFT', nome: 'Bitola F+T', zoomId: 'bitF', escala: esc(['bitF', 'bitT'], 'bitF'), series: [f, t] });
        return;
      }
      lista.push({ ...p, escala: esc([p.id]), series: [p] });
    });
    return lista;
  }

  function editarOrdem() {
    let lista = parametrosEmOrdem().map((p) => p.id);
    let esc = [...ocultos];
    const caixa = h('div', { class: 'tc-ordem' });
    const render = () => ui.trocar(caixa, lista.map((id, k) => {
      const p = PARAMETROS.find((x) => x.id === id);
      return h('div', { class: 'tc-ordem-item' },
        h('label', { class: 'tc-ordem-nome' }, h('input', { type: 'checkbox', checked: !esc.includes(id), onchange: (e) => { esc = e.target.checked ? esc.filter((x) => x !== id) : [...esc, id]; } }), p.nome),
        h('button', { type: 'button', class: 'btn btn-secundario btn-pequeno', 'aria-label': `Subir ${p.nome}`, disabled: k === 0, onclick: () => { [lista[k - 1], lista[k]] = [lista[k], lista[k - 1]]; render(); } }, '▲'),
        h('button', { type: 'button', class: 'btn btn-secundario btn-pequeno', 'aria-label': `Descer ${p.nome}`, disabled: k === lista.length - 1, onclick: () => { [lista[k + 1], lista[k]] = [lista[k], lista[k + 1]]; render(); } }, '▼'));
    }));
    render();
    ui.modal({
      titulo: 'Ordem dos parâmetros',
      conteudo: h('div', { class: 'pilha' }, h('p', { class: 'sub', text: 'Use ▲ ▼ para mudar a ordem (de cima = coluna da esquerda). Desmarque para esconder a coluna.' }), caixa),
      acoes: [
        { texto: 'Ordem padrão', classe: 'btn-secundario', onClick: (fechar) => { ordem = PARAMETROS.map((p) => p.id); ocultos = []; U.pref.set('telaCarro:ordem', ordem); U.pref.set('telaCarro:ocultos', ocultos); fechar(); if (prep) desenhar(); } },
        { texto: 'Salvar', classe: 'btn-primario', onClick: (fechar) => { ordem = lista; ocultos = esc; U.pref.set('telaCarro:ordem', ordem); U.pref.set('telaCarro:ocultos', ocultos); fechar(); if (prep) desenhar(); } }
      ]
    });
  }

  /** Lê o arquivo da Análise e prepara as séries. */
  function carregar() {
    const est = App.analise && App.analise.estado ? App.analise.estado() : {};
    const mudou = est.arquivo !== arquivo || est.resultado !== resultado;
    arquivo = est.arquivo || null; resultado = est.resultado || null; nomeArquivo = est.nomeArquivo || '';
    if (!arquivo) {
      prep = null;
      renderControles();
      ui.trocar(cabecalhoEl); ui.trocar(leituraEl); ui.trocar(rodapeEl);
      ui.trocar(corpoEl, h('p', { class: 'vazio tc-vazio', text: 'Carregue o arquivo do carro em "Análise do arquivo" ou escolha um arquivo da Montagem acima.' }));
      return;
    }
    if (mudou || !prep) preparar();
    renderControles();
    desenhar();
  }

  function preparar() {
    const { pos } = arquivo;
    const n = pos.length;
    const esp = App.bitola.espacamento(pos) || 0.25;
    const dist = App.bitola.distanciaPercorrida(pos, esp);
    const tipo = new Uint8Array(n); // 0 tangente, 1 curva, 2 circuito
    const elementoDo = new Array(n);
    (resultado ? resultado.elementos : []).forEach((e) => {
      const t = e.tipo === 'C' ? 1 : (e.tipo === 'X' || e.rh ? 2 : 0);
      for (let i = e.i0; i <= e.i1; i++) { tipo[i] = t; elementoDo[i] = e; }
    });
    // eventos do arquivo: índice do ponto mais próximo do km do evento
    const eventos = (arquivo.eventos || []).map((ev) => {
      let melhor = 0; let d = Infinity;
      for (let i = 0; i < n; i += 4) { const x = Math.abs(pos[i] - ev.pos); if (x < d) { d = x; melhor = i; } }
      return { ...ev, i: melhor, trav: /\bTRA?V(ADOR)?\b/i.test(`${ev.texto} ${ev.codigo}`) };
    });
    // "INICIO X" + "FIM X" viram uma faixa com a extensão (túnel, AMV, RH, travador, lastro alto…)
    const faixas = []; const soltos = [];
    const nomeEv = (t) => String(t || '').replace(/^\s*(INICIO|INÍCIO|FIM)\s+/i, '').trim().toUpperCase();
    const usados = new Set();
    eventos.forEach((ev, k) => {
      if (usados.has(k)) return;
      if (/^\s*(INICIO|INÍCIO)\s+/i.test(ev.texto)) {
        const nome = nomeEv(ev.texto);
        const j = eventos.findIndex((x, m) => m > k && !usados.has(m) && /^\s*FIM\s+/i.test(x.texto) && nomeEv(x.texto) === nome);
        if (j >= 0) { usados.add(k); usados.add(j); faixas.push({ nome, i0: Math.min(ev.i, eventos[j].i), i1: Math.max(ev.i, eventos[j].i), trav: ev.trav, ini: ev, fim: eventos[j] }); return; }
      }
      soltos.push(ev);
    });
    eventos.faixas = faixas; eventos.soltos = soltos;
    prep = { n, esp, dist, tipo, elementoDo, eventos, total: dist[n - 1] || 0 };
    revelado = 0; // ao abrir, a tela começa vazia: o traçado aparece com o play, de baixo para cima
    topo = -janela;
    // escala automática: 98% dos valores do arquivo cabem com folga
    prep.escala = {};
    PARAMETROS.forEach((p) => {
      const v = p.campo === 'kld' && resultado && resultado.kldValido ? resultado.kldValido : arquivo.dados[p.campo];
      if (!v) { prep.escala[p.id] = p.escala; return; }
      const a = [];
      for (let i = 0; i < v.length; i += 7) if (!Number.isNaN(v[i])) a.push(Math.abs(v[i]));
      a.sort((x, y) => x - y);
      const p98 = a.length ? a[Math.floor(a.length * 0.98)] : p.escala;
      prep.escala[p.id] = escalaNice(Math.max(1, p98 * 1.3));
    });
    cursorI = null;
  }

  /* ---------------- Navegação ---------------- */

  // o topo pode ser negativo: no início o traçado nasce embaixo e sobe (como no Offboard)
  const limitarTopo = (t) => Math.max(-janela, Math.min(t, Math.max(0, prep.total - janela * 0.2)));
  function mover(dm) { topo = limitarTopo(topo + dm); desenhar(); }
  /** Avança o traçado (como o carro andando); a tela rola quando ele chega perto do fim. */
  function avancar(dm) {
    revelado = Math.min(prep.total, revelado + dm);
    topo = revelado - janela; // o ponto mais novo fica embaixo; o resto sobe
    desenhar();
  }
  function reiniciar() { revelado = 0; topo = -janela; cursorI = null; desenhar(); }

  function indicePorDist(d) {
    const { dist, n } = prep;
    let lo = 0; let hi = n - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (dist[m] < d) lo = m + 1; else hi = m; }
    return Math.min(n - 1, lo);
  }

  function irParaKm(texto) {
    const metros = App.bitola.kmParaMetros(texto);
    if (metros === null || !prep) { ui.toast('Km inválido. Use, por exemplo, 312 ou 312+089.', 'erro'); return; }
    let melhor = 0; let d = Infinity;
    arquivo.pos.forEach((p, i) => { const x = Math.abs(p - metros); if (x < d) { d = x; melhor = i; } });
    if (d > 500) ui.toast(`O km mais próximo no arquivo é ${App.bitola.fmtKm(arquivo.pos[melhor])}.`, 'info');
    mostrarPonto(melhor);
  }

  /**
   * Vai para um ponto do arquivo inteiro (ex.: alerta da Montagem). Pelo ponto, e não pelo km:
   * com o km compensado ou com o km voltando, o km do arquivo pode cair em outro lugar.
   */
  function irParaPonto(iArq) {
    if (!prep) return;
    const idx = arquivo.idx; // recortado: ponto no arquivo inteiro de cada ponto
    let k = iArq;
    if (idx) {
      let lo = 0; let hi = idx.length - 1;
      while (lo < hi) { const m = (lo + hi) >> 1; if (idx[m] < iArq) lo = m + 1; else hi = m; }
      k = lo;
    }
    mostrarPonto(Math.max(0, Math.min(prep.n - 1, k)));
  }

  function mostrarPonto(i) {
    revelado = prep.dist[i];
    topo = revelado - janela;
    cursorI = i;
    desenhar();
  }

  function tocar() {
    tocando = !tocando;
    renderControles();
    if (!tocando) return;
    ultimoQuadro = performance.now();
    const passo = (agora) => {
      if (!tocando || !raiz.offsetParent) { tocando = false; renderControles(); return; }
      const dt = (agora - ultimoQuadro) / 1000;
      ultimoQuadro = agora;
      avancar(BASE_MS * fator * dt);
      if (revelado >= prep.total) {
        tocando = false; renderControles();
        const prox = seguir ? vizinho(1) : null; // rodar os arquivos da Montagem em sequência
        if (prox) { ui.toast(`Próximo arquivo: ${prox.nome}`, 'info', 3000); abrirDaMontagem(prox.id, true); }
        return;
      }
      requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  }

  /* ---------------- Controles ---------------- */

  function renderControles() {
    const sel = (valor, opcoes, aoMudar, rotulo) => h('label', { class: 'tc-campo' }, h('span', { text: rotulo }),
      h('select', { value: String(valor), onchange: (e) => aoMudar(Number(e.target.value)) }, opcoes.map(([v, t]) => h('option', { value: String(v), text: t }))));
    const kmInput = h('input', { type: 'text', inputmode: 'decimal', placeholder: 'ex.: 312+000', 'aria-label': 'Ir para o km', onkeydown: (e) => { if (e.key === 'Enter') irParaKm(e.target.value); } });
    const atualId = idAtual();
    const anterior = vizinho(-1); const proximo = vizinho(1);
    const linhaMontagem = montagemLista.length ? h('div', { class: 'tc-linha tc-linha-arquivo' },
      h('label', { class: 'tc-campo tc-campo-arquivo' }, h('span', { text: `Arquivos da Montagem${App.montagem.ciclo() ? ` (ciclo ${App.montagem.ciclo()})` : ''}` }),
        h('select', { 'aria-label': 'Arquivo da Montagem', onchange: (e) => abrirDaMontagem(e.target.value) },
          h('option', { value: '', selected: !atualId || null, text: atualId ? '—' : `Arquivo da Análise${nomeArquivo ? `: ${nomeArquivo}` : ''}` }),
          montagemLista.map((a) => h('option', { value: a.id, selected: a.id === atualId || null, text: a.rotulo })))),
      h('div', { class: 'tc-botoes' },
        h('button', { class: 'btn btn-secundario btn-pequeno', type: 'button', disabled: !anterior || null, title: anterior ? anterior.nome : '', onclick: () => abrirDaMontagem(anterior.id) }, ui.icone('esquerda'), 'Anterior'),
        h('button', { class: 'btn btn-secundario btn-pequeno', type: 'button', disabled: !proximo || null, title: proximo ? proximo.nome : '', onclick: () => abrirDaMontagem(proximo.id) }, 'Próximo', ui.icone('direita'))),
      h('label', { class: 'chip-sel' }, h('input', { type: 'checkbox', checked: seguir || null, onchange: (e) => { seguir = e.target.checked; U.pref.set('telaCarro:seguir', seguir); } }), 'Ao terminar, rodar o próximo arquivo')) : null;
    ui.trocar(controlesEl,
      linhaMontagem,
      h('div', { class: 'tc-linha' },
        h('div', { class: 'tc-campo' }, h('span', { text: 'Ir para o km' }),
          h('div', { class: 'linha-campo' }, kmInput, h('button', { class: 'btn btn-secundario btn-pequeno', type: 'button', onclick: () => irParaKm(kmInput.value) }, 'Ir'))),
        sel(janela, [[250, '250 m'], [500, '500 m'], [1000, '1.000 m'], [2000, '2.000 m']], (v) => { janela = v; U.pref.set('telaCarro:janela', v); if (prep) { topo = revelado - janela; desenhar(); } }, 'Trecho na tela'),
        sel(velocidade, VELOCIDADES.map((v) => [v, `${v} km/h`]), (v) => { velocidade = v; U.pref.set('telaCarro:velocidade', v); desenhar(); }, 'Limites para'),
        sel(fator, [1, 2, 3, 5, 10, 20].map((v) => [v, `${v}×`]), (v) => { fator = v; U.pref.set('telaCarro:fator', v); }, 'Velocidade'),
        h('div', { class: 'tc-botoes' },
          h('button', { class: 'btn btn-secundario btn-pequeno', type: 'button', title: 'Voltar um trecho', disabled: !prep, onclick: () => mover(-janela * 0.8) }, '▲'),
          h('button', { class: `btn ${tocando ? 'btn-primario' : 'btn-secundario'} btn-pequeno`, type: 'button', disabled: !prep, onclick: tocar }, ui.icone(tocando ? 'parar' : 'play'), tocando ? 'Pausar' : 'Reproduzir'),
          h('button', { class: 'btn btn-secundario btn-pequeno', type: 'button', title: 'Avançar um trecho', disabled: !prep, onclick: () => (topo + janela >= revelado ? avancar(janela * 0.8) : mover(janela * 0.8)) }, '▼'),
          h('button', { class: 'btn btn-secundario btn-pequeno', type: 'button', title: 'Voltar ao início do arquivo, com a tela vazia', disabled: !prep, onclick: reiniciar }, 'Reiniciar'),
          h('button', { class: 'btn btn-secundario btn-pequeno', type: 'button', onclick: editarLimites }, ui.icone('ajustes'), 'Limites'),
          h('button', { class: 'btn btn-secundario btn-pequeno', type: 'button', onclick: editarOrdem }, '⇅ Ordem')),
        h('label', { class: 'chip-sel tc-juntas' }, h('input', {
          type: 'checkbox', checked: juntas,
          onchange: (e) => { juntas = e.target.checked; U.pref.set('telaCarro:juntas', juntas); if (prep) desenhar(); }
        }), 'Bitola F e T juntas')));
  }

  /* ---------------- Desenho ---------------- */

  function geometria() {
    const largura = Math.max(320, corpoEl.parentElement ? corpoEl.parentElement.clientWidth : 900);
    const base = COL_KM + COL_EX + COL_EL;
    const nc = colunas().length;
    const lp = larguraColuna || Math.max(78, Math.floor((largura - base - 12) / nc));
    return { lp, W: base + lp * nc, base };
  }

  function colunaEm(x) {
    const { lp, base } = geometria();
    const cols = colunas();
    const k = Math.floor((x - base) / lp);
    return k >= 0 && k < cols.length ? cols[k] : null;
  }

  const s = (tag, attrs = {}, ...filhos) => {
    const el = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => { if (v !== null && v !== undefined) el.setAttribute(k, String(v)); });
    filhos.flat().forEach((f) => { if (f) el.appendChild(typeof f === 'string' ? document.createTextNode(f) : f); });
    return el;
  };

  function mudarZoom(id, f) {
    zoom[id] = Math.max(0.25, Math.min(16, (zoom[id] || 1) * f));
    U.pref.set('telaCarro:zoom', zoom);
    desenhar();
  }

  function desenhar() {
    if (!prep) return;
    const { lp, W, base } = geometria();
    const H = ALTURA;
    const { dist, tipo, n } = prep;
    const dados = (resultado && resultado.dados) || arquivo.dados;
    const i0 = indicePorDist(Math.max(0, topo));
    // só o que o "carro" já percorreu (play): ao abrir, nada é desenhado
    const i1 = revelado > Math.max(topo, 0) ? Math.min(indicePorDist(topo + janela), indicePorDist(revelado)) : -1;
    const yDe = (i) => ((dist[i] - topo) / janela) * H;
    const tipoLim = (i) => (tipo[i] === 1 ? 'C' : 'T');

    // cabeçalho (nomes girados, como na tela do carro)
    ui.trocar(cabecalhoEl, h('div', { class: 'tc-cab-linha', style: { width: `${W}px` } },
      h('div', { class: 'tc-cab-cel', style: { width: `${COL_KM}px` } },
        h('button', {
          type: 'button', class: 'tc-seta-escala', title: mostrarEscala ? 'Esconder os botões de escala' : 'Mostrar os botões de escala (+ / −)',
          'aria-label': mostrarEscala ? 'Esconder escala' : 'Mostrar escala', 'aria-expanded': mostrarEscala ? 'true' : 'false',
          onclick: () => { mostrarEscala = !mostrarEscala; U.pref.set('telaCarro:mostrarEscala', mostrarEscala); desenhar(); }
        }, mostrarEscala ? '◂ escala' : 'escala ▸')),
      h('div', { class: 'tc-cab-cel tc-cab-gira', style: { width: `${COL_EX}px` } }, h('span', { text: 'EX' })),
      h('div', { class: 'tc-cab-cel tc-cab-gira', style: { width: `${COL_EL}px` } }, h('span', { text: 'T/E' })),
      colunas().map((p) => h('div', { class: 'tc-cab-cel tc-cab-gira', style: { width: `${lp}px` }, title: p.nome },
        mostrarEscala && h('div', { class: 'tc-zoom' },
          h('button', { type: 'button', title: 'Diminuir a escala (mais detalhe)', 'aria-label': `Aproximar ${p.nome}`, onclick: () => mudarZoom(p.zoomId || p.id, 1.5) }, '+'),
          h('button', { type: 'button', title: 'Aumentar a escala', 'aria-label': `Afastar ${p.nome}`, onclick: () => mudarZoom(p.zoomId || p.id, 1 / 1.5) }, '−')),
        h('span', null, h('strong', { text: p.nome }), h('small', { text: `±${String(Math.round(p.escala * 10) / 10).replace('.', ',')}` }))))));

    const svg = s('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'tc-svg' });
    // km na lateral (sem linha horizontal)
    const passoKm = janela <= 500 ? 50 : (janela <= 1000 ? 100 : 200);
    for (let d = Math.max(0, Math.ceil(topo / passoKm) * passoKm); d <= Math.min(topo + janela, revelado); d += passoKm) {
      const i = indicePorDist(d);
      const y = ((d - topo) / janela) * H;
      if (y < 8 || y > H - 4) continue;
      svg.appendChild(s('text', { x: COL_KM - 6, y: y + 4, class: 'tc-km', 'text-anchor': 'end' }, App.bitola.fmtKm(arquivo.pos[i])));
    }

    // coluna T/E: elementos (tangente = linha, curva = barra azul, RH = cinza) e eventos
    const xEl = COL_KM + COL_EX;
    const vistos = new Set();
    for (let i = i0; i <= i1; i++) {
      const e = prep.elementoDo[i];
      if (!e || vistos.has(e)) continue;
      vistos.add(e);
      const ya = Math.max(0, yDe(Math.max(e.i0, i0))); const yb = Math.min(H, yDe(Math.min(e.i1, i1)));
      const t = e.tipo === 'C' ? 'curva' : (e.tipo === 'X' || e.rh ? 'rh' : 'tangente');
      if (t === 'tangente') svg.appendChild(s('line', { x1: xEl + 32, x2: xEl + 32, y1: ya, y2: yb, class: 'tc-el-tangente' }));
      else svg.appendChild(s('rect', { x: xEl + 28, y: ya, width: 9, height: Math.max(1, yb - ya), class: `tc-el-${t}` }));
      if (yb - ya > 26) svg.appendChild(s('text', { x: xEl + 40, y: (ya + yb) / 2 + 3, class: 'tc-el-rotulo' }, t === 'rh' ? (e.trecho || 'RH').split(' · ')[0].replace('RH-', 'R') : e.sigla));
    }
    // eventos com extensão (INICIO/FIM): barra na lateral esquerda durante todo o trecho, com o nome na vertical
    const classeEv = (nome) => (/^EX\b/.test(nome) ? 'ex' : /TUNEL|TÚNEL/.test(nome) ? 'tunel' : /TRA?V/.test(nome) ? 'trav' : /AMV/.test(nome) ? 'amv' : /^RH/.test(nome) ? 'rh' : 'outro');
    (prep.eventos.faixas || []).forEach((fx) => {
      if (fx.i1 < i0 || fx.i0 > i1) return;
      const a = Math.max(0, yDe(Math.max(fx.i0, i0))); const b = Math.min(H, yDe(Math.min(fx.i1, i1)));
      const ya = Math.min(a, b); const yb = Math.max(a, b);
      const g = s('g', { class: `tc-ev tc-ev-faixa tc-ev-${classeEv(fx.nome)}` }, s('title', {}, `${fx.nome}: ${App.bitola.fmtKm(fx.ini.pos)} → ${App.bitola.fmtKm(fx.fim.pos)}`));
      g.appendChild(s('rect', { x: xEl + 2, y: ya, width: 5, height: Math.max(2, yb - ya) }));
      g.appendChild(s('text', { x: xEl + 17, y: yb - 2, transform: `rotate(-90 ${xEl + 17} ${yb - 2})`, 'text-anchor': 'start' }, fx.nome.slice(0, 16)));
      svg.appendChild(g);
    });
    // eventos de um ponto (JIC, PSUP, lubrificador…): marca e texto na vertical (lido de baixo para cima)
    (prep.eventos.soltos || prep.eventos).forEach((ev) => {
      if (ev.i < i0 || ev.i > i1) return;
      const y = yDe(ev.i);
      const g = s('g', { class: ev.trav ? 'tc-ev tc-ev-trav' : 'tc-ev' }, s('title', {}, `${ev.texto} (${App.bitola.fmtKm(ev.pos)})`));
      g.appendChild(s('line', { x1: xEl + 1, x2: xEl + 26, y1: y, y2: y }));
      g.appendChild(s('text', { x: xEl + 17, y: y - 2, transform: `rotate(-90 ${xEl + 17} ${y - 2})`, 'text-anchor': 'start' }, ev.trav ? 'TRAV' : ev.texto.slice(0, 16)));
      svg.appendChild(g);
    });

    // colunas dos parâmetros
    const filas = Math.ceil(H); // uma fila por pixel
    const excessoGeral = new Uint8Array(filas + 1);
    colunas().forEach((col, k) => {
      const x0 = base + k * lp;
      const cx = x0 + lp / 2;
      const meia = lp / 2 - 6;
      // valor maior à esquerda da linha zero (como no Offboard)
      const xv = (v) => cx - (Math.max(-col.escala, Math.min(col.escala, v)) / col.escala) * meia;
      const dentro = (v) => Math.abs(v) <= col.escala;
      const lims = limitesDe(col.series[0], velocidade);
      // linha zero (bitola: 1000 mm), indispensável
      svg.appendChild(s('line', { x1: cx, x2: cx, y1: 0, y2: H, class: 'tc-zero' }));
      // limites (pontilhado) de cada nível, por fila (mudam entre curva e tangente); fora da escala não aparecem
      const elF = new Array(filas + 1);
      for (let i = i0; i <= i1; i++) {
        const f = Math.max(0, Math.min(filas, Math.round(yDe(i))));
        if (!elF[f]) elF[f] = tipoLim(i);
      }
      NIVEIS.forEach((nv) => ['sup', 'inf'].forEach((lado) => {
        let d = ''; let aberto = false;
        for (let f = 0; f <= filas; f++) {
          if (!elF[f]) continue;
          const l = lims[nv.id][elF[f]];
          if (!l || !dentro(l[lado])) { aberto = false; continue; }
          d += `${aberto ? 'L' : 'M'}${xv(l[lado]).toFixed(1)},${f}`;
          aberto = true;
        }
        if (d) svg.appendChild(s('path', { d, class: `tc-limite tc-limite-${nv.id}` }));
      }));
      let algum = false;
      col.series.forEach((p) => {
        // KLD: só leituras válidas (|valor| < 60 mm), como na análise
        const serie = p.campo === 'kld' && resultado && resultado.kldValido ? resultado.kldValido : dados[p.campo];
        if (!serie) return;
        algum = true;
        // agrega por fila de pixel: mín, máx e excesso
        const minF = new Float64Array(filas + 1).fill(NaN); const maxF = new Float64Array(filas + 1).fill(NaN);
        const exc = new Uint8Array(filas + 1);
        for (let i = i0; i <= i1; i++) {
          const v = serie[i];
          if (Number.isNaN(v)) continue;
          const f = Math.max(0, Math.min(filas, Math.round(yDe(i))));
          if (Number.isNaN(minF[f]) || v < minF[f]) minF[f] = v;
          if (Number.isNaN(maxF[f]) || v > maxF[f]) maxF[f] = v;
          const g = grauExcesso(lims, tipoLim(i), v);
          if (g > exc[f]) exc[f] = g;
          if (g > excessoGeral[f]) excessoGeral[f] = g;
        }
        // traçado: em cada fila, do mínimo ao máximo, ligado à fila seguinte;
        // o trecho que passa do limite fica vermelho
        let d = ''; let antes = false;
        const dv = ['', '', '', '']; let antesV = 0;
        for (let f = 0; f <= filas; f++) {
          if (Number.isNaN(minF[f])) { antes = false; antesV = 0; continue; }
          const seg = `${xv(minF[f]).toFixed(1)},${f}L${xv(maxF[f]).toFixed(1)},${f}`;
          d += `${antes ? 'L' : 'M'}${seg}`;
          antes = true;
          const g = exc[f];
          if (g) { dv[g] += `${antesV === g ? 'L' : 'M'}${seg}`; antesV = g; } else antesV = 0;
        }
        if (d) svg.appendChild(s('path', { d, class: 'tc-sinal', stroke: p.cor }));
        NIVEIS.forEach((nv) => { if (dv[nv.grau]) svg.appendChild(s('path', { d: dv[nv.grau], class: `tc-sinal tc-sinal-excesso tc-exc-${nv.id}` })); });
      });
      if (!algum) svg.appendChild(s('text', { x: cx, y: 20, class: 'tc-sem', 'text-anchor': 'middle' }, 'sem dado'));
    });
    // coluna EX: excesso em qualquer parâmetro
    for (let f = 0; f <= filas; f++) {
      const grau = excessoGeral[f];
      if (!grau) continue;
      let g = f; while (g <= filas && excessoGeral[g] === grau) g++;
      svg.appendChild(s('rect', { x: COL_KM + 6, y: f, width: COL_EX - 10, height: Math.max(2, g - f), class: `tc-ex tc-ex-${NIVEIS[grau - 1].id}` }));
      f = g - 1;
    }
    svg.appendChild(s('g', { class: 'tc-cursor' }));
    ui.trocar(corpoEl, svg);
    desenharCursor();
    renderRodape();
  }

  function desenharCursor() {
    const svg = corpoEl.querySelector('svg');
    if (!svg || !prep) return;
    const g = svg.querySelector('.tc-cursor');
    while (g.firstChild) g.removeChild(g.firstChild);
    const dados = (resultado && resultado.dados) || arquivo.dados;
    const fmt = (v) => (Number.isNaN(v) || v === undefined ? '—' : v.toFixed(2).replace('.', ','));
    if (cursorI === null) {
      const i = indicePorDist(topo);
      ui.trocar(leituraEl, h('span', { class: 'tc-leitura-km', text: revelado > 0 ? App.bitola.fmtKm(arquivo.pos[i]) : '' }));
      renderRodape();
      return;
    }
    const y = ((prep.dist[cursorI] - topo) / janela) * ALTURA;
    const W = Number(svg.getAttribute('width'));
    g.appendChild(s('line', { x1: COL_KM, x2: W, y1: y, y2: y, class: 'tc-cursor-linha' }));
    // leitura no topo: km + parâmetro sob o mouse (máx, mín e média do trecho na tela), como no Offboard
    const km = App.bitola.fmtKm(arquivo.pos[cursorI]);
    const partes = [h('span', { class: 'tc-leitura-km', text: km })];
    if (colunaAtiva) {
      colunaAtiva.series.forEach((p) => {
        const serie = dados[p.campo];
        if (!serie) return;
        const i0 = indicePorDist(topo); const i1 = Math.min(indicePorDist(topo + janela), indicePorDist(revelado));
        let mx = -Infinity; let mn = Infinity; let soma = 0; let q = 0;
        for (let i = i0; i <= i1; i++) { const v = serie[i]; if (Number.isNaN(v)) continue; mx = Math.max(mx, v); mn = Math.min(mn, v); soma += v; q++; }
        partes.push(h('strong', { text: p.nome }), h('span', { text: `VALOR: ${fmt(serie[cursorI])}  MÁX: ${q ? fmt(mx) : '—'}  MÍN: ${q ? fmt(mn) : '—'}  MÉD: ${q ? fmt(soma / q) : '—'}` }));
      });
    } else {
      partes.push(h('span', { text: PARAMETROS.map((p) => `${p.nome} ${fmt(dados[p.campo] ? dados[p.campo][cursorI] : NaN)}`).join('   ') }));
    }
    ui.trocar(leituraEl, partes);
    renderRodape();
  }

  function renderRodape() {
    if (!prep) return;
    const m = arquivo.meta || {};
    const i = cursorI !== null ? cursorI : indicePorDist(topo);
    const e = prep.elementoDo[i];
    const par = (r, v) => h('span', null, h('b', { text: r }), ` ${v || '—'}`);
    ui.trocar(rodapeEl,
      h('div', { class: 'tc-rodape-km', text: App.bitola.fmtKm(arquivo.pos[i]).replace('+', ', ') }),
      h('div', { class: 'tc-rodape-dados' },
        par('FERROVIA', 'EFVM'), par('RAMAL', m.ramal), par('CORRETIVA', m.corretiva),
        par('LINHA', App.bitola.linhaDoTrecho(arquivo, i, i)), par('DATA', m.data), par('INSPETOR', m.inspetor),
        par('ARQUIVO', nomeArquivo), par('ELEMENTO', e ? [e.trecho || e.eh, e.tipo === 'X' ? 'RH' : e.sigla].filter(Boolean).join(' · ') : ''),
        par('LIMITES', `${velocidade} km/h${edicoes[velocidade] ? ' (editados)' : ' (EFVM 2026)'}`)));
  }

  /* ---------------- Edição dos limites ---------------- */

  function editarLimites() {
    const linhas = PARAMETROS.filter((p) => p.grupo);
    const atual = {};
    linhas.forEach((p) => { atual[p.id] = JSON.parse(JSON.stringify(limitesDe(p, velocidade))); });
    let nivel = 'restricao';
    const caixa = h('div', { class: 'pilha' });
    const campo = (p, el, lado) => {
      const lim = atual[p.id][nivel][el];
      return h('input', {
        type: 'text', inputmode: 'decimal', class: 'tc-lim-input', 'aria-label': `${p.nome} ${el === 'C' ? 'curva' : 'tangente'} ${lado === 'sup' ? 'superior' : 'inferior'}`,
        value: lim ? String(lim[lado]).replace('.', ',') : '',
        onchange: (e) => {
          const v = U.numero(e.target.value);
          if (e.target.value.trim() === '') { atual[p.id][nivel][el] = null; return; }
          if (v === null) { e.target.value = ''; return; }
          const l = atual[p.id][nivel][el] || { sup: Math.abs(v), inf: -Math.abs(v) };
          l[lado] = v;
          atual[p.id][nivel][el] = l;
        }
      });
    };
    const render = () => ui.trocar(caixa,
      h('div', { class: 'seg seg-compacto', role: 'group', 'aria-label': 'Nível do limite' },
        NIVEIS.map((n) => h('button', { type: 'button', class: `seg-opcao tc-nivel-${n.id}${nivel === n.id ? ' ativo' : ''}`, onclick: () => { nivel = n.id; render(); } }, n.nome))),
      h('p', { class: 'sub', text: `${NIVEIS.find((n) => n.id === nivel).nome}: valores em mm em relação à linha zero (bitola: em relação a 1000 mm; fechada 987 = −13). Em branco: sem limite.${nivel === 'restricao' ? ' Padrão: tabela EFVM 2026.' : ''}` }),
      h('div', { class: 'tabela-rolagem' }, h('table', { class: 'tabela tabela-centro tc-lim' },
        h('thead', null,
          h('tr', null, h('th', { text: 'Parâmetro', rowspan: 2 }), h('th', { text: 'Curva', colspan: 2 }), h('th', { text: 'Tangente', colspan: 2 })),
          h('tr', null, ['Superior', 'Inferior', 'Superior', 'Inferior'].map((t) => h('th', { text: t })))),
        h('tbody', null, linhas.map((p) => h('tr', null, h('td', { text: p.nome }),
          h('td', null, campo(p, 'C', 'sup')), h('td', null, campo(p, 'C', 'inf')),
          h('td', null, campo(p, 'T', 'sup')), h('td', null, campo(p, 'T', 'inf'))))))));
    render();
    ui.modal({
      titulo: `Limites para ${velocidade} km/h`,
      conteudo: caixa,
      acoes: [
        { texto: 'Restaurar tabela EFVM 2026', classe: 'btn-secundario', onClick: (fechar) => { delete edicoes[velocidade]; U.pref.set('telaCarro:limites', edicoes); fechar(); desenhar(); ui.toast('Limites da tabela EFVM 2026 restaurados (alerta e interdição em branco).', 'ok'); } },
        { texto: 'Salvar', classe: 'btn-primario', onClick: (fechar) => { edicoes[velocidade] = atual; U.pref.set('telaCarro:limites', edicoes); fechar(); desenhar(); ui.toast(`Limites para ${velocidade} km/h salvos.`, 'ok'); } }
      ]
    });
  }

  /** Níveis de limite de um parâmetro (id) num elemento ('C' curva / 'T' tangente), na velocidade escolhida na tela. */
  function niveisLimite(id, el, vel = velocidade) {
    const p = PARAMETROS.find((x) => x.id === id);
    if (!p) return [];
    const lims = limitesDe(p, vel);
    return NIVEIS.map((n) => (lims[n.id] && lims[n.id][el] ? { grau: n.grau, nome: n.nome, sup: lims[n.id][el].sup, inf: lims[n.id][el].inf } : null)).filter(Boolean);
  }

  App.telaCarro = {
    montar, aoMostrar, niveisLimite,
    velocidade: () => velocidade,
    VELOCIDADES,
    irParaKm: (t) => { if (prep) irParaKm(t); },
    irParaPonto,
    _limitesPadrao: limitesPadrao, _PARAMETROS: PARAMETROS, _VELOCIDADES: VELOCIDADES

  <script>
/* js/modulos/montagem.js */
/*
 * Montagem dos dados: junta os arquivos do carro de um ciclo e mostra, pela geometria,
 * quanto do trecho já está medido, onde há buracos, sobreposições e inconsistências de km.
 * Cada arquivo tem que complementar o vizinho (ex.: GV1 encosta no GV2) antes de subir para o banco.
 */
'use strict';

(function (App) {
  const { U, ui, store } = App;
  const { h } = ui;
  const B = () => App.bitola;
  const C = () => App.cobertura;
  const CHAVE = 'montagem:arquivos';
  const CHAVE_CSV = (id) => `montagem:csv:${id}`;

  let raiz;
  let planta = null;
  let arquivos = []; // [{ id, nome, ciclo, adicionadoEm, recorte, resumo }]
  let processando = false;
  const abertos = new Set(); // linhas abertas ("linha|sede") e arquivos abertos ("arq|id")
  let carregado = null; // promessa da primeira leitura do armazenamento

  const km = (m) => B().fmtKm(m);
  const kmTxt = (m) => `${(m / 1000).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} km`;
  const mTxt = (m) => (m >= 1000 ? kmTxt(m) : `${Math.round(m).toLocaleString('pt-BR')} m`);
  const pctTxt = (p) => `${p.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%`;
  const ciclo = () => U.pref.get('montagem:ciclo', (App.OM && App.OM.cicloAtivo()) || '');
  const doCiclo = () => arquivos.filter((a) => (a.ciclo || '') === ciclo());
  const aba = () => U.pref.get('montagem:aba', 'cobertura');
  /** Saltos/voltas dentro do trecho usado: os dois lados do pulo (km do arquivo) ficam dentro do recorte. */
  const dentroRecorte = (rc, x) => !rc || ((rc.de === null || rc.de === undefined || x >= rc.de) && (rc.ate === null || rc.ate === undefined || x <= rc.ate));
  const compensaveisUsados = (a) => a.resumo.compensaveis.filter((c) => dentroRecorte(a.recorte, c.de) && dentroRecorte(a.recorte, c.km));
  /** Regras da compensação de km (editáveis): margem em m e máximo por ponto em fração do espaçamento. */
  const regras = () => ({ ...B().COMPENSACAO, ...(U.pref.get('montagem:compensacao', {}) || {}) });

  function carregar() {
    if (!carregado) {
      carregado = (async () => {
        planta = App.analise && App.analise.planta ? await App.analise.planta() : null;
        try {
          const salvos = (await store.get(CHAVE)) || [];
          arquivos = salvos.map((a) => ({ ...a, compensar: a.compensar || [], resumo: C().normalizarResumo(a.resumo) }));
          // arquivos adicionados antes desta versão não têm o CSV guardado nem o cálculo dos saltos/voltas
          for (const a of arquivos) a.antigo = !a.resumo.espacamento || !(await store.get(CHAVE_CSV(a.id)).catch(() => null));
        } catch (e) { arquivos = []; }
      })();
    }
    return carregado;
  }

  /**
   * Arquivos calculados numa versão anterior do app (resumo sem a versão atual): recalcula a partir do CSV
   * guardado, mantendo recorte, compensações e correção da linha. Roda em segundo plano, um arquivo por vez.
   */
  let atualizando = null; // { feitos, total } enquanto recalcula
  async function atualizarResumos() {
    if (atualizando || !planta) return;
    const lista = arquivos.filter((a) => !a.antigo && a.resumo.versao !== C().VERSAO_RESUMO);
    if (!lista.length) return;
    atualizando = { feitos: 0, total: lista.length };
    render();
    let ok = 0;
    for (const a of lista) {
      await new Promise((r) => setTimeout(r, 30)); // deixa a tela responder entre um arquivo e outro
      try {
        const texto = await lerCsv(a.id);
        if (texto) {
          const rg = a.regras || regras();
          a.resumo = C().resumirArquivo(B().lerCSV(texto), planta, a.nome, { compensar: a.compensar || [], compensacao: rg, linhas: a.linhas || null });
          a.compensar = (a.compensar || []).filter((ch) => a.resumo.compensaveis.some((c) => c.chave === ch));
          a.regras = rg;
          ok++;
        }
      } catch (e) { /* fica como estava; tenta de novo na próxima vez */ }
      atualizando.feitos++;
      render();
    }
    atualizando = null;
    if (ok) {
      await gravar();
      ui.toast(`${ok} arquivo(s) atualizado(s) para a versão nova (LOCOM, linha do arquivo e RH).`, 'ok', 5000);
    }
    render();
  }

  /* ---------------- CSV guardado (comprimido) ---------------- */

  /** Guarda o CSV comprimido (gzip): a Tela do carro roda o arquivo e a compensação do km recalcula a partir dele. */
  async function guardarCsv(id, texto) {
    try {
      if (typeof CompressionStream !== 'undefined') {
        const blob = await new Response(new Blob([texto]).stream().pipeThrough(new CompressionStream('gzip'))).blob();
        await store.set(CHAVE_CSV(id), { gz: blob });
      } else await store.set(CHAVE_CSV(id), { texto });
    } catch (e) { ui.toast(`O arquivo não pôde ser guardado inteiro (${e.message}).`, 'erro', 8000); }
  }
  async function lerCsv(id) {
    const g = await store.get(CHAVE_CSV(id)).catch(() => null);
    if (!g) return null;
    if (g.texto) return g.texto;
    return new Response(g.gz.stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  const semCsv = () => ui.toast('Este arquivo foi adicionado numa versão anterior: na Montagem, clique em "Adicionar de novo" e escolha o mesmo arquivo (o recorte é mantido).', 'erro', 9000);
  const gravar = () => store.set(CHAVE, arquivos).catch((e) => ui.toast(`Não foi possível guardar: ${e.message}`, 'erro', 6000));

  /* ---------------- Arquivos ---------------- */

  /** Assinatura do conteúdo do arquivo: o mesmo arquivo com outro nome também é reconhecido como repetido. */
  const assinatura = (pontos, kmIni, kmFim, meta) => [pontos, Math.round(kmIni * 100), Math.round(kmFim * 100), meta.data, meta.corretiva, meta.ramal].join('|');
  const assinaturaDe = (a) => assinatura(a.resumo.pontos, a.resumo.kmIni, a.resumo.kmFim, a.resumo.meta || {});

  /** substituir: true = já confirmado (ex.: "Adicionar de novo" de um arquivo antigo), sem perguntar. */
  async function adicionar(lista, { substituir = false } = {}) {
    if (!planta) { ui.toast('Importe a geometria na Análise do arquivo primeiro.', 'erro', 6000); return; }
    processando = true;
    render();
    let ok = 0; let mantidos = 0;
    for (let k = 0; k < lista.length; k++) {
      const f = lista[k];
      ui.toast(`Processando ${k + 1}/${lista.length}: ${f.name}…`, 'info', 4000);
      await new Promise((r) => setTimeout(r, 30)); // deixa a tela mostrar o aviso
      try {
        const { nome, texto } = await App.analise.textoDoArquivo(f);
        const arq = B().lerCSV(texto);
        const rg = regras();
        // repetido no ciclo: mesmo nome ou mesmo conteúdo (com outro nome)
        const sig = assinatura(arq.pos.length, arq.pos[0], arq.pos[arq.pos.length - 1], arq.meta);
        const doCicloAtual = (a) => (a.ciclo || '') === ciclo();
        let existente = arquivos.findIndex((a) => a.nome === nome && doCicloAtual(a));
        if (existente < 0) existente = arquivos.findIndex((a) => doCicloAtual(a) && !a.antigo && assinaturaDe(a) === sig);
        const anterior = existente >= 0 ? arquivos[existente] : null;
        if (anterior && !substituir) {
          const outroNome = anterior.nome !== nome ? ` com o nome ${anterior.nome} (mesmo conteúdo)` : '';
          const sim = await ui.confirmar('Arquivo já carregado',
            `${nome} já está na Montagem${outroNome}, adicionado em ${U.fmtDataHora(anterior.adicionadoEm) || '—'}. Substituir o arquivo existente? Ele é carregado do zero: o corte, as compensações e a correção da linha do arquivo atual são descartados.`,
            { ok: 'Substituir' });
          if (!sim) { mantidos++; continue; }
        }
        // substituir = carregar do zero; só o "Adicionar de novo" (arquivo de versão antiga) mantém o recorte,
        // a correção da linha e as compensações que ainda existem nele
        const manter = anterior && substituir ? anterior : null;
        const linhas = manter ? manter.linhas || null : null;
        const resumo = C().resumirArquivo(arq, planta, nome, { compensacao: rg, linhas });
        const compensar = manter ? (manter.compensar || []).filter((ch) => resumo.compensaveis.some((c) => c.chave === ch)) : [];
        const final = compensar.length ? C().resumirArquivo(arq, planta, nome, { compensar, compensacao: rg, linhas }) : resumo;
        const item = { id: manter ? manter.id : `${Date.now()}-${k}`, nome, ciclo: ciclo(), adicionadoEm: U.agora(), recorte: manter ? manter.recorte : null, compensar, regras: rg, linhas, resumo: final };
        if (anterior && !manter) await store.del(CHAVE_CSV(anterior.id)).catch(() => {}); // CSV do arquivo substituído
        await guardarCsv(item.id, texto);
        if (existente >= 0) arquivos[existente] = item; else arquivos.push(item);
        ok++;
      } catch (e) {
        ui.toast(`${f.name}: ${e.message}`, 'erro', 8000);
      }
    }
    processando = false;
    await gravar();
    if (ok) ui.toast(`${ok} arquivo(s) adicionado(s).${mantidos ? ` ${mantidos} repetido(s) não substituído(s).` : ''}`, 'ok');
    else if (mantidos) ui.toast(`${mantidos} arquivo(s) repetido(s): o existente foi mantido.`, 'info', 5000);
    render();
  }

  async function remover(a) {
    if (!(await ui.confirmar('Remover arquivo', `Remover ${a.nome} da montagem?`, { ok: 'Remover', perigo: true }))) return;
    arquivos = arquivos.filter((x) => x !== a);
    cortes.delete(a.id);
    await store.del(CHAVE_CSV(a.id)).catch(() => {});
    await gravar();
    render();
  }

  /** Escolher de novo o arquivo (versão anterior): guarda o CSV e recalcula, mantendo o recorte. */
  function reAdicionar(a) {
    const input = h('input', { type: 'file', hidden: true, onchange: async (e) => {
      const f = e.target.files[0];
      input.remove();
      if (!f) return;
      const base = (n) => String(n || '').replace(/\.(zip|csv|txt)$/i, '').toLowerCase();
      if (base(f.name) !== base(a.nome) && !(await ui.confirmar('Arquivo diferente', `Você escolheu ${f.name}, mas este é ${a.nome}. Usar mesmo assim?`, { ok: 'Usar' }))) return;
      await adicionar([f], { substituir: true });
    } });
    document.body.appendChild(input);
    input.click();
  }

  /** Compensar (ou desfazer) um salto/volta do km: recalcula o arquivo a partir do CSV guardado. */
  async function mudarCompensacao(a, chave, compensar) {
    const texto = await lerCsv(a.id).catch(() => null);
    if (!texto) { semCsv(); return; }
    const lista = compensar ? [...new Set([...(a.compensar || []), chave])] : (a.compensar || []).filter((x) => x !== chave);
    ui.toast(`Recalculando ${a.nome}…`, 'info', 3000);
    await new Promise((r) => setTimeout(r, 30));
    try {
      const rg = regras();
      a.resumo = C().resumirArquivo(B().lerCSV(texto), planta, a.nome, { compensar: lista, compensacao: rg, linhas: a.linhas });
      a.compensar = lista.filter((ch) => a.resumo.compensaveis.some((c) => c.chave === ch));
      a.regras = rg;
      await gravar();
      ui.toast(compensar ? 'Compensado: a diferença foi distribuída nos pontos desde o último acerto do km.' : 'Compensação desfeita.', 'ok');
    } catch (e) { ui.toast(`Não foi possível recalcular: ${e.message}`, 'erro', 7000); }
    render();
  }

  /** Correção da coluna LINHA (trocar um valor ou definir a linha num trecho de km): recalcula o arquivo. */
  async function mudarLinhas(a, linhas, mensagem) {
    const texto = await lerCsv(a.id).catch(() => null);
    if (!texto) { semCsv(); return; }
    ui.toast(`Recalculando ${a.nome}…`, 'info', 3000);
    await new Promise((r) => setTimeout(r, 30));
    try {
      const vazio = !Object.keys(linhas.valores || {}).length && !(linhas.trechos || []).length;
      a.resumo = C().resumirArquivo(B().lerCSV(texto), planta, a.nome, { compensar: a.compensar || [], compensacao: a.regras || regras(), linhas: vazio ? null : linhas });
      a.linhas = vazio ? null : linhas;
      await gravar();
      ui.toast(mensagem, 'ok');
    } catch (e) { ui.toast(`Não foi possível recalcular: ${e.message}`, 'erro', 7000); }
    render();
  }

  /** Regras mudaram: recalcula todos os arquivos guardados, para a Montagem e a Tela do carro usarem as mesmas regras. */
  async function recalcularTodos() {
    const rg = regras();
    const lista = arquivos.filter((a) => !a.antigo);
    if (!lista.length) return;
    processando = true;
    render();
    let feitos = 0; const perdidas = [];
    for (const a of lista) {
      ui.toast(`Recalculando ${feitos + 1}/${lista.length}: ${a.nome}…`, 'info', 3000);
      await new Promise((r) => setTimeout(r, 30));
      try {
        const texto = await lerCsv(a.id);
        if (!texto) continue;
        a.resumo = C().resumirArquivo(B().lerCSV(texto), planta, a.nome, { compensar: a.compensar || [], compensacao: rg, linhas: a.linhas });
        const mantidas = (a.compensar || []).filter((ch) => a.resumo.compensaveis.some((c) => c.chave === ch));
        if (mantidas.length < (a.compensar || []).length) perdidas.push(a.nome);
        a.compensar = mantidas;
        a.regras = rg;
        feitos++;
      } catch (e) { ui.toast(`${a.nome}: ${e.message}`, 'erro', 7000); }
    }
    processando = false;
    await gravar();
    ui.toast(perdidas.length
      ? `${feitos} arquivo(s) recalculados. Pelas regras novas, compensações deixaram de valer em: ${perdidas.join(', ')}.`
      : `${feitos} arquivo(s) recalculados com as regras novas.`, perdidas.length ? 'erro' : 'ok', perdidas.length ? 9000 : 4000);
    render();
  }

  /**
   * Roda o arquivo na Tela do carro (Offboard), com o recorte, as compensações e as regras dele.
   * alvo = { i } (ponto do arquivo, exato mesmo com o km compensado) ou { km } (km do arquivo).
   */
  async function abrirNaTela(a, alvo = null) {
    const texto = await lerCsv(a.id).catch(() => null);
    if (!texto) { semCsv(); return false; }
    window.dispatchEvent(new CustomEvent('em80:checklist-aba', { detail: 'tela' }));
    ui.toast(`Abrindo ${a.nome} na Tela do carro…`, 'info', 2500);
    await new Promise((r) => setTimeout(r, 30));
    App.analise.abrirTexto(texto, a.nome, { recorte: a.recorte, compensar: a.compensar || [], regras: a.regras || regras(), linhas: a.linhas || null });
    atual = a.id;
    if (App.telaCarro.aoMostrar) App.telaCarro.aoMostrar();
    if (alvo && Number.isInteger(alvo.i)) App.telaCarro.irParaPonto(alvo.i);
    else if (alvo && alvo.km !== undefined && alvo.km !== null) App.telaCarro.irParaKm(String(Math.round(alvo.km) / 1000).replace('.', ','));
    return true;
  }
  let atual = null; // arquivo da Montagem rodando na Tela do carro

  /* ---------------- Desenho da faixa (km) ---------------- */

  const NS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs) { const el = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v)); return el; }

  /** Faixa horizontal do km: cinza = precisa medir, verde = medido, vermelho = buraco, laranja = medido 2×. */
  function faixa(linha, ini, fim, { divisas = true } = {}) {
    const L = 1000; const A = 14;
    const x = (m) => ((m - ini) / Math.max(1, fim - ini)) * L;
    const larg = (a, b) => Math.max(1.2, x(b) - x(a));
    const el = svg('svg', { viewBox: `0 0 ${L} ${A}`, preserveAspectRatio: 'none', class: 'mt-faixa', role: 'img', 'aria-label': 'Cobertura do trecho' });
    const dentro = (s) => s.fim > ini && s.ini < fim;
    linha.sedes.filter(dentro).forEach((s) => el.appendChild(svg('rect', { x: x(Math.max(ini, s.ini)), y: 2, width: larg(Math.max(ini, s.ini), Math.min(fim, s.fim)), height: 10, class: 'mt-nec' })));
    linha.sedes.filter(dentro).forEach((s) => s.cobertos.forEach(([a, b]) => { if (b > ini && a < fim) el.appendChild(svg('rect', { x: x(Math.max(a, ini)), y: 2, width: larg(Math.max(a, ini), Math.min(b, fim)), height: 10, class: 'mt-cob' })); }));
    // buraco em vermelho só nas sedes que já têm arquivo; nas outras o trecho todo é "falta medir"
    linha.buracos.filter((b) => b.fim > ini && b.ini < fim && linha.sedes.some((s) => s.sede === b.sede && s.coberto > 0))
      .forEach((b) => el.appendChild(svg('rect', { x: x(Math.max(b.ini, ini)), y: 2, width: larg(Math.max(b.ini, ini), Math.min(b.fim, fim)), height: 10, class: 'mt-bur' })));
    linha.sobreposicoes.filter((o) => o.fim > ini && o.ini < fim).forEach((o) => el.appendChild(svg('rect', { x: x(Math.max(o.ini, ini)), y: 0, width: larg(Math.max(o.ini, ini), Math.min(o.fim, fim)), height: 3, class: 'mt-sob' })));
    // um traço fino em cada RH (pátio): mostra até que RH o trecho já foi medido
    linha.sedes.filter(dentro).flatMap((s) => s.rh || []).forEach((p) => {
      const meio = (p.ini + p.fim) / 2;
      if (meio < ini || meio > fim) return;
      el.appendChild(svg('line', { x1: x(meio), x2: x(meio), y1: 1, y2: 13, class: 'mt-rh' }));
    });
    const comDica = dicaFaixa(el, linha, ini, fim);
    if (!divisas) return comDica;
    // nomes das sedes em HTML (o SVG é esticado na largura e deformaria o texto)
    const rotulos = h('div', { class: 'mt-rotulos' });
    linha.sedes.filter(dentro).forEach((s, k) => {
      const xa = x(Math.max(ini, s.ini)); const xb = x(Math.min(fim, s.fim));
      if (k) el.appendChild(svg('line', { x1: xa, x2: xa, y1: 0, y2: 16, class: 'mt-div' }));
      rotulos.appendChild(h('span', { style: `left:${xa / 10}%;width:${(xb - xa) / 10}%`, text: C().normSede(s.sede), title: `${s.sede} ${km(s.ini)} – ${km(s.fim)}` }));
    });
    return h('div', { class: 'mt-faixa-caixa' }, comDica, rotulos);
  }

  /**
   * Dica da faixa: passando o mouse ou tocando, mostra o km daquele ponto, se está medido, buraco ou falta medir,
   * a sede e o RH (pátio) em que está ou o mais próximo.
   */
  function dicaFaixa(el, linha, ini, fim) {
    const dica = h('div', { class: 'mt-dica', hidden: true, role: 'status' });
    const cursor = h('div', { class: 'mt-dica-cursor', hidden: true });
    const caixa = h('div', { class: 'mt-faixa-dica' }, el, cursor, dica);
    const dentroDe = (p, iv) => iv.some(([a, b]) => p >= a && p <= b);
    const mostrar = (e) => {
      const ret = el.getBoundingClientRect();
      if (!ret.width) return;
      const fr = Math.min(1, Math.max(0, (e.clientX - ret.left) / ret.width));
      const p = ini + fr * (fim - ini);
      const sede = linha.sedes.find((s) => p >= s.ini && p <= s.fim);
      let situacao = 'fora do que precisa medir';
      if (sede) {
        if (linha.sobreposicoes.some((o) => p >= o.ini && p <= o.fim)) situacao = 'medido 2×';
        else if (dentroDe(p, sede.cobertos || [])) situacao = 'medido';
        else if (sede.coberto > 0 && linha.buracos.some((b) => p >= b.ini && p <= b.fim)) situacao = 'buraco';
        else situacao = 'falta medir';
      }
      const rhs = linha.sedes.flatMap((s) => s.rh || []);
      const noRh = rhs.find((q) => p >= q.ini && p <= q.fim);
      const perto = noRh ? null : rhs.reduce((m, q) => (!m || Math.abs((q.ini + q.fim) / 2 - p) < Math.abs((m.ini + m.fim) / 2 - p) ? q : m), null);
      const rhTxt = noRh ? `no ${noRh.nome || 'RH'}` : perto ? `${mTxt(Math.abs((perto.ini + perto.fim) / 2 - p))} ${(perto.ini + perto.fim) / 2 > p ? 'antes' : 'depois'} do ${perto.nome || 'RH'}` : '';
      ui.trocar(dica, h('strong', { text: `km ${km(p)}` }), h('span', { text: [situacao, sede ? C().normSede(sede.sede) : '', rhTxt].filter(Boolean).join(' · ') }));
      dica.hidden = false; cursor.hidden = false;
      const xr = fr * ret.width;
      cursor.style.left = `${xr}px`;
      dica.style.left = `${Math.min(Math.max(xr - dica.offsetWidth / 2, 0), Math.max(0, ret.width - dica.offsetWidth))}px`;
    };
    const esconder = () => { dica.hidden = true; cursor.hidden = true; };
    el.addEventListener('pointermove', mostrar);
    el.addEventListener('pointerdown', mostrar);
    el.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') esconder(); });
    return caixa;
  }

  function cabecalho() {

  function ramalEscolhido() {

  function resumoGeral(linhas) {
    const nec = linhas.reduce((s, l) => s + l.necessario, 0);
    const cob = linhas.reduce((s, l) => s + l.coberto, 0);
    const bur = linhas.reduce((s, l) => s + l.buracos.filter((b) => l.sedes.find((x) => x.sede === b.sede && x.coberto > 0)).length, 0);

        h('div', { class: 'kpi-barra' }, h('span', { style: `width:${Math.min(100, pct)}%` })), h('div', { class: 'kpi-sub', text: `${kmTxt(cob)} de ${kmTxt(nec)}` })),
      kpi('Falta medir', kmTxt(Math.max(0, nec - cob)), 'pela geometria'),
      kpi('Buracos', String(bur), 'entre arquivos', bur ? 'kpi-ruim' : ''),
      kpi('Divisas abertas', String(div), 'sede não encosta na vizinha', div ? 'kpi-ruim' : ''),
      kpi('Sobreposições', String(sob), 'trecho em 2 arquivos', sob ? 'kpi-atencao' : ''));
  }

  function selo(situacao) {
    const t = { ok: ['mt-ok', '✓ encosta'], buraco: ['mt-erro', '✗ buraco'], pendente: ['mt-pend', 'falta arquivo'] }[situacao];
    return h('span', { class: `mt-selo ${t[0]}`, text: t[1] });
  }

  /** Onde está o buraco: salto dentro de um arquivo, entre dois arquivos, antes ou depois deles. */
  function onde(b) {
    const mesmo = b.antes.filter((n) => b.depois.includes(n));
    if (mesmo.length) return ` · salto do km dentro de ${mesmo.join(', ')}`;
    if (b.antes.length && b.depois.length) return ` · entre ${b.antes.join(', ')} e ${b.depois.join(', ')}`;
    if (b.depois.length) return ` · antes de ${b.depois.join(', ')}`;
    if (b.antes.length) return ` · depois de ${b.antes.join(', ')}`;
    return '';
  }

  function cartaoLinha(l) {
    const ini = l.sedes.length ? l.sedes[0].ini : 0; const fim = l.sedes.length ? l.sedes[l.sedes.length - 1].fim : 1;

      const chave = `${l.linha}|${s.sede}`;
      const aberto = abertos.has(chave);
      const div = l.fronteiras.find((f) => f.de === s.sede && Math.abs(f.km - s.fim) < 1000);

      linhasTabela.push(h('tr', { tabindex: 0, class: aberto ? 'mt-aberta' : '', onclick: () => { if (aberto) abertos.delete(chave); else abertos.add(chave); render(); } },

        h('td', { class: 'num', text: buracos.length ? String(buracos.length) : '—' }),
        h('td', { class: 'num', text: s.arquivos.length ? String(s.arquivos.length) : '—' }),
        h('td', null, div ? h('span', null, selo(div.situacao), h('span', { class: 'mt-sub', text: ` → ${C().normSede(div.para)}` })) : '')));
      if (aberto) {
        const itens = [];
        s.arquivos.forEach((n) => itens.push(h('li', null, ui.icone('documento'), h('span', { text: n }))));
        // até onde foi medido, pelos RH (pátios) que ficam dentro de cada trecho medido
        (s.cobertos || []).forEach(([a, b]) => {
          const dentroRh = (s.rh || []).filter((p) => (p.ini + p.fim) / 2 >= a && (p.ini + p.fim) / 2 <= b);
          const pelosRh = dentroRh.length ? ` · ${dentroRh[0].nome}${dentroRh.length > 1 ? ` → ${dentroRh[dentroRh.length - 1].nome}` : ''}` : '';

  /** Sede do arquivo: coluna CORRETIVA (GV1, CS…); sem ela, a sede onde o arquivo caiu na geometria. */
  const sedeDo = (a, conferencia) => {
    if (a.resumo.corretiva) return a.resumo.corretiva;

    const t = conf && [...conf.trechos].sort((x, y) => y.m - x.m)[0];

  const dataIso = (d) => { const m = /^(\d{2})\/(\d{2})\/(\d{4})/.exec(String(d || '').trim()); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };

  function cartaoArquivos(todos, conferencia) {

          h('div', null, h('button', { class: 'btn btn-primario btn-pequeno', disabled: processando || null, onclick: () => input.click() }, ui.icone('upload'), 'Adicionar de novo'), input)) : null,

          const avisos = [...conf.avisos, ...r.inconsistencias];
          const ondeCaiu = [...new Map(conf.trechos.map((t) => [`${t.linha}|${t.sede}`, t])).values()].map((t) => `L${t.linha} ${C().normSede(t.sede)} ${kmTxt(t.m)}`).join(' · ');
          const erros = avisos.filter((x) => x.tipo === 'erro').length; const alertas = avisos.filter((x) => x.tipo === 'alerta').length;
          // corte: os campos guardam o valor digitado; só vale ao clicar em "Aplicar corte"
          const pend = cortes.get(a.id) || { de: a.recorte ? a.recorte.de ?? null : null, ate: a.recorte ? a.recorte.ate ?? null : null };

            h('div', { class: 'pilha mt-arquivo-corpo' },
              h('p', { class: 'mt-sub', text: `Caiu em: ${ondeCaiu || '—'} · correção do km pela geometria ${Math.round(r.correcao.min)} a ${Math.round(r.correcao.max)} m · ${r.correcao.casadas}/${r.correcao.curvas} curvas casadas` }),
